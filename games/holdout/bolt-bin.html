  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);

  s.connect(f);f.connect(g);g.connect(master);s.start(t);
}

  var t=G.t,a=t<.18?eOut(t/.18):1-eIn((t-.78)/.27),sc=t<.2?eBack(t/.2):1;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.translate(195,V.boardY+176);ctx.scale(sc,sc);
  rrect(-142,-39,284,78,24);ctx.fillStyle='rgba(13,41,46,.94)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#FFE28A';ctx.stroke();
  txt('LEVEL '+(levelIdx+1),0,-13,31,'#FFFFFF',{max:260});
  txt(LEVELS[levelIdx].n,0,20,19,'#FFE28A',{max:260});
  ctx.restore();
}
function drawClear(){
  var t=phaseT,sc=t<.32?eBack(t/.32):1,cy=V.boardY+170;
  ctx.save();ctx.globalAlpha=clamp(t*5,0,1)*.42;ctx.fillStyle='#0A1C20';ctx.fillRect(lLeft(),lTop(),lRight()-lLeft(),lBottom()-lTop());ctx.restore();
  ctx.save();ctx.translate(195,cy);ctx.scale(sc,sc);ctx.rotate(Math.sin(t*5)*.018);
  txt('BENCH CLEAR!',0,-18,43,'#FFFFFF',{stroke:'#143039',sw:11,max:350});
  txt('BENCH CLEAR!',0,-20,43,'#FFE05C',{max:350});
  for(var i=0;i<3;i++)drawStar(-52+i*52,42+(i===1?-7:0),i===1?25:20,true,Math.sin(t*3+i)*.1);
  ctx.restore();
  txt('+100',195,cy+98-eOut(t)*10,27,'#FFF2A8',{stroke:'#143039',sw:7});
}
function btn(r,label,pressed,c1,c2,edge){
  var py=pressed?3:0;
  rrect(r.x,r.y+5,r.w,r.h,r.h/2);ctx.fillStyle=edge;ctx.fill();
  rrect(r.x,r.y+py,r.w,r.h,r.h/2);var g=ctx.createLinearGradient(0,r.y,0,r.y+r.h);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#FFFFFF';ctx.stroke();
  ctx.save();rrect(r.x+7,r.y+5+py,r.w-14,r.h*.34,r.h*.17);ctx.fillStyle='rgba(255,255,255,.34)';ctx.fill();ctx.restore();
  txt(label,r.x+r.w/2,r.y+r.h/2+py+1,r.h*.44,'#FFFFFF',{stroke:edge,sw:5,max:r.w-34});
}
function drawFail(final){
  var t=phaseT,a=clamp(t*4.2,0,1),L=V.lh,cy=L*.47,sc=t<.28?eBack(t/.28):1;
  ctx.save();ctx.globalAlpha=a*.72;ctx.fillStyle='#0A1619';ctx.fillRect(lLeft(),lTop(),lRight()-lLeft(),lBottom()-lTop());ctx.restore();
  ctx.save();ctx.translate(195,cy);ctx.scale(sc,sc);
  var ph=final?258:322;rrect(-165,-160,330,ph,28);var g=ctx.createLinearGradient(0,-160,0,162);g.addColorStop(0,'#FFF6E4');g.addColorStop(1,'#F0D8B0');ctx.fillStyle=g;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#573410';ctx.stroke();
  rrect(-153,-148,306,ph-24,20);ctx.lineWidth=2;ctx.strokeStyle='rgba(120,78,30,.4)';ctx.stroke();
  txt('TRAY JAMMED!',0,-117,35,'#E5343A',{stroke:'#FFFFFF',sw:7,max:292});
  drawRobot(0,-28,1.02,'sad');
  txt(final?'Out of retries':'Fill the open boxes first',0,50,19,'#4A321B',{max:290});
  ctx.restore();
  UI.retry=null;
  if(!final){
    var r={x:195-105,y:cy+78,w:210,h:58};
    if(t>.2){UI.retry=r;btn(r,'TRY AGAIN',press==='retry','#39D178','#149A52','#0A6738')}
  }
}
function drawLogo(cx,cy,s){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  var word=function(str,y,px,cg){
    ctx.font='900 '+px+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.lineWidth=px*.3;ctx.strokeStyle='#123036';ctx.strokeText(str,0,y+4);ctx.strokeText(str,0,y);
    var g=ctx.createLinearGradient(0,y-px/2,0,y+px/2);g.addColorStop(0,cg[0]);g.addColorStop(.52,cg[1]);g.addColorStop(1,cg[2]);ctx.fillStyle=g;ctx.fillText(str,0,y);
  };
  word('BOLT',-30,70,['#FFF7BA','#FFCB2E','#FF8A10']);
  word('BIN',32,60,['#FFFFFF','#BDF0FF','#47AEEA']);
  drawBolt(101,27,21,'r',T*.9,0);
  drawBolt(-101,27,21,'b',-T*.9,0);
  ctx.restore();
}
function drawEnd(){
  var t=phaseT,a=clamp(t/.32,0,1),L=V.lh,lf=lLeft(),rg=lRight(),tp=lTop(),bt=lBottom();
  ctx.save();ctx.globalAlpha=a;
  var g=ctx.createLinearGradient(0,tp,0,bt);g.addColorStop(0,'#0F3F48');g.addColorStop(.55,'#1E6A6C');g.addColorStop(1,'#123840');ctx.fillStyle=g;ctx.fillRect(lf,tp,rg-lf,bt-tp);
  var cy=L*.41;
  ctx.save();ctx.translate(195,cy);ctx.rotate(T*.13);
  for(var i=0;i<14;i++){ctx.rotate(TAU/14);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-48,-720);ctx.lineTo(48,-720);ctx.closePath();ctx.fillStyle='rgba(255,236,168,.052)';ctx.fill()}
  ctx.restore();
  var gl=ctx.createRadialGradient(195,cy,16,195,cy,190);gl.addColorStop(0,'rgba(255,233,158,.42)');gl.addColorStop(1,'rgba(255,233,158,0)');ctx.fillStyle=gl;ctx.fillRect(lf,tp,rg-lf,bt-tp);
  drawLogo(195,L*.142,.94+Math.sin(T*2.2)*.012);
  ['r','b','y','g','p'].forEach(function(c,k){
    var an=T*.8+k/5*TAU,rx=124,ry=38,x=195+Math.cos(an)*rx,y=cy+12+Math.sin(an)*ry;
    if(Math.sin(an)<0)drawBolt(x,y,15,c,T*3+k,.2);
  });
  ctx.fillStyle='rgba(4,20,22,.42)';ctx.beginPath();ctx.ellipse(195,cy+79,76,13,0,0,TAU);ctx.fill();
  drawRobot(195,cy+8,1.48,endWon?'happy':'idle');
  ['r','b','y','g','p'].forEach(function(c,k){
    var an=T*.8+k/5*TAU,rx=124,ry=38,x=195+Math.cos(an)*rx,y=cy+12+Math.sin(an)*ry;
    if(Math.sin(an)>=0)drawBolt(x,y,15,c,T*3+k,.2);
  });
  var title=endWon?'Bench Cleared!':'So Close!',ty=L*.615;
  txt(title,195,ty+3,38,'#0A2329',{stroke:'#0A2329',sw:9,max:340});
  txt(title,195,ty,38,'#FFFFFF',{max:340});
  var stars=endWon?(retries>0?3:2):1;
  for(var s=0;s<3;s++){var ap=clamp((t-.26-s*.14)/.24,0,1),on=s<stars,z=on?eBack(ap):1,yy=L*.692+(s===1?-5:0);ctx.save();ctx.translate(145+s*50,yy);ctx.scale(z,z);drawStar(0,0,s===1?24:20,on,Math.sin(T*1.8+s)*.08);ctx.restore()}
  var cw=134,cx=195-cw/2,yc=L*.76;
  rrect(cx,yc-17,cw,34,14);ctx.fillStyle='rgba(5,28,32,.72)';ctx.fill();ctx.lineWidth=1.8;ctx.strokeStyle='rgba(255,222,126,.72)';ctx.stroke();
  drawCoin(cx+20,yc,11);txt(String(Math.round(coinsShown)),cx+78,yc+.5,20,'#FFE680',{max:82});
  txt('Sort bolts, drop plates, feel tidy.',195,L*.818,19,'#E8FFFA',{max:340,w:800});
  var bw=270+Math.sin(T*4)*5,bh=66+Math.sin(T*4)*1.4,r={x:195-bw/2,y:L*.895-bh/2,w:bw,h:bh};
  UI.cta=t>.3?{x:195-135,y:L*.895-33,w:270,h:66}:null;
  btn(r,'PLAY NOW',press==='cta','#FFB32B','#F46E11','#A83F04');
  var sh=(T*.55)%1;
  ctx.save();rrect(r.x,r.y,r.w,r.h,r.h/2);ctx.clip();ctx.translate(r.x-60+(r.w+120)*sh,r.y);ctx.rotate(.35);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(-13,-30,26,140);ctx.restore();
  ctx.restore();
  ctx.save();ctx.globalAlpha=a;drawParts();ctx.restore();
}
function drawLoad(){
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  var g=ctx.createLinearGradient(0,0,0,V.vh);g.addColorStop(0,'#123F48');g.addColorStop(1,'#0E2C33');ctx.fillStyle=g;ctx.fillRect(0,0,V.vw,V.vh);
  view();
  var L=V.lh,p=clamp(phaseT/1.0,0,1);
  drawLogo(195,L*.36,1.02+Math.sin(T*6)*.012);
  drawRobot(195,L*.61,1.1,'happy');
  var w=210,x=195-w/2,y=L*.76;
  rrect(x,y,w,16,8);ctx.fillStyle='#07181C';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#BFE9E3';ctx.stroke();
  if(p>.03){rrect(x+3,y+3,(w-6)*p,10,5);var bg2=ctx.createLinearGradient(x,0,x+w,0);bg2.addColorStop(0,'#FFC928');bg2.addColorStop(1,'#FF7D16');ctx.fillStyle=bg2;ctx.fill()}
  txt('Warming up the workshop',195,y+36,16,'#D7F7F1',{max:300,w:800});
}
function render(){
  ctx=mainCtx;
  ctx.setTransform(1,0,0,1,0,0);
  if(phase==='load'){drawLoad();return}
  ctx.drawImage(bg,0,0);
  view();
  UI.mute=null;
  drawWorld();
  if(phase!=='end'){drawHud();drawHint();drawLevelBanner()}
  if(phase==='clear')drawClear();
  if(phase==='fail')drawFail(false);
  if(phase==='out')drawFail(true);
  if(phase==='end'){UI.retry=null;drawEnd()}
}

/* ---------- input ---------- */
function toL(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-V.ox)/V.u,y:(e.clientY-r.top-V.oy)/V.u}}
function inR(p,r,pad){return r&&p.x>=r.x-pad&&p.x<=r.x+r.w+pad&&p.y>=r.y-pad&&p.y<=r.y+r.h+pad}
function padFor(r){return Math.max(0,(44/V.u-Math.min(r.w,r.h))/2)}
function worldTap(p){
  var g=G;if(phase!=='play'||!g||g.over||g.t<g.readyAt)return;
  var bx=p.x-BX,by=p.y-V.boardY,hr=Math.max(28,22/V.u),best=null,bd=1e9,cov=null,cd=1e9;
  g.bolts.forEach(function(b){
    if(b.st!=='on')return;
    var d=Math.hypot(b.x-bx,b.y-by);if(d>hr)return;
    if(isFree(b)){if(d<bd){bd=d;best=b}}else if(d<cd){cd=d;cov=b}
  });
  if(best){
    if(tapBolt(best)){idle=0;hintOn=false;hintBolt=null}
  }else if(cov){
    denied(cov);idle=Math.min(idle,2);
  }else{
    for(var i=g.plates.length-1;i>=0;i--){var q=g.plates[i];if(q.alive&&inPoly(bx,by,q.v)){q.wig=.7;sfx.tap();break}}
  }
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();initAudio();
  var p=toL(e);press=null;
  if(UI.mute&&phase!=='end'&&inR(p,UI.mute,padFor(UI.mute))){press='mute';return}
  if(phase==='fail'&&UI.retry&&inR(p,UI.retry,padFor(UI.retry))){press='retry';return}
  if(phase==='end'&&UI.cta&&inR(p,UI.cta,padFor(UI.cta))){press='cta';return}
  worldTap(p);
});
cv.addEventListener('pointerup',function(e){
  e.preventDefault();var p=toL(e),was=press;press=null;
  if(was==='mute'&&UI.mute&&inR(p,UI.mute,padFor(UI.mute))){muted=!muted;if(master)master.gain.value=muted?0:.55;if(!muted)sfx.tap()}
  if(was==='retry'&&phase==='fail'&&UI.retry&&inR(p,UI.retry,padFor(UI.retry))){sfx.tap();retries--;coins=levelCoins;coinsShown=coins;robo.mood='idle';startLevel(levelIdx)}
  if(was==='cta'&&phase==='end'&&UI.cta&&inR(p,UI.cta,padFor(UI.cta))&&ctaCool<=0){
    ctaCool=.9;sfx.tap();
    if(window.mraid&&typeof window.mraid.open==='function')window.mraid.open(URL_CTA);else window.open(URL_CTA,'_blank');
  }
});
cv.addEventListener('pointercancel',function(){press=null});
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
document.addEventListener('visibilitychange',function(){if(AC){if(document.hidden)AC.suspend();else if(!muted)AC.resume()}last=0});

/* ---------- loop ---------- */
var last=0,acc=0,DT=1/60;
function frame(ts){
  if(!last)last=ts;
  var d=Math.min(.1,(ts-last)/1000);last=ts;acc+=d;
  var guard=0;while(acc>=DT&&guard<8){step(DT);acc-=DT;guard++}
  if(guard===8)acc=0;
  render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
