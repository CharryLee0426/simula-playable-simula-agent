<!DOCTYPE html>
<html lang="en">

<style>

<script>
(function () {

// ---------------------------------------------------------------- utils

}

  var xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;

var I3 = [1, 0, 0, 0, 1, 0, 0, 0, 1];

// ---------------------------------------------------------------- audio
var SFX = (function () {
  var ac = null, sfx = null, mus = null, noiseBuf = null, nextT = 0, step = 0;

  var CH = [[62, 66, 69, 73], [59, 62, 66, 69], [55, 59, 62, 66], [57, 61, 64, 69]];
  var LEAD = [78, 0, 0, 76, 0, 73, 0, 0, 74, 0, 0, 73, 0, 69, 0, 0, 71, 0, 0, 69, 0, 66, 0, 0, 69, 0, 71, 0, 73, 0, 0, 0];

    place: function (n) { tone(160 + n * 6, 0.16, 'sine', 0.5, 0, 70); noise(0.08, 0.25, 900, 1, 0, 'lowpass'); },

// ---------------------------------------------------------------- canvases

  slowBtn.style.top = (H - 30 * S - bs) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- renderer
var R = null;
function initGL() {

    'attribute vec3 aPos; attribute vec3 aNor;',
    'uniform mat4 uVP; uniform vec3 uPos; uniform vec3 uScale; uniform mat3 uRot;',
    'varying vec3 vN; varying vec3 vLN; varying vec3 vW; varying vec3 vL;',

    '}'].join('\n');

    '#ifdef GL_FRAGMENT_PRECISION_HIGH',
    'precision highp float;',
    '#else',

    '#endif',

    'uniform vec3 uCam; uniform vec3 uTop; uniform vec3 uBot; uniform float uResY; uniform vec2 uFogR; uniform float uFogLow;',
    'uniform vec3 uLight; uniform vec3 uSkyC; uniform vec3 uGndC;',
    'varying vec3 vN; varying vec3 vLN; varying vec3 vW; varying vec3 vL;',
    'void main(){',

  // moving slab
  if (cur && (state === 'play' || state === 'intro')) {
    var top = blocks[blocks.length - 1], ax = cur.axis, c0 = top[ax], sp = speedFor(floors);
    cur[ax] += cur.dir * sp * dt;
    if (cur[ax] > c0 + RANGE) { cur[ax] = c0 + RANGE; cur.dir = -1; }
    else if (cur[ax] < c0 - RANGE) { cur[ax] = c0 - RANGE; cur.dir = 1; }
  }

  // session clock
  if (state === 'intro' || state === 'play') sessT += rdt;
  if (state === 'intro' && stateT > 1.4) state = 'play';
  if (!timerOn && state === 'play' && sessT >= AUTOSTART && timeLeft > 0) timerOn = true;
  if (timerOn && state === 'play') {
    timeLeft -= rdt;
    var whole = Math.ceil(timeLeft);
    if (whole <= 5 && whole < lastTick && whole > 0) { lastTick = whole; SFX.tick(); }
    if (timeLeft <= 10 && timeLeft + rdt > 10 && SESSION > 15) banner('HURRY!', '10 seconds left', '#ff7a8a', 1.2);
    if (timeLeft <= 0) {
      timeLeft = 0; timerOn = false; endReason = 'time'; state = 'timeup'; stateT = 0;
      if (cur) { debris.push({ x: cur.x, y: cur.y, z: cur.z, w: cur.w, d: cur.d, color: cur.color, vx: 0, vy: 0, vz: 0, ang: 0, av: 1.5, axx: 1, axz: 0, life: 0 }); cur = null; }
      slowBtn.classList.remove('show');
      banner("TIME'S UP!", floors + ' floors built', '#ff9a5a', 1.6);
      SFX.lose();
    }
  }
  if (tutT >= 0 && !firstTap) tutT += rdt;

  if (state === 'fail' && stateT > 1.7) { SFX.lose(); showResults(); }
  if (state === 'timeup' && stateT > 1.8) showResults();
  if (state === 'win') {
    if (stateT > 0.3 && Math.random() < rdt * 6) {
      var fx = rand(40, 320), fy = rand(130, 360);
      sparkBurst(fx, fy, 24, rgbStr(hsl(rand(0, 360), 0.9, 0.7)));
      if (Math.random() < 0.5) SFX.pop();
    }
    if (stateT > 4.2) showResults();
  }
  if (state === 'results') {
    resT += rdt;
    var left = Math.ceil(RES_HOLD - resT);
    autoEl.textContent = left > 0 ? (retryBtn.style.display === 'none' ? 'Tap to continue' : 'Continuing in ' + left + '...') : '';
    if (resT >= RES_HOLD) showEnd();
  }

  // camera
  var topB = blocks[blocks.length - 1];
  var topY = topB.y + SLAB_H / 2;
  var aspect = W / H, vfov = 40 * Math.PI / 180;
  var hHalf = Math.atan(Math.tan(vfov / 2) * aspect);
  var baseD = clamp(5.9 / Math.tan(hHalf), 16, 32);
  var ty = topY + 2.0, td = baseD, tyaw = Math.PI / 4;
  if (state === 'win' || ((state === 'results' || state === 'end') && endReason === 'win')) {
    ty = topY * 0.5 + 1; td = Math.max(baseD, (topY + 6) * 1.25 / Math.tan(vfov / 2) * 0.5 + 6);
    tyaw = cam.yaw + rdt * 0.5;
  } else if (state === 'end') { tyaw = cam.yaw + rdt * 0.15; }
  var k = 1 - Math.exp(-rdt * (state === 'intro' ? 2.6 : 3.2));
  cam.y += (ty - cam.y) * k;
  cam.d += (td - cam.d) * k;
  cam.yaw += (tyaw - cam.yaw) * k;
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - rdt);
}

// ---------------------------------------------------------------- render 3D
var SKY = [
  { a: 0.0, top: [0.28, 0.6, 1.0], bot: [0.8, 0.93, 1.0], sun: [1.0, 0.95, 0.75], sp: [0.2, 0.84], st: 0 },
  { a: 0.45, top: [0.22, 0.4, 0.86], bot: [1.0, 0.82, 0.62], sun: [1.0, 0.82, 0.5], sp: [0.26, 0.66], st: 0 },
  { a: 0.78, top: [0.16, 0.15, 0.46], bot: [1.0, 0.52, 0.5], sun: [1.0, 0.58, 0.38], sp: [0.7, 0.4], st: 0.35 },
  { a: 1.0, top: [0.04, 0.05, 0.17], bot: [0.4, 0.24, 0.58], sun: [0.8, 0.85, 1.0], sp: [0.76, 0.8], st: 1 }
];
function skyAt(a) {
  a = clamp(a, 0, 1);
  for (var i = 0; i < SKY.length - 1; i++) {
    var A = SKY[i], B = SKY[i + 1];
    if (a <= B.a) {
      var t = (a - A.a) / (B.a - A.a); t = t * t * (3 - 2 * t);
      return { top: lerp3(A.top, B.top, t), bot: lerp3(A.bot, B.bot, t), sun: lerp3(A.sun, B.sun, t), sp: [lerp(A.sp[0], B.sp[0], t), lerp(A.sp[1], B.sp[1], t)], st: lerp(A.st, B.st, t) };
    }
  }
  var L = SKY[SKY.length - 1]; return { top: L.top, bot: L.bot, sun: L.sun, sp: L.sp, st: L.st };
}

var curSky = skyAt(0);
function render3D() {
  if (!gl || !R) return;
  gl.viewport(0, 0, glc.width, glc.height);
  var alt = (cam.y - 2) / (GOAL * SLAB_H);
  curSky = skyAt(alt);
  // sky
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND);
  gl.useProgram(R.sky.p);
  gl.bindBuffer(gl.ARRAY_BUFFER, R.sb);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.disableVertexAttribArray(1);
  var u = R.sky.u;
  gl.uniform3fv(u.uTop, curSky.top); gl.uniform3fv(u.uBot, curSky.bot); gl.uniform1f(u.uStars, curSky.st);
  gl.uniform1f(u.uTime, bgT); gl.uniform2fv(u.uSun, curSky.sp); gl.uniform3fv(u.uSunC, curSky.sun);
  gl.uniform1f(u.uAspect, W / H); gl.uniform1f(u.uScroll, cam.y * 0.11);
  gl.uniform3fv(u.uCloudC, lerp3([1, 1, 1], curSky.bot, 0.3)); gl.uniform1f(u.uCloudA, 0.62 - 0.35 * curSky.st);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // camera
  var sx = 0, sy = 0;
  if (cam.shake > 0) { sx = rand(-1, 1) * cam.shake * 0.5; sy = rand(-1, 1) * cam.shake * 0.5; }
  var target = [sx, cam.y + sy, sx];
  eye = [target[0] + Math.cos(cam.pitch) * Math.cos(cam.yaw) * cam.d, target[1] + Math.sin(cam.pitch) * cam.d, target[2] + Math.cos(cam.pitch) * Math.sin(cam.yaw) * cam.d];
  var P = perspective(40 * Math.PI / 180, W / H, 0.5, 260);
  var V = lookAt(eye, target, [0, 1, 0]);
  VP = mul4(P, V);

  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(R.box.p);
  gl.bindBuffer(gl.ARRAY_BUFFER, R.vb); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, R.ib);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
  u = R.box.u;
  gl.uniformMatrix4fv(u.uVP, false, new Float32Array(VP));
  gl.uniform3fv(u.uCam, eye);
  gl.uniform3fv(u.uTop, curSky.top); gl.uniform3fv(u.uBot, curSky.bot); gl.uniform1f(u.uResY, glc.height);
  gl.uniform2f(u.uFogR, cam.d + 6, cam.d + 70);
  gl.uniform1f(u.uFogLow, cam.y - 11);
  var L = [0.5, 0.82, 0.28], ll = Math.hypot(L[0], L[1], L[2]);
  gl.uniform3f(u.uLight, L[0] / ll, L[1] / ll, L[2] / ll);
  gl.uniform3fv(u.uSkyC, lerp3([0.95, 0.97, 1.0], curSky.top, 0.35));
  gl.uniform3fv(u.uGndC, [0.42, 0.36, 0.5]);

  function box(x, y, z, w, h, d, col, alpha, emis, bevel, rot) {
    gl.uniform3f(u.uPos, x, y, z); gl.uniform3f(u.uScale, w, h, d); gl.uniform3f(u.uSize, w, h, d);
    gl.uniformMatrix3fv(u.uRot, false, rot || I3);
    gl.uniform3fv(u.uColor, col); gl.uniform1f(u.uAlpha, alpha); gl.uniform1f(u.uEmis, emis); gl.uniform1f(u.uBevel, bevel);
    gl.drawElements(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0);
  }
  // ground + skyline + foundation
  var i;
  for (i = 0; i < decor.length; i++) { var dc = decor[i]; box(dc.x, dc.y, dc.z, dc.w, dc.h, dc.d, dc.c, 1, 0, dc.bev, dc.rot); }
  // tower
  for (i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    var sq = b.land < 1 ? 1 - 0.18 * Math.sin(b.land * Math.PI) : 1;
    box(b.x, b.y - (1 - sq) * SLAB_H * 0.5, b.z, b.w, SLAB_H * sq, b.d, b.color, 1, b.flash * 0.65, 0.07);
  }
  // moving slab
  if (cur) {
    var pulse = state === 'intro' || !firstTap ? 0.12 + 0.12 * Math.sin(bgT * 6) : 0;
    box(cur.x, cur.y, cur.z, cur.w, SLAB_H, cur.d, cur.color, 1, pulse, 0.07);
  }
  // debris
  for (i = 0; i < debris.length; i++) {
    var d = debris[i];
    box(d.x, d.y, d.z, d.w, SLAB_H, d.d, d.color, 1, 0, 0.07, axisRot(d.axx, 0, d.axz, d.ang));
  }
  // confetti
  for (i = 0; i < confetti.length; i++) {
    var c = confetti[i];
    box(c.x, c.y, c.z, 0.28, 0.04, 0.18, c.c, 1, 0.25, 0.01, axisRot(c.ax[0], c.ax[1], c.ax[2], c.ang));
  }

  // transparent pass
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  // drop shadow of the moving slab on the tower top (overlap only)
  if (cur && state === 'play') {
    var top = blocks[blocks.length - 1];
    var x0 = Math.max(cur.x - cur.w / 2, top.x - top.w / 2), x1 = Math.min(cur.x + cur.w / 2, top.x + top.w / 2);
    var z0 = Math.max(cur.z - cur.d / 2, top.z - top.d / 2), z1 = Math.min(cur.z + cur.d / 2, top.z + top.d / 2);
    if (x1 > x0 && z1 > z0) box((x0 + x1) / 2, top.y + SLAB_H / 2 + 0.012, (z0 + z1) / 2, x1 - x0, 0.01, z1 - z0, [0.05, 0.03, 0.15], 0.28, 1, 0.001);
  }
  // perfect ripples
  for (i = 0; i < ripples.length; i++) {
    var rp = ripples[i], t = rp.t / 0.6, m = 0.08 + easeOutCubic(t) * 1.3, a = (1 - t) * 0.95, th = 0.09;
    var W2 = rp.w + m * 2, D2 = rp.d + m * 2;
    box(rp.x, rp.y, rp.z - D2 / 2, W2, 0.05, th, [1, 1, 1], a, 1, 0.001);
    box(rp.x, rp.y, rp.z + D2 / 2, W2, 0.05, th, [1, 1, 1], a, 1, 0.001);
    box(rp.x - W2 / 2, rp.y, rp.z, th, 0.05, D2, [1, 1, 1], a, 1, 0.001);
    box(rp.x + W2 / 2, rp.y, rp.z, th, 0.05, D2, [1, 1, 1], a, 1, 0.001);
  }
  // clouds
  var cc = lerp3([1, 1, 1], curSky.bot, 0.2);
  for (i = 0; i < clouds.length; i++) {
    var cl = clouds[i], dx = Math.sin(bgT * 0.1 * cl.drift + i) * 1.2;
    box(cl.x + dx, cl.y, cl.z, cl.sx, cl.sy, cl.sz, cc, 0.4, 0.97, 0.001);
    box(cl.x + dx + cl.sx * 0.15, cl.y + cl.sy * 0.5, cl.z - cl.sz * 0.1, cl.sx * 0.6, cl.sy * 0.8, cl.sz * 0.6, cc, 0.35, 1, 0.001);
  }
  gl.depthMask(true); gl.disable(gl.BLEND);
}

// ---------------------------------------------------------------- render HUD
function text(txt, x, y, size, fill, stroke, lw, align) {
  hc.font = '900 ' + size + 'px ' + FONT;
  hc.textAlign = align || 'center'; hc.textBaseline = 'middle'; hc.lineJoin = 'round'; hc.miterLimit = 2;
  if (stroke) { hc.strokeStyle = stroke; hc.lineWidth = lw || size * 0.18; hc.strokeText(txt, x, y); }
  hc.fillStyle = fill; hc.fillText(txt, x, y);
}
function drawHand(x, y, s, press) {
  hc.save(); hc.translate(x, y); hc.rotate(-0.35); var k = s * (1 - 0.1 * press); hc.scale(k, k);
  var P = [
    function () { rr(hc, -12, 26, 46, 40, 14); },
    function () { rr(hc, 7, 20, 13, 26, 6.5); },
    function () { rr(hc, 18, 23, 13, 25, 6.5); },
    function () { rr(hc, 29, 28, 11, 22, 5.5); },
    function () { hc.save(); hc.translate(-9, 50); hc.rotate(-0.85); rr(hc, -22, -7, 26, 14, 7); hc.restore(); },
    function () { rr(hc, -8, 0, 16, 46, 8); },
    function () { rr(hc, -10, 62, 46, 14, 5); }
  ];
  hc.lineJoin = 'round';
  hc.shadowColor = 'rgba(0,0,0,0.35)'; hc.shadowBlur = 10; hc.shadowOffsetY = 5;
  hc.strokeStyle = '#12307a'; hc.lineWidth = 6;
  for (var i = 0; i < P.length; i++) { P[i](); hc.stroke(); }
  hc.shadowColor = 'transparent';
  hc.fillStyle = '#ffffff';
  for (i = 0; i < P.length - 1; i++) { P[i](); hc.fill(); }
  hc.fillStyle = '#ff8a3d'; P[P.length - 1](); hc.fill();
  hc.restore();
}
function renderHUD() {
  hc.setTransform(DPR, 0, 0, DPR, 0, 0);
  hc.clearRect(0, 0, W, H);
  if (!gl) {
    var g = hc.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#4aa0ff'); g.addColorStop(1, '#cfe9ff');
    hc.fillStyle = g; hc.fillRect(0, 0, W, H);
  }
  // slow-mo vignette
  if (timeScale < 0.98) {
    var va = (1 - timeScale) / 0.64;
    var vg = hc.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(60,200,255,0)'); vg.addColorStop(1, 'rgba(60,200,255,' + (0.45 * va).toFixed(3) + ')');
    hc.fillStyle = vg; hc.fillRect(0, 0, W, H);
  }
  hc.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  if (!gl) text('WebGL is not available', 180, 320, 20, '#fff', '#12307a', 4);
  var playing = state === 'play' || state === 'intro' || state === 'fail' || state === 'timeup' || state === 'win';
  if (playing) {
    // floors counter
    var pulse = 1;
    if (blocks.length > 1) { var lb = blocks[blocks.length - 1]; if (lb.land < 1) pulse = 1 + 0.15 * Math.sin(lb.land * Math.PI); }
    hc.save(); hc.translate(180, 64); hc.scale(pulse, pulse);
    text(String(floors), 0, 0, 62, '#ffffff', 'rgba(18,48,122,0.85)', 10);
    hc.restore();
    text('FLOORS', 180, 22, 13, 'rgba(255,255,255,0.95)', 'rgba(18,48,122,0.8)', 4);
    // goal bar
    var bx = 95, by = 104, bw = 170, bh = 12, pr = clamp(floors / GOAL, 0, 1);
    rr(hc, bx - 3, by - 3, bw + 6, bh + 6, 9); hc.fillStyle = 'rgba(18,48,122,0.55)'; hc.fill();
    if (pr > 0) {
      rr(hc, bx, by, Math.max(bh, bw * pr), bh, 6);
      var gg = hc.createLinearGradient(bx, 0, bx + bw, 0); gg.addColorStop(0, '#5af0ff'); gg.addColorStop(1, '#fff27a');
      hc.fillStyle = gg; hc.fill();
    }
    text(floors + ' / ' + GOAL, 180, by + bh + 14, 12, '#ffffff', 'rgba(18,48,122,0.8)', 3);
    // flag at the end of the bar
    hc.fillStyle = '#ffffff'; hc.fillRect(bx + bw + 8, by - 8, 2, 24);
    hc.beginPath(); hc.moveTo(bx + bw + 10, by - 8); hc.lineTo(bx + bw + 24, by - 3); hc.lineTo(bx + bw + 10, by + 2); hc.closePath();
    hc.fillStyle = '#ff6a5a'; hc.fill();
    // timer ring
    var frac = clamp(timeLeft / SESSION, 0, 1), low = timeLeft <= 10 && timerOn;
    hc.save(); hc.translate(320, 44); var tp = low ? 1 + Math.max(0, Math.sin(bgT * 12)) * 0.08 : 1; hc.scale(tp, tp);
    hc.beginPath(); hc.arc(0, 0, 25, 0, Math.PI * 2); hc.fillStyle = 'rgba(18,48,122,0.6)'; hc.fill();
    hc.beginPath(); hc.arc(0, 0, 21, 0, Math.PI * 2); hc.lineWidth = 5; hc.strokeStyle = 'rgba(255,255,255,0.2)'; hc.stroke();
    hc.beginPath(); hc.arc(0, 0, 21, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); hc.lineCap = 'round';
    hc.strokeStyle = frac > 0.5 ? '#5aff9a' : frac > 0.22 ? '#ffd23f' : '#ff5a6a'; hc.stroke();
    text(String(Math.ceil(timeLeft)), 0, 1, 18, low ? '#ffb0b8' : '#ffffff', 'rgba(18,48,122,0.9)', 4);
    hc.restore();
    // perfect streak chip
    if (streak >= 2 && state === 'play') {
      rr(hc, 14, 28, 86, 34, 17); hc.fillStyle = 'rgba(18,48,122,0.6)'; hc.fill();
      text('★ x' + streak, 57, 46, 18, '#fff27a', 'rgba(18,48,122,0.9)', 4);
    }
    // slow-mo meter
    if (slowT > 0) {
      var mw = 150 * (slowT / 6);
      rr(hc, 105, 150, 150, 10, 5); hc.fillStyle = 'rgba(18,48,122,0.55)'; hc.fill();
      rr(hc, 105, 150, Math.max(10, mw), 10, 5); hc.fillStyle = '#9ff3ff'; hc.fill();
      text('SLOW-MO', 180, 140, 13, '#9ff3ff', 'rgba(18,48,122,0.9)', 4);
    }
  }
  // tutorial
  if (!firstTap && (state === 'intro' || state === 'play')) {
    var cyc = (bgT % 1.2) / 1.2, press = cyc < 0.25 ? cyc / 0.25 : cyc < 0.45 ? 1 - (cyc - 0.25) / 0.2 : 0;
    var hx = 196, hy = 470;
    if (press > 0.2) {
      hc.beginPath(); hc.arc(hx - 4, hy - 6, 12 + 26 * (1 - press), 0, Math.PI * 2);
      hc.strokeStyle = 'rgba(255,255,255,' + (0.8 * press).toFixed(3) + ')'; hc.lineWidth = 4; hc.stroke();
    }
    drawHand(hx, hy + press * 6, 0.95, press);
    var ta = 0.88 + 0.12 * Math.sin(bgT * 4);
    hc.save(); hc.globalAlpha = ta;
    rr(hc, 40, 560, 280, 50, 25); hc.fillStyle = 'rgba(18,48,122,0.72)'; hc.fill();
    hc.lineWidth = 2; hc.strokeStyle = 'rgba(255,255,255,0.45)'; hc.stroke();
    hc.restore();
    text('Tap to drop the block!', 180, 585, 21, '#ffffff', 'rgba(18,48,122,0.9)', 4);
  }
  // sparks
  hc.globalCompositeOperation = 'lighter';
  for (var i = 0; i < sparks.length; i++) {
    var s = sparks[i], a = 1 - s.life / s.max;
    hc.globalAlpha = a; hc.fillStyle = s.color;
    hc.beginPath(); hc.arc(s.x, s.y, s.size * (0.5 + 0.5 * a), 0, Math.PI * 2); hc.fill();
  }
  hc.globalAlpha = 1; hc.globalCompositeOperation = 'source-over';
  // popups
  for (i = 0; i < popups.length; i++) {
    var p = popups[i], t = p.t / p.dur, sc = t < 0.15 ? easeOutBack(t / 0.15) : 1, al = t > 0.7 ? 1 - (t - 0.7) / 0.3 : 1;
    hc.save(); hc.globalAlpha = clamp(al, 0, 1); hc.translate(clamp(p.x, 90, 270), p.y - t * 40); hc.scale(sc, sc);
    text(p.txt, 0, 0, p.size, p.color, 'rgba(18,48,122,0.95)', p.size * 0.2);
    hc.restore();
  }
  // banners
  if (banners.length) {
    var b = banners[0], inT = clamp(b.t / 0.35, 0, 1), outT = clamp((b.dur - b.t) / 0.3, 0, 1);
    hc.save(); hc.globalAlpha = outT; hc.translate(180, 236); hc.rotate(-0.04);
    var rw = 420 * easeOutCubic(inT), rh = b.sub ? 100 : 76;
    var rg = hc.createLinearGradient(0, -rh / 2, 0, rh / 2);
    rg.addColorStop(0, 'rgba(18,40,110,0)'); rg.addColorStop(0.2, 'rgba(18,40,110,0.82)'); rg.addColorStop(0.8, 'rgba(18,40,110,0.82)'); rg.addColorStop(1, 'rgba(18,40,110,0)');
    hc.fillStyle = rg; hc.fillRect(-rw / 2, -rh / 2, rw, rh);
    var bs = easeOutBack(inT) * (1 + (1 - outT) * 0.2); hc.scale(bs, bs);
    var fs = 42; hc.font = '900 ' + fs + 'px ' + FONT;
    var tw = hc.measureText(b.txt).width + fs * 0.3; if (tw > 330) fs = Math.floor(fs * 330 / tw);
    text(b.txt, 0, b.sub ? -12 : 0, fs, b.color, 'rgba(18,48,122,1)', fs * 0.2);
    if (b.sub) text(b.sub, 0, 25, 16, '#ffffff', 'rgba(18,48,122,1)', 4);
    hc.restore();
  }
}

// ---------------------------------------------------------------- loop
var lastTs = -1;
function frame(ts) {
  if (lastTs < 0) lastTs = ts;
  var dt = (ts - lastTs) / 1000; lastTs = ts;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  update(dt);
  render3D();
  renderHUD();
  requestAnimationFrame(frame);
}
setInterval(function () {
  var now = performance.now();
  if (!endShown && now - loadTime > 62000 && now - lastInput > 15000) showEnd();
}, 1000);

buildScenery();
resetRun();
requestAnimationFrame(frame);
})();
