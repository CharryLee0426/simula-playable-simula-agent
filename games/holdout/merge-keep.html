<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function easeOutCubic(t){t=1-t;return 1-t*t*t}
function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function easeOutBack(t){var c=1.9;t-=1;return 1+(c+1)*t*t*t+c*t*t}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- simulation ---------- */
var UNIT=[null,
 {n:'PEA PAGE',d:9,r:1},
 {n:'RADISH SQUIRE',d:23,r:1.15},
 {n:'TURNIP KNIGHT',d:56,r:1.3},
 {n:'TOMATO PALADIN',d:130,r:1.45},
 {n:'PUMPKIN LORD',d:290,r:1.6}];
var FOE={
 grunt:{hp:36,v:.1,c:5,h:9,r:17},
 scout:{hp:20,v:.155,c:4,h:6,r:14},
 brute:{hp:140,v:.07,c:12,h:16,r:24},
 boss:{hp:3500,v:.068,c:0,h:15,r:44,a:18}
};
var CONF={gate:100,coins:24,c0:8,cs:1,bossT:1.25,hp:[1,1,1.5,2.2,1.4],wt:[1,11.4,22.4,34.2]};

function createSim(){
 var rng=mulberry32(0x4b454550),plan=[],last=-1,i;
 var S={t:0,gate:CONF.gate,coins:CONF.coins,summons:0,grid:[],foes:[],shots:[],ev:[],wave:0,boss:null,over:0,id:1,planI:0};
 for(i=0;i<15;i++)S.grid.push(null);
 S.grid[6]={lv:1,cd:.3,id:S.id++};
 S.grid[8]={lv:1,cd:.65,id:S.id++};
 function lane(){var l=Math.floor(rng()*3);if(l===last)l=(l+1+Math.floor(rng()*2))%3;last=l;return l}
 function seq(str,t0,gap,w){for(var j=0;j<str.length;j++){var k=str[j]==='g'?'grunt':str[j]==='s'?'scout':'brute';plan.push({t:t0+j*gap,k:k,w:w,l:lane()})}}
 seq('gggggg',2,1.25,1);
 seq('ggsgsgbg',12,1.15,2);
 seq('sgbgsgbgsbg',23,.95,3);
 plan.push({t:36,k:'boss',w:4,l:1});
 seq('g',39.5,1,4);seq('s',43,1,4);seq('g',46.5,1,4);
 plan.sort(function(a,b){return a.t-b.t});

 S.cost=function(){return CONF.c0+S.summons*CONF.cs};
 S.free=function(){var f=[];for(var j=0;j<15;j++)if(!S.grid[j])f.push(j);return f};
 S.canSummon=function(){return !S.over&&S.coins>=S.cost()&&S.free().length>0};
 S.summon=function(){
  if(!S.canSummon())return -1;
  var f=S.free(),p=f[Math.floor(rng()*f.length)];
  S.coins-=S.cost();S.summons++;
  S.grid[p]={lv:1,cd:.25,id:S.id++};
  S.ev.push({k:'summon',i:p});
  return p;
 };
 S.drop=function(a,b){
  if(S.over||a===b)return '';
  var u=S.grid[a],v=S.grid[b];
  if(!u)return '';
  if(!v){S.grid[b]=u;S.grid[a]=null;S.ev.push({k:'move',i:b});return 'move'}
  if(v.lv===u.lv&&u.lv<5){
   v.lv++;v.cd=Math.min(v.cd,.15);S.grid[a]=null;
   S.ev.push({k:'merge',i:b,from:a,lv:v.lv});
   return 'merge';
  }
  S.grid[a]=v;S.grid[b]=u;S.ev.push({k:'swap',i:b,j:a});return 'swap';
 };
 function target(){
  var best=null;
  for(var j=0;j<S.foes.length;j++){var f=S.foes[j];if(f.hp>0&&f.p>.05&&(!best||f.p>best.p))best=f}
  return best;
 }
 function hitGate(n,f){
  if(S.over)return;
  S.gate=Math.max(0,S.gate-n);
  S.ev.push({k:'gate',n:n,lane:f.l,boss:!!f.boss});
  if(S.gate<=0){S.over=-1;S.ev.push({k:'lose'})}
 }
 function hurt(f,sh){
  var a=f.a||0,d=Math.max(1,sh.d-a);
  f.hp-=d;
  S.ev.push({k:'hit',f:f,d:d,lv:sh.lv,blocked:a>0&&sh.d<=a});
  if(f.hp<=0){
   f.hp=0;
   S.coins+=f.c;
   S.ev.push({k:'kill',f:f,c:f.c});
   if(f.boss){S.over=1;S.ev.push({k:'win',f:f})}
  }
 }
 S.step=function(dt){
  if(S.over)return;
  S.t+=dt;
  var j,f;
  while(S.wave<4&&S.t>=CONF.wt[S.wave]){S.wave++;S.ev.push({k:'wave',n:S.wave})}
  while(S.planI<plan.length&&plan[S.planI].t<=S.t){
   var e=plan[S.planI++],b=FOE[e.k],mul=e.k==='boss'?1:CONF.hp[e.w];
   f={id:S.id++,k:e.k,l:e.l,p:0,pp:0,hp:b.hp*mul,max:b.hp*mul,v:b.v,c:b.c,h:b.h,r:b.r,a:b.a||0,boss:e.k==='boss',atk:.5,fl:0,at:0};
   S.foes.push(f);
   if(f.boss){S.boss=f;S.ev.push({k:'boss'})}
  }
  for(j=S.foes.length-1;j>=0;j--){
   f=S.foes[j];f.pp=f.p;
   if(f.p<1){f.p=Math.min(1,f.p+f.v*dt)}
   if(f.p>=1){
    if(f.boss){f.atk-=dt;if(f.atk<=0){f.atk=CONF.bossT;f.at=1;hitGate(f.h,f);if(S.over)return}}
    else{S.foes.splice(j,1);f.gone=1;hitGate(f.h,f);if(S.over)return}
   }
  }
  for(j=0;j<15;j++){
   var u=S.grid[j];if(!u||u.held)continue;
   u.cd-=dt;
   if(u.cd<=0){

     var ud=UNIT[u.lv];
     S.shots.push({from:j,f:t,t:0,dur:.26,d:ud.d,lv:u.lv});
     u.cd=1/ud.r;
     S.ev.push({k:'shot',i:j,lv:u.lv});
    }else u.cd=0;
   }
  }
  for(j=S.shots.length-1;j>=0;j--){
   var sh=S.shots[j];sh.t+=dt;
   if(sh.t>=sh.dur){
    S.shots.splice(j,1);
    var tf=sh.f;
    if(tf.hp<=0||tf.gone)tf=target();
    if(tf){hurt(tf,sh);if(S.over)return}
   }
  }
  for(j=S.foes.length-1;j>=0;j--)if(S.foes[j].hp<=0)S.foes.splice(j,1);
 };
 return S;
}

function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

 c.fillStyle='rgba(240,110,110,.42)';ell(c,-12,5,4.6,3);c.fill();ell(c,12,5,4.6,3);c.fill();

 }

function updFx(dt){
 var i,o;
 for(i=parts.length-1;i>=0;i--){

function handle(e){
 var q,c;
 switch(e.k){
  case 'summon':
   q=cellC(e.i);var u=sim.grid[e.i];if(u){u.pop=0;u.rec=0}
   burst(q.x,q.y,12,['#fff6dc','#d9efa2','#f6e3a0'],110,3.6,120);ring(q.x,q.y,36,'#fff3c8',4);SFX.summon();
   break;
  case 'merge':
   q=cellC(e.i);u=sim.grid[e.i];if(u){u.pop=0;u.flash=1}
   var cols=[[],['#b7e07a'],['#ff9cc4','#ffe0ec','#9fd478'],['#b49cf0','#f2ecff','#ffd36b'],['#ff8a6e','#ffd36b','#fff0c8'],['#ffb347','#fff3a8','#ff7a5a']][e.lv];
   burst(q.x,q.y,16+e.lv*6,cols.concat(['#fff8e0']),150+e.lv*22,3.6+e.lv*.4,160);
   ring(q.x,q.y,42+e.lv*5,'#fff3c8',5.5);ring(q.x,q.y,26+e.lv*4,cols[0],4,.32);
   shake=Math.max(shake,1.6+e.lv*.8);
   combo=comboT>0?combo+1:1;comboT=3.4;
   var label=UNIT[e.lv].n+'!';
   floater(label,q.x,q.y-34,'#fff4c8',e.lv>=4?19:16,{life:1,rise:28,mx:92});
   if(combo>=2){var cl=['','','DOUBLE MERGE!','TRIPLE MERGE!','MEGA MERGE!'][Math.min(combo,4)];floater(cl,W/2,L.gateY-30,['','','#ffe27a','#ffb55a','#ff7f6a'][Math.min(combo,4)],25+Math.min(combo,4)*1.5,{life:1.1,rise:22,mx:120})}
   SFX.merge(e.lv);
   break;
  case 'shot':
   u=sim.grid[e.i];if(u)u.rec=1;SFX.shot(e.lv);
   break;
  case 'hit':
   c=foeCenter(e.f);e.f.fl=.11;
   if(e.blocked){
    SFX.tink();
    burst(c.x+(fxR()-.5)*30,c.y-16*c.s,3,['#e6e9f2','#fff','#aab2c8'],90,2.1,240);
    if(fxR()<.33)floater('TINK',c.x+(fxR()-.5)*62,c.y-34*c.s,'#d6dcea',12,{life:.5,rise:20});
    if(e.f.boss&&!ahaDone){ahaDone=true;floater('TOO WEAK!  MERGE UP!',W/2,clamp(c.y+52,L.fieldTop+70,L.gateY-34),'#ffe27a',22,{life:2.3,rise:8,mx:150});SFX.deny()}
   }else{

    else if(e.lv>=3)floater(String(Math.round(e.d)),c.x+(fxR()-.5)*22,c.y-14*c.s,e.lv>=4?'#ffd65c':'#fff4e0',e.lv>=4?19:14,{life:.6,rise:26});
   }
   if(e.f.boss)bossHit=.12;
   break;
  case 'kill':

   if(!e.f.boss){
    var cl2={grunt:['#c9603f','#f0d9b0','#fbf1dc'],scout:['#e5c24e','#f6ecc5','#fff'],brute:['#8f62bb','#e0cdf2','#f3e2c2']}[e.f.k];
    burst(c.x,c.y,e.f.k==='brute'?22:13,cl2,e.f.k==='brute'?190:150,3.6,260);ring(c.x,c.y,26*c.s+10,'#fff4d6',3.5,.3);
    floater('+'+e.c,c.x,c.y-12,'#ffe27a',e.f.k==='brute'?20:16,{life:.75,rise:30});

   if(e.n===4)SFX.boss();else SFX.wave();

function playUpdate(dt){
 if(slowT>0){slowT-=dt;if(slowT<=0)timeScale=1}
 acc+=dt*timeScale;
 var n=0;
 while(acc>=STEP&&n<6){
  sim.step(STEP);acc-=STEP;n++;
  for(var i=0;i<sim.ev.length;i++)handle(sim.ev[i]);
  sim.ev.length=0;
 }
 if(n>=6)acc=0;
 var j,u;
 for(j=0;j<15;j++){u=sim.grid[j];if(!u)continue;if(u.pop==null)u.pop=1;u.pop=Math.min(1,u.pop+dt*3.2);u.rec=Math.max(0,(u.rec||0)-dt*7);u.flash=Math.max(0,(u.flash||0)-dt*2.2)}
 sim.foes.forEach(function(f){f.fl=Math.max(0,f.fl-dt);f.at=Math.max(0,f.at-dt*2.6)});
 bossHit=Math.max(0,bossHit-dt);
 coinShow+=(sim.coins-coinShow)*Math.min(1,dt*12);
 gateShow+=(sim.gate-gateShow)*Math.min(1,dt*7);
 if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
 if(banner){banner.t+=dt;if(banner.t>=banner.life)banner=null}
 btnPress=Math.max(0,btnPress-dt*5.2);btnDeny=Math.max(0,btnDeny-dt*3.4);
 if(!sim.over){
  if(!drag)idle+=dt;
  if(idle>=4&&!hintOn&&hintTarget()){hintOn=true;hintT=0}
  if(hintOn)hintT+=dt;
 }else{
  hintOn=false;
  if(drag){var dg=sim.grid[drag.i];if(dg)dg.held=false;drag=null}
  overT+=dt;
  if(sim.over===1&&overT>=1.75){toEnd(true)}
  else if(sim.over===-1&&overT>=1.2){
   losses++;
   if(losses>=2)toEnd(false);else{phase='fail';failT=0;SFX.lose()}
  }
 }
}
function update(dt){
 time+=dt;
 updFx(dt);
 muteBump=Math.max(0,muteBump-dt*5);retryPress=Math.max(0,retryPress-dt);ctaPress=Math.max(0,ctaPress-dt);
 if(phase==='load'){loadT+=dt;if(loadT>=LOAD_DUR)startRun();return}
 if(phase==='play')playUpdate(dt);
 else if(phase==='fail')failT+=dt;
 else if(phase==='end')endT+=dt;
 musicTick();
}
function hintTarget(){
 if(!sim||sim.over)return null;
 var i,j,best=null,bd=1e9;
 for(i=0;i<15;i++){var a=sim.grid[i];if(!a||a.lv>=5)continue;
  for(j=i+1;j<15;j++){var b=sim.grid[j];if(b&&b.lv===a.lv){var pa=cellC(i),pb=cellC(j),d=Math.hypot(pa.x-pb.x,pa.y-pb.y)-a.lv*40;if(d<bd){bd=d;best={k:'drag',a:i,b:j}}}}
 }
 if(best)return best;
 if(sim.canSummon())return {k:'tap'};
 return null;
}

var pid=null;
function toV(e){var b=cv.getBoundingClientRect();return {x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H}}
function inB(p,b,m){m=m||0;return p.x>=b.x-m&&p.x<=b.x+b.w+m&&p.y>=b.y-m&&p.y<=b.y+b.h+m}
cv.addEventListener('pointerdown',function(e){
 e.preventDefault();

  Au.muted=!Au.muted;muteBump=1;
  if(Au.m)Au.m.gain.value=Au.muted?0:.55;
  return;

  if(pid!==null)return;
  var i=cellAt(p.x,p.y);
  if(i>=0&&sim.grid[i]){
   pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(err){}
   drag={i:i,x:p.x,y:p.y,hover:-1};sim.grid[i].held=true;
   idle=0;hintOn=false;SFX.pick();
   return;
  }
  if(inB(p,L.summon)){
   btnPress=1;idle=0;
   if(sim.summon()>=0){hintOn=false}
   else{btnDeny=1;SFX.deny()}
  }
 }else if(phase==='fail'){
  if(failT>.25&&inB(p,L.retry))retry();
 }else if(phase==='end'){
  if(endT>.45&&inB(p,L.cta))openCTA();
 }
});
cv.addEventListener('pointermove',function(e){

});
function endDrag(e,cancel){
 if(e.pointerId!==pid)return;
 pid=null;
 if(!drag)return;

 if(!sim){return}
 var u=sim.grid[d.i];if(u)u.held=false;
 if(cancel||sim.over)return;
 var p=toV(e),t=cellAt(p.x,p.y-10);if(t<0)t=cellAt(p.x,p.y);
 if(t>=0&&t!==d.i){
