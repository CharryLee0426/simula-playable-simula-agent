function clamp(v,a,b){return v<a?a:v>b?b:v;}

/* ------------------------------------------------------------------ art: jelly characters */
function jellyPath(g,cx,cy,r){
  g.beginPath();g.moveTo(cx,cy-r*1.02);
  g.bezierCurveTo(cx+r*.64,cy-r*1.02,cx+r*1.06,cy-r*.3,cx+r*1.06,cy+r*.3);
  g.bezierCurveTo(cx+r*1.06,cy+r*.84,cx+r*.62,cy+r*.98,cx,cy+r*.98);
  g.bezierCurveTo(cx-r*.62,cy+r*.98,cx-r*1.06,cy+r*.84,cx-r*1.06,cy+r*.3);
  g.bezierCurveTo(cx-r*1.06,cy-r*.3,cx-r*.64,cy-r*1.02,cx,cy-r*1.02);g.closePath();
}
function drawJelly(g,cx,cy,r,pal,o){
  o=o||{};

  jellyPath(g,cx,cy,r);g.fillStyle=gr;g.fill();
  g.save();jellyPath(g,cx,cy,r);g.clip();
  var low=g.createLinearGradient(0,cy+r*.2,0,cy+r);low.addColorStop(0,'rgba(255,255,255,0)');low.addColorStop(1,'rgba(255,255,255,.34)');
  g.fillStyle=low;g.fillRect(cx-r*1.2,cy,r*2.4,r*1.1);g.restore();
  jellyPath(g,cx,cy,r);g.lineWidth=r*.11;g.strokeStyle=pal[3];g.stroke();
  g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.ellipse(cx-r*.42,cy-r*.56,r*.2,r*.12,-.62,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.arc(cx-r*.13,cy-r*.76,r*.055,0,TAU);g.fill();
  var ey=cy-r*.04,ex=r*.34;
  g.fillStyle='rgba(255,120,160,.55)';g.beginPath();g.ellipse(cx-r*.62,cy+r*.26,r*.15,r*.09,0,0,TAU);g.ellipse(cx+r*.62,cy+r*.26,r*.15,r*.09,0,0,TAU);g.fill();
  if(o.blink){
    g.strokeStyle='#17324a';g.lineWidth=r*.09;g.lineCap='round';
    g.beginPath();g.arc(cx-ex,ey+r*.04,r*.15,Math.PI*1.1,Math.PI*1.9);g.stroke();
    g.beginPath();g.arc(cx+ex,ey+r*.04,r*.15,Math.PI*1.1,Math.PI*1.9);g.stroke();
  }else{
    g.fillStyle='#fff';g.beginPath();g.ellipse(cx-ex,ey,r*.215,r*.25,0,0,TAU);g.ellipse(cx+ex,ey,r*.215,r*.25,0,0,TAU);g.fill();
    g.fillStyle='#132a44';g.beginPath();g.arc(cx-ex+r*.03,ey+r*.04,r*.125,0,TAU);g.arc(cx+ex+r*.03,ey+r*.04,r*.125,0,TAU);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(cx-ex-r*.015,ey-r*.03,r*.05,0,TAU);g.arc(cx+ex-r*.015,ey-r*.03,r*.05,0,TAU);g.fill();
  }
  g.lineCap='round';
  if(o.angry){
    g.strokeStyle=pal[3];g.lineWidth=r*.13;
    g.beginPath();g.moveTo(cx-ex-r*.25,ey-r*.36);g.lineTo(cx-ex+r*.2,ey-r*.16);g.stroke();
    g.beginPath();g.moveTo(cx+ex+r*.25,ey-r*.36);g.lineTo(cx+ex-r*.2,ey-r*.16);g.stroke();
    g.strokeStyle='#2a0d55';g.lineWidth=r*.09;g.beginPath();g.arc(cx,cy+r*.58,r*.17,Math.PI*1.15,Math.PI*1.85);g.stroke();
  }else if(o.sad){
    g.strokeStyle='#17324a';g.lineWidth=r*.09;g.beginPath();g.arc(cx,cy+r*.62,r*.18,Math.PI*1.15,Math.PI*1.85);g.stroke();
    g.fillStyle='#8fe3ff';g.beginPath();g.ellipse(cx+ex+r*.14,ey+r*.36,r*.07,r*.12,0,0,TAU);g.fill();
  }else{
    g.fillStyle='#7d1f45';g.beginPath();g.arc(cx,cy+r*.3,r*.2,0,Math.PI);g.closePath();g.fill();
    g.fillStyle='#ff7fa0';g.beginPath();g.ellipse(cx,cy+r*.44,r*.1,r*.055,0,0,TAU);g.fill();
  }
}

function makeMint(){
  var s=240,c=mk(s,s),g=c.getContext('2d'),cx=s/2,cy=s/2,R=104,i;
  g.fillStyle='#b5103f';g.beginPath();
  for(i=0;i<16;i++){var a0=i/16*TAU,a1=(i+.5)/16*TAU;g.lineTo(cx+Math.cos(a0)*(R+14),cy+Math.sin(a0)*(R+14));g.lineTo(cx+Math.cos(a1)*(R-2),cy+Math.sin(a1)*(R-2));}
  g.closePath();g.fill();
  g.fillStyle='#fff7f2';g.beginPath();g.arc(cx,cy,R,0,TAU);g.fill();
  g.save();g.beginPath();g.arc(cx,cy,R,0,TAU);g.clip();
  for(i=0;i<8;i++){g.save();g.translate(cx,cy);g.rotate(i/8*TAU);var gr=g.createLinearGradient(0,0,R,0);gr.addColorStop(0,'#ff3f63');gr.addColorStop(1,'#e01246');g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(R*.3,-R*.34,R*.8,-R*.3,R*1.1,R*.02);g.bezierCurveTo(R*.8,-R*.05,R*.34,-R*.02,0,0);g.fill();g.restore();}

  g.fillStyle=sh;g.beginPath();g.arc(cx,cy,R,0,TAU);g.fill();
  g.lineWidth=7;g.strokeStyle='#8e0c35';g.beginPath();g.arc(cx,cy,R,0,TAU);g.stroke();

function makeCloud(v){
  var c=mk(320,150),g=c.getContext('2d'),r=mulberry(77+v*13),i;
  for(i=0;i<13;i++){
    var x=46+r()*228,y=88+r()*24-Math.sin((x-46)/228*Math.PI)*34,R=26+r()*32;

function makeLolly(a,b){

  g.strokeStyle='rgba(70,10,70,.55)';g.lineWidth=2.5;g.beginPath();g.arc(cx,cy,R,0,TAU);g.stroke();

function makeIsle(v){
  var c=mk(300,220),g=c.getContext('2d');

  g.fillStyle='#ff8bc8';for(var i=0;i<7;i++){var x=42+i*36;g.beginPath();g.ellipse(x,116+(i%2)*5,11,15+(i%3)*4,0,0,TAU);g.fill();}

    g.fillStyle='#ffd3ea';g.beginPath();g.moveTo(x-8,y+12);for(var k=0;k<=6;k++){var px0=x-8+k*(tw+16)/6;g.quadraticCurveTo(px0-(tw+16)/12,y+40+(k%2)*14,px0,y+14);}g.lineTo(x+tw+8,y-4);g.lineTo(x-8,y-4);g.closePath();g.fill();g.strokeStyle='#d66aa8';g.lineWidth=4;g.stroke();

  g.fillStyle=wall;rrect(g,140,272,360,352,18);g.fill();g.lineWidth=8;g.strokeStyle='#3e1d24';g.stroke();
  g.strokeStyle='rgba(62,29,36,.28)';g.lineWidth=4;for(var r=0;r<8;r++){var y0=304+r*40;g.beginPath();g.moveTo(148,y0);g.lineTo(492,y0);g.stroke();for(var q=0;q<7;q++){var xb=156+q*58+(r%2)*28;g.beginPath();g.moveTo(xb,y0);g.lineTo(xb,y0+40);g.stroke();}}
  g.fillStyle='#ffd3ea';g.beginPath();g.moveTo(132,284);for(var d=0;d<=10;d++){var dx=132+d*37.6;g.quadraticCurveTo(dx-19,322+(d%3)*11,dx,288);}g.lineTo(508,264);g.lineTo(132,264);g.closePath();g.fill();g.strokeStyle='#d66aa8';g.lineWidth=4;g.stroke();
  for(var b=0;b<7;b++){var bx=154+b*56;g.fillStyle=['#ff5f9e','#45ead3','#ffe14d','#b873ff'][b%4];g.beginPath();g.arc(bx,256,15,0,TAU);g.fill();g.strokeStyle='rgba(62,29,36,.6)';g.lineWidth=3;g.stroke();}
  g.fillStyle='#3a1630';g.beginPath();g.moveTo(216,624);g.lineTo(216,486);g.quadraticCurveTo(320,376,424,486);g.lineTo(424,624);g.closePath();g.fill();g.strokeStyle='#ffd3ea';g.lineWidth=11;g.stroke();

  g.fillStyle='#2b0e28';g.beginPath();g.arc(280,543,6,0,TAU);g.arc(360,543,6,0,TAU);g.fill();
  g.strokeStyle='#ffd3ea';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(252,518);g.lineTo(294,532);g.moveTo(388,518);g.lineTo(346,532);g.stroke();

}

var sfx={
  good:function(x){var b=x?392:330;[1,1.26,1.5,2].forEach(function(m,i){tone(b*m,.17,'triangle',.2,i*.05);});if(x)[2,2.5,3].forEach(function(m,i){tone(b*m,.22,'sine',.1,.16+i*.05);});},
  bad:function(){tone(300,.32,'sawtooth',.13,0,90);tone(210,.34,'square',.06,.03,70);},

  hit:function(){noise(.2,.34,1200);tone(130,.2,'square',.12,0,50);},

  while(mus.next<ac.currentTime+.14){

function step(){

  if(big){var sw=((simT*.55)%1.5-.25)*(w+h)-w/2-h/2;ctx.fillStyle='rgba(255,255,255,.34)';ctx.beginPath();ctx.moveTo(sw,-h/2);ctx.lineTo(sw+h*.5,-h/2);ctx.lineTo(sw,h/2);ctx.lineTo(sw-h*.5,h/2);ctx.closePath();ctx.fill();}
  ctx.restore();
  var p=fit(ctx,txt,w*.82,big?h*.45:15.5*Math.max(U,.85));
  label(ctx,txt,0,p*.05,p,'#fff',edge,p*.22);
  ctx.restore();
}
function drawHUD(){
  drawMuteBtn();
  if(mode==='end'||mode==='fail')return;
  candyBtn(BTN.get,'GET GAME','#ffb52e','#ff6a3d','#b23a12',false);
  var b=BAR,prog=clamp(S.z/FORT_Z,0,1);
  ctx.fillStyle='rgba(47,20,102,.76)';rrect(ctx,b.x-2,b.y-2,b.w+4,b.h+4,(b.h+4)/2);ctx.fill();
  if(prog>.004){var gg=ctx.createLinearGradient(0,b.y,0,b.y+b.h);gg.addColorStop(0,'#ffe970');gg.addColorStop(1,'#ffcf1f');ctx.save();rrect(ctx,b.x,b.y,b.w,b.h,b.h/2);ctx.clip();ctx.fillStyle=gg;ctx.fillRect(b.x,b.y,b.w*prog,b.h);ctx.restore();}
  ctx.lineWidth=1.6;ctx.strokeStyle='rgba(255,255,255,.9)';rrect(ctx,b.x-2,b.y-2,b.w+4,b.h+4,(b.h+4)/2);ctx.stroke();
  var chipT='BEAT '+FORT_HP,cy=b.y+b.h+15,fp=Math.min(15,14.5*Math.max(U,.86));
  ctx.font=font(fp);var cw=ctx.measureText(chipT).width+fp*2.9,ch=fp*1.5,cx=b.x+b.w/2;
  ctx.fillStyle='rgba(47,20,102,.76)';rrect(ctx,cx-cw/2,cy-ch/2,cw,ch,ch/2);ctx.fill();
  heart(cx-cw/2+fp*.95,cy+fp*.02,fp*.42,'#ff7c9e');
  label(ctx,chipT,cx+fp*.5,cy+fp*.05,fp,'#fff');
}
function drawVignette(){
  if(vign<=0)return;
  var g=ctx.createRadialGradient(W/2,H*.52,H*.24,W/2,H*.52,H*.72);g.addColorStop(0,'rgba('+vignCol+',0)');g.addColorStop(1,'rgba('+vignCol+','+(vign*.62).toFixed(3)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawLoading(){
  ctx.drawImage(skyC,0,0,W,H);
  ctx.fillStyle='rgba(66,36,160,.28)';ctx.fillRect(0,0,W,H);
  var cy=H*.4,R=Math.min(W*.17,62),b=Math.abs(Math.sin(modeT*5.6)),q=(1-b)*.13;
  ctx.fillStyle='rgba(60,10,90,.3)';ctx.beginPath();ctx.ellipse(W/2,cy+R*1.08,R*(.95-b*.2),R*.17,0,0,TAU);ctx.fill();
  ctx.save();ctx.translate(W/2,cy+R-b*R*.62);ctx.scale(1+q,1-q);drawJelly(ctx,0,-R,R,PAL_SQUAD);ctx.restore();
  drawLogo(W/2,H*.585,W*.8,Math.min(H*.078,58));
  var bw=W*.52,by=H*.74,p=clamp(modeT/.95,0,1);
  rrect(ctx,W/2-bw/2,by,bw,13,6.5);ctx.fillStyle='rgba(47,20,102,.75)';ctx.fill();
  if(p>.03){rrect(ctx,W/2-bw/2+2,by+2,(bw-4)*p,9,4.5);ctx.fillStyle='#ffe14d';ctx.fill();}
}
function drawLogo(x,y,maxW,size){
  ctx.save();
  var p1=fit(ctx,'BLOB',maxW,size*1.15),p2=fit(ctx,'BRIGADE',maxW,size*.92);
  var y1=y-p2*.52,y2=y+p1*.5;
  function w(t,yy,p,c1,c2){
    ctx.font=font(p);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.strokeStyle='#32106e';ctx.lineWidth=p*.32;ctx.strokeText(t,x,yy+p*.08);
    ctx.strokeStyle='#fff';ctx.lineWidth=p*.17;ctx.strokeText(t,x,yy);
    var g=ctx.createLinearGradient(0,yy-p*.5,0,yy+p*.5);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillText(t,x,yy);
  }
  w('BLOB',y1,p1,'#7dfff0','#14b5c9');w('BRIGADE',y2,p2,'#ffd2ee','#ff4f9c');
  ctx.restore();
}
function star(x,y,r,on){
  ctx.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i/10*TAU,d=i%2?r*.47:r;var xx=x+Math.cos(a)*d,yy=y+Math.sin(a)*d;if(i)ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy);}ctx.closePath();
  ctx.fillStyle=on?'#ffe14d':'rgba(255,255,255,.2)';ctx.fill();ctx.lineJoin='round';ctx.lineWidth=r*.17;ctx.strokeStyle=on?'#a85b00':'rgba(255,255,255,.55)';ctx.stroke();
}
function drawFail(){
  var k=easeBack(modeT*3.4),rs=lastResult||{reason:'zero'},cardW=Math.min(W*.86,340),top=H*.25,cardH=Math.max(H*.47,258),bx=BTN.retry;
  ctx.fillStyle='rgba(36,12,78,'+(.52*clamp(modeT*4,0,1)).toFixed(3)+')';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,top+cardH/2);ctx.scale(k,k);ctx.translate(-W/2,-(top+cardH/2));
  rrect(ctx,W/2-cardW/2,top+5,cardW,cardH,28);ctx.fillStyle='#4b1a92';ctx.fill();
  rrect(ctx,W/2-cardW/2,top,cardW,cardH,28);var g=ctx.createLinearGradient(0,top,0,top+cardH);g.addColorStop(0,'#fff8fd');g.addColorStop(1,'#ffd5ec');ctx.fillStyle=g;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
  var R=Math.min(cardH*.145,42);drawJelly(ctx,W/2,top+cardH*.2,R,PAL_SQUAD,{sad:1});
  var title=rs.reason==='zero'?'SQUAD SPLATTED!':'FORTRESS HELD!',p=fit(ctx,title,cardW*.86,30*U);
  label(ctx,title,W/2,top+cardH*.42,p,'#ff3f7c','#fff',p*.16);
  var line=rs.reason==='zero'?'Dodge the candy traps':'You brought '+rs.arrived+', needed '+(FORT_HP+1),p2=fit(ctx,line,cardW*.82,17*U,800);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=font(p2,800);ctx.fillStyle='#5c3596';ctx.fillText(line,W/2,top+cardH*.55);
  ctx.restore();
  BTN.retry.y=top+cardH*.68;BTN.retry.h=Math.max(52,Math.min(cardH*.22,62));BTN.retry.w=Math.min(cardW*.82,280);BTN.retry.x=W/2-BTN.retry.w/2;
  if(modeT>.12)candyBtn(BTN.retry,'TRY AGAIN','#49e8cf','#14a8bf','#0a5e78','retry');
}
function drawEnd(){
  var t=clamp(modeT*2.5,0,1),g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,endWin?'#6e52ff':'#5a3fd0');g.addColorStop(.55,endWin?'#ff74ba':'#a855c9');g.addColorStop(1,endWin?'#ffbf7a':'#ff8bb6');
  ctx.globalAlpha=t;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  var cy=H*.2,R=Math.min(H*.098,W*.19);
  ctx.save();ctx.translate(W/2,cy);ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,255,255,.075)';
  for(var i=0;i<12;i++){var a=simT*.22+i/12*TAU;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-.12)*H,Math.sin(a-.12)*H);ctx.lineTo(Math.cos(a+.12)*H,Math.sin(a+.12)*H);ctx.closePath();ctx.fill();}
  ctx.restore();
  var e=easeBack(modeT*2.4);
  ctx.save();ctx.translate(W/2,cy+Math.sin(simT*2.6)*5);ctx.scale(e*(1+Math.sin(simT*5.2)*.03),e*(1-Math.sin(simT*5.2)*.03));
  [-1,1].forEach(function(d){drawJelly(ctx,d*R*1.42,R*.42,R*.56,d<0?PAL_RIVAL:PAL_SQUAD,endWin?{}:{sad:1});});
  drawJelly(ctx,0,0,R,PAL_SQUAD,endWin?{}:{sad:1});
  if(endWin){ctx.fillStyle='#ffd83d';ctx.strokeStyle='#a85b00';ctx.lineWidth=R*.07;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-R*.5,-R*.78);ctx.lineTo(-R*.58,-R*1.28);ctx.lineTo(-R*.22,-R*1.04);ctx.lineTo(0,-R*1.42);ctx.lineTo(R*.22,-R*1.04);ctx.lineTo(R*.58,-R*1.28);ctx.lineTo(R*.5,-R*.78);ctx.closePath();ctx.fill();ctx.stroke();}
  ctx.restore();
  var ly=H*.2+R+Math.max(46,H*.085);
  drawLogo(W/2,ly,W*.8,Math.min(H*.066,48));
  var ry=ly+Math.max(66,H*.116),title=endWin?'FORTRESS SMASHED!':'SO CLOSE!',p=fit(ctx,title,W*.84,27*U);
  label(ctx,title,W/2,ry,p,'#fff','#3a1484',p*.2);
  var sy=ry+Math.max(34,H*.056),sr=Math.max(13,17*U);
  for(i=0;i<3;i++){var bob=Math.sin(simT*3+i)*2,on=endWin&&i<endStars;star(W/2+(i-1)*sr*2.6,sy+bob,sr,on);}
  var line=endWin?'Grow your squad. Crush every fortress.':'One more run. Your brigade awaits.',by=sy+Math.max(32,H*.05),p2=fit(ctx,line,W*.86,16.5*U,800);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=font(p2,800);ctx.fillStyle='rgba(255,255,255,.96)';ctx.fillText(line,W/2,by);
  var cb=BTN.cta,minY=by+24;cb.y=Math.max(minY,H-safe.b-cb.h-Math.max(22,H*.055));
  var rowTop=by+18,gap=cb.y-8-rowTop;
  if(gap>64){
    var r0=Math.min(gap*.27,25*U),rowY=rowTop+gap*.56;
    for(i=0;i<5;i++){
      var hop=Math.abs(Math.sin(simT*3.4+i*.9)),rx=W/2+(i-2)*r0*2.55;
      ctx.fillStyle='rgba(60,16,110,.24)';ctx.beginPath();ctx.ellipse(rx,rowY+r0*1.02,r0*(.9-hop*.25),r0*.17,0,0,TAU);ctx.fill();
      drawJelly(ctx,rx,rowY-hop*r0*.62,r0,PAL_SQUAD,endWin?{}:{sad:1});
    }
  }
  if(modeT>.25)candyBtn(cb,'GET GAME','#ffc23d','#ff6a2b','#a83b0c',true);
}

/* ------------------------------------------------------------------ frame */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(mode==='load'){drawLoading();return;}
  ctx.save();
  if(shake>0)ctx.translate(Math.sin(simT*83)*shake*.65,Math.cos(simT*71)*shake*.65);
  drawBackdrop();drawBridge();
  var list=[],i;
  for(i=0;i<events.length;i++){var ev=events[i],dz=ev.z-cam.z;if(dz>.5&&dz<66)list.push(ev);}
  list.sort(function(a,b){return b.z-a.z;});
  drawFort();
  for(i=0;i<list.length;i++){if(list[i].z>S.z+.15)drawObj(list[i]);}
  drawCrowd();drawJumpers();
  for(i=0;i<list.length;i++){if(list[i].z<=S.z+.15)drawObj(list[i]);}
  if(mode!=='end')drawCountPill();
  ctx.restore();
  drawParticles();drawFloats();drawVignette();drawCombo();
  if(mode==='fail')drawFail();
  if(mode==='end')drawEnd();
  drawHUD();
  if(mode==='ready'||mode==='run')drawTutorial();
}
function drawObj(ev){if(ev.t==='gate')drawGate(ev);else if(ev.t==='spin')drawSpinner(ev);else drawRival(ev);}

var last=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);
  var d=last?Math.min(.1,(t-last)/1000):0;last=t;acc+=d;var n=0;
  while(acc>=DT&&n<8){step();acc-=DT;n++;}
  if(n===8)acc=0;
  music();render();
}

/* ------------------------------------------------------------------ input */
var ptr={id:null,x:0,y:0,sx:0,sy:0,btn:null},pressed=null,lastCta=0;
function local(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};}
function inB(b,x,y,pad){pad=pad||0;return x>=b.x-pad&&x<=b.x+b.w+pad&&y>=b.y-pad&&y<=b.y+b.h+pad;}
function hitButton(x,y){
  if(mode==='load')return null;
  if(inB(BTN.mute,x,y))return'mute';
  if(mode==='end')return modeT>.4&&inB(BTN.cta,x,y)?'cta':null;
  if(mode==='fail')return modeT>.12&&inB(BTN.retry,x,y)?'retry':null;
  return inB(BTN.get,x,y)?'get':null;
}
function canSteer(){return mode==='ready'||mode==='run';}
function beginSteer(){
  if(!canSteer())return;
  everInput=true;lastInput=simT;
  if(mode==='ready'){setMode('run');mus.step=0;}
}
function openCTA(){
  var now=performance.now();if(now-lastCta<700)return;lastCta=now;
  sfx.ui();
  if(window.mraid&&typeof window.mraid.open==='function'){try{window.mraid.open(CTA_URL);}catch(e){}return;}
  try{window.open(CTA_URL,'_blank');}catch(e){}
}
function activate(b){
  if(b==='mute'){setMute(!muted);sfx.ui();}
  else if(b==='get'||b==='cta'){openCTA();}
  else if(b==='retry'){sfx.ui();resetRun();}
}
canvas.addEventListener('pointerdown',function(e){
  e.preventDefault();ensureAudio();
  if(ptr.id!==null)return;
  var p=local(e),b=hitButton(p.x,p.y);
  ptr.id=e.pointerId;ptr.x=p.x;ptr.y=p.y;ptr.sx=p.x;ptr.sy=p.y;ptr.btn=b;pressed=b;
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  if(!b)beginSteer();
});
canvas.addEventListener('pointermove',function(e){
  if(e.pointerId!==ptr.id)return;
  e.preventDefault();
  var p=local(e);
  if(ptr.btn){
    var dist=Math.hypot(p.x-ptr.sx,p.y-ptr.sy);
    if(dist>10){
      var was=ptr.btn;ptr.btn=null;pressed=null;
      if(was==='get'||was==='mute')beginSteer();
    }else{ptr.x=p.x;ptr.y=p.y;return;}
  }
  if(canSteer()){
    S.tx+=(p.x-ptr.x)*1.45/(W*.41);
    var lim=.96-squadR(S.n);S.tx=clamp(S.tx,-lim,lim);
    if(Math.abs(p.x-ptr.x)>.5)lastInput=simT;
  }
  ptr.x=p.x;ptr.y=p.y;
});
function endPointer(e,fire){
  if(e.pointerId!==ptr.id)return;
  var b=ptr.btn;ptr.id=null;ptr.btn=null;pressed=null;
  if(fire&&b){var p=local(e);if(inB(BTN[b],p.x,p.y,6))activate(b);}
}
canvas.addEventListener('pointerup',function(e){endPointer(e,true);});
canvas.addEventListener('pointercancel',function(e){endPointer(e,false);});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('visibilitychange',function(){
  if(!ac)return;
  var p=document.hidden?ac.suspend():ac.resume();if(p&&p.catch)p.catch(function(){});
  last=0;
});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);

/* ------------------------------------------------------------------ boot */
resize();buildSprites();syncMembers(true);
requestAnimationFrame(frame);
})();
</script>
