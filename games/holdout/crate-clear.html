function step(dt){

 if(scene==='load'&&sceneT>=1.15){scene='play';sceneT=0;reset();}
 shake=Math.max(0,shake-dt*20);hudPulse=Math.max(0,hudPulse-dt*4);linePulse=Math.max(0,linePulse-dt*2.2);gullHop=Math.max(0,gullHop-dt*2.4);
 if(gullMoodT>0){gullMoodT-=dt;if(gullMoodT<=0&&scene==='play')gullMood='idle';}
 if(bubble){bubble.t+=dt;if(bubble.t>bubble.d)bubble=null;}
 var i,e;
 if(G){
  G.shownScore+=(G.score-G.shownScore)*Math.min(1,dt*12);
  for(i=0;i<3;i++){e=slotFx[i];if(!e)continue;if(e.delay>0){e.delay-=dt;continue;}
   e.vx+=(-210*e.x-20*e.vx)*dt;e.vy+=(-210*e.y-20*e.vy)*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;var mc=G.tray[i]?G.tray[i].mini:e.cs;e.cs+=(mc-e.cs)*Math.min(1,dt*15);
   if(Math.abs(e.x)<.08&&Math.abs(e.y)<.08&&Math.abs(e.vx)<.6&&Math.abs(e.vy)<.6&&Math.abs(e.cs-mc)<.05)slotFx[i]=null;}
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(landFx[r][c]>0)landFx[r][c]=Math.max(0,landFx[r][c]-dt);
  for(i=clearing.length-1;i>=0;i--){e=clearing[i];e.t+=dt;
   if(!e.popped&&e.t>=e.delay){e.popped=true;var m=cellCenter(e.r,e.c),tn=Math.floor((e.code-1)/6);burst(m.x,m.y,tn,6,true);spark(m.x,m.y,2);dust(m.x,m.y,1);if(e.i%2===0)sfx.pluck(Math.floor(e.i/2));}
   if(e.t>e.delay+.3)clearing.splice(i,1);}
  if(scene==='play'){
   if(drag){var ts=CELL;drag.cs+=(ts-drag.cs)*Math.min(1,dt*20);drag.dx+=(drag.cx-drag.dx)*Math.min(1,dt*32);drag.dy+=(drag.cy-drag.dy)*Math.min(1,dt*32);drag.tilt*=Math.pow(.0009,dt);}

    if(!drag){hint.idle+=dt;if(!hint.on&&hint.idle>=4){hint.on=true;hint.t=0;hint.move=findHint();if(!bubble)say('Fill a row or column!',3);}}

  else{e.vy+=(e.g||0)*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.r!==undefined)e.r+=(e.vr||0)*dt;if(e.t>=e.l)parts.splice(i,1);}
 }

}
