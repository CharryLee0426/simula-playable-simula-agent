<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}

.rt{font-weight:900;font-size:calc(var(--u)*30);letter-spacing:calc(var(--u)*1);line-height:1.05;text-shadow:0 calc(var(--u)*3) 0 #2a0b62,0 0 calc(var(--u)*18) rgba(255,210,90,.55);color:#ffe27a}

<body>
<canvas id="c"></canvas>
<div id="res" class="ov">
  <div class="panel">
    <div class="rt" id="rTitle">TARGET SMASHED!</div>
    <div class="rs" id="rSub">Amazing swapping!</div>
    <div class="stars" id="rStars"><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span></div>
    <div class="sc">SCORE<b id="rScore">0</b></div>

  </div>
</div>
<div id="end" class="ov">
  <div class="ecard">
    <div class="icon"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3a8"/><stop offset=".45" stop-color="#ffcf1a"/><stop offset="1" stop-color="#c77a00"/></linearGradient><linearGradient id="ig2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3c6"/><stop offset=".5" stop-color="#ff2f6a"/><stop offset="1" stop-color="#8a0a36"/></linearGradient></defs><polygon points="50,6 92,50 50,94 8,50" fill="url(#ig)" stroke="rgba(0,0,0,.3)" stroke-width="2"/><polygon points="50,28 72,50 50,72 28,50" fill="rgba(255,255,255,.45)"/><circle cx="76" cy="22" r="13" fill="url(#ig2)" stroke="rgba(0,0,0,.3)" stroke-width="2"/><ellipse cx="38" cy="30" rx="10" ry="5" fill="rgba(255,255,255,.8)" transform="rotate(-40 38 30)"/></svg></div>
    <div class="etitle">GEM SWAP</div>
    <div class="etag">Swap, match &amp; blast your way<br>through dazzling puzzles!</div>
    <div class="escore" id="eScore"></div>
    <button class="btn" id="install" type="button">INSTALL</button>
    <div class="efree">Free to play</div>
  </div>
</div>
<script>
(function () {
'use strict';

// ---------------------------------------------------------------- config
var QS = new URLSearchParams(location.search);
var FAST = QS.get('fast') === '1';           // test flag: shortened timers
var COLS = 7, ROWS = 8, NT = 6, CELL = 46;
var BX = (360 - COLS * CELL) / 2, BY = 140;
var SESSION = FAST ? 12 : 45;                // seconds of play
var TARGET = FAST ? 600 : 4000;              // score goal
var AUTOSTART = FAST ? 1.5 : 3.5;            // clock starts by itself after this
var RES_HOLD = FAST ? 2.5 : 4.0;             // results panel -> end card
var FEVER_AT = FAST ? 4 : 20;
var FONT = '"Trebuchet MS","Segoe UI","Helvetica Neue",Arial,sans-serif';
var STORE_URL = 'https://example.com/app';

// ---------------------------------------------------------------- utils
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(n) { return (Math.random() * n) | 0; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r);
  g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h); g.arcTo(x, y + h, x, y + h - r, r);
  g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r); g.closePath();
}

// ---------------------------------------------------------------- audio
var SFX = (function () {
  var ac = null, sfx = null, mus = null, noiseBuf = null, nextT = 0, step = 0, timer = null;
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  // browsers only allow audio after a user activation (pointerdown for mouse,
  // pointerup/touchend for touch), so init() is called from all of them
  function canStart() { var ua = navigator.userActivation; return !ua || ua.isActive || ua.hasBeenActive; }
  function init() {
    try {
      if (!ac) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC || !canStart()) return;
        ac = new AC();
        var comp = ac.createDynamicsCompressor();
        comp.connect(ac.destination);
        sfx = ac.createGain(); sfx.gain.value = 0.55; sfx.connect(comp);
        mus = ac.createGain(); mus.gain.value = 0.06; mus.connect(comp);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        nextT = ac.currentTime + 0.1;
        timer = setInterval(sched, 40);
      }
      if (ac.state === 'suspended' && canStart()) ac.resume();
    } catch (e) { /* audio is optional */ }
  }
  function tone(f, dur, type, vol, delay, f2, dest) {
    if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfx);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, freq, q, delay, ftype, dest) {
    if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var s = ac.createBufferSource(); s.buffer = noiseBuf;
    var f = ac.createBiquadFilter(); f.type = ftype || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    var g = ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfx);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  // quiet looping melody: C - G - Am - F, plucked arpeggio + soft bass + hats
  var CH = [[60, 64, 67, 72], [55, 59, 62, 67], [57, 60, 64, 69], [53, 57, 60, 65]];
  var LEAD = [76, 0, 79, 0, 76, 74, 72, 0, 74, 0, 71, 0, 67, 0, 0, 0,
              72, 0, 76, 0, 72, 71, 69, 0, 72, 0, 69, 0, 65, 0, 67, 0];
  function sched() {
    if (!ac || ac.state !== 'running') return;
    var st = 60 / 108 / 2;
    while (nextT < ac.currentTime + 0.2) {
      var bar = ((step / 8) | 0) % 4, s8 = step % 8, ch = CH[bar];
      if (s8 === 0 || s8 === 4) tone(mtof(ch[0] - 24), 0.45, 'triangle', 0.55, nextT - ac.currentTime, 0, mus);
      tone(mtof(ch[[0, 1, 2, 3, 2, 1, 2, 3][s8]] + 12), 0.22, 'sine', 0.22, nextT - ac.currentTime, 0, mus);
      var ln = LEAD[step % 32];
      if (ln) tone(mtof(ln), 0.3, 'triangle', 0.18, nextT - ac.currentTime, 0, mus);
      if (s8 % 2 === 1) noise(0.04, 0.12, 8000, 1, nextT - ac.currentTime, 'highpass', mus);
      nextT += st; step++;
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (!ac) return;
    if (document.hidden) ac.suspend(); else ac.resume();
  });
  ['pointerdown', 'pointerup', 'touchend', 'click'].forEach(function (ev) { window.addEventListener(ev, init, true); });
  var PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  return {
    init: init,
    swap: function () { tone(520, 0.09, 'sine', 0.25, 0, 880); noise(0.08, 0.08, 3000, 2); },
    bad: function () { tone(220, 0.12, 'square', 0.12, 0, 160); tone(180, 0.14, 'square', 0.1, 0.08, 120); },
    match: function (combo) {
      var base = 72 + Math.min(combo - 1, 6) * 2;
      for (var i = 0; i < 3; i++) tone(mtof(base + PENTA[i + Math.min(combo - 1, 6)]), 0.16, 'triangle', 0.3, i * 0.045);
      noise(0.1, 0.18, 5000, 3);
    },
    land: function () { tone(140, 0.06, 'sine', 0.12, 0, 90); },
    blast: function () {
      tone(1200, 0.35, 'sawtooth', 0.14, 0, 120);
      noise(0.45, 0.4, 1200, 0.7, 0, 'lowpass');
      tone(80, 0.4, 'sine', 0.5, 0, 40);
    },
    make: function () { for (var i = 0; i < 4; i++) tone(mtof(79 + i * 4), 0.12, 'square', 0.08, i * 0.05); },
    fever: function () { for (var i = 0; i < 6; i++) tone(mtof(67 + PENTA[i + 2]), 0.18, 'sawtooth', 0.09, i * 0.07); noise(0.6, 0.2, 2000, 0.5, 0); },
    tick: function () { tone(1500, 0.05, 'square', 0.08); },
    win: function () { var n = [72, 76, 79, 84, 88, 91]; for (var i = 0; i < n.length; i++) tone(mtof(n[i]), 0.35, 'triangle', 0.3, i * 0.09); },
    lose: function () { var n = [67, 63, 60, 55]; for (var i = 0; i < n.length; i++) tone(mtof(n[i]), 0.4, 'triangle', 0.25, i * 0.18); },
    click: function () { tone(880, 0.08, 'sine', 0.3, 0, 1320); }
  };
})();

// ---------------------------------------------------------------- canvas / layout
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var W = 360, H = 640, DPR = 1, S = 1, OX = 0, OY = 0;
var SPR = [], GLOW = null, BOARD = null;

var GEMS = [
  { c1: '#ffc2cd', c2: '#ff2d55', c3: '#7d0620', glow: '#ff5a7a', shape: 'square' },
  { c1: '#ffe0b0', c2: '#ff8a1c', c3: '#8f3a05', glow: '#ffa040', shape: 'round' },
  { c1: '#fffbc9', c2: '#ffd60a', c3: '#946b00', glow: '#ffe14d', shape: 'diamond' },
  { c1: '#c6ffd9', c2: '#20d46b', c3: '#06592a', glow: '#3dff8a', shape: 'hex' },
  { c1: '#c9e6ff', c2: '#2f8cff', c3: '#0a2f80', glow: '#5ab0ff', shape: 'tri' },
  { c1: '#efd0ff', c2: '#a63cff', c3: '#430a85', glow: '#c77dff', shape: 'star' }
];

function shapePts(shape, R) {
  var p = [], i, a;
  if (shape === 'square') { for (i = 0; i < 4; i++) { a = Math.PI / 4 + i * Math.PI / 2; p.push([Math.cos(a) * R * 1.08, Math.sin(a) * R * 1.08]); } }
  else if (shape === 'round') { for (i = 0; i < 10; i++) { a = -Math.PI / 2 + i * Math.PI / 5; p.push([Math.cos(a) * R, Math.sin(a) * R]); } }
  else if (shape === 'diamond') { p = [[0, -R * 1.12], [R * 0.86, 0], [0, R * 1.12], [-R * 0.86, 0]]; }
  else if (shape === 'hex') { for (i = 0; i < 6; i++) { a = -Math.PI / 2 + i * Math.PI / 3; p.push([Math.cos(a) * R * 1.04, Math.sin(a) * R * 1.04]); } }
  else if (shape === 'tri') { for (i = 0; i < 3; i++) { a = -Math.PI / 2 + i * 2 * Math.PI / 3; p.push([Math.cos(a) * R * 1.22, Math.sin(a) * R * 1.22 + R * 0.16]); } }
  else { for (i = 0; i < 10; i++) { a = -Math.PI / 2 + i * Math.PI / 5; var rr2 = i % 2 ? R * 0.52 : R * 1.14; p.push([Math.cos(a) * rr2, Math.sin(a) * rr2 + R * 0.04]); } }
  return p;
}
function polyPath(g, pts, rad) {
  var n = pts.length;
  g.beginPath();
  for (var i = 0; i < n; i++) {
    var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
    if (i === 0) g.moveTo((p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2);
    g.arcTo(p1[0], p1[1], (p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2, rad);
  }
  g.closePath();
}
function makeGemSprite(t) {
  var px = Math.max(8, Math.ceil(CELL * S * DPR));
  var c = document.createElement('canvas'); c.width = c.height = px;
  var g = c.getContext('2d');
  g.scale(px / CELL, px / CELL); g.translate(CELL / 2, CELL / 2);
  var G = GEMS[t], R = CELL * 0.395;
  var pts = shapePts(G.shape, R), rad = G.shape === 'tri' ? 6 : G.shape === 'star' ? 2.5 : 4;
  var inner = pts.map(function (p) { return [p[0] * 0.5, p[1] * 0.5 - R * 0.06]; });
  // shadow
  g.save(); g.translate(0, 3); polyPath(g, pts, rad); g.fillStyle = 'rgba(10,0,30,0.35)'; g.fill(); g.restore();
  // body
  polyPath(g, pts, rad);
  var gr = g.createLinearGradient(-R, -R, R, R);
  gr.addColorStop(0, G.c1); gr.addColorStop(0.42, G.c2); gr.addColorStop(1, G.c3);
  g.fillStyle = gr; g.fill();
  // facets
  g.save(); polyPath(g, pts, rad); g.clip();
  var n = pts.length;
  for (var i = 0; i < n; i++) {
    var a = pts[i], b = pts[(i + 1) % n], ia = inner[i], ib = inner[(i + 1) % n];
    var ang = Math.atan2((a[1] + b[1]) / 2, (a[0] + b[0]) / 2);
    var sh = Math.cos(ang + Math.PI * 0.75);
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(ib[0], ib[1]); g.lineTo(ia[0], ia[1]); g.closePath();
    g.fillStyle = sh > 0 ? 'rgba(255,255,255,' + (0.32 * sh).toFixed(3) + ')' : 'rgba(20,0,40,' + (-0.3 * sh).toFixed(3) + ')';
    g.fill();
  }
  // table
  polyPath(g, inner, rad * 0.5);
  var tg = g.createLinearGradient(0, -R * 0.6, 0, R * 0.6);
  tg.addColorStop(0, 'rgba(255,255,255,0.55)'); tg.addColorStop(1, 'rgba(255,255,255,0.05)');
  g.fillStyle = tg; g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 0.8;
  for (i = 0; i < n; i++) { g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(inner[i][0], inner[i][1]); g.stroke(); }
  g.restore();
  // rim
  polyPath(g, pts, rad);
  g.lineWidth = 1.6; g.strokeStyle = 'rgba(30,0,40,0.45)'; g.stroke();
  // gloss
  g.save(); g.beginPath(); g.ellipse(-R * 0.34, -R * 0.42, R * 0.3, R * 0.13, -0.65, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,0.85)'; g.fill(); g.restore();
  g.beginPath(); g.arc(R * 0.36, R * 0.34, R * 0.07, 0, Math.PI * 2); g.fillStyle = 'rgba(255,255,255,0.55)'; g.fill();
  return c;
}
function makeGlow() {
  var px = 64, c = document.createElement('canvas'); c.width = c.height = px;
  var g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, px, px); return c;
}
function makeBoard() {
  var lw = COLS * CELL + 24, lh = ROWS * CELL + 24;
  var c = document.createElement('canvas');
  c.width = Math.ceil(lw * S * DPR); c.height = Math.ceil(lh * S * DPR);
  var g = c.getContext('2d'); g.scale(S * DPR, S * DPR);
  rr(g, 2, 4, lw - 4, lh - 4, 22); g.fillStyle = 'rgba(8,0,30,0.45)'; g.fill();
  rr(g, 2, 2, lw - 4, lh - 6, 22);
  var gr = g.createLinearGradient(0, 0, 0, lh);
  gr.addColorStop(0, 'rgba(70,30,150,0.88)'); gr.addColorStop(1, 'rgba(36,12,90,0.92)');
  g.fillStyle = gr; g.fill();

function updateGems(dt) {
  var moving = false;
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    var g = grid[r][c]; if (!g) continue;
    if (g.sq > 0) g.sq = Math.max(0, g.sq - dt * 6);
    if (g.flash > 0) g.flash = Math.max(0, g.flash - dt * 2.5);
    if (g.pop > 0) g.pop = Math.max(0, g.pop - dt);
    if (swap && (g === swap.ga || g === swap.gb)) continue;
    g.x = c;
    if (g.y < r) {
      if (g.delay > 0) { g.delay -= dt; moving = true; continue; }
      g.vy = Math.min(g.vy + 75 * dt, 24);
      g.y += g.vy * dt;
      if (g.y >= r) { g.y = r; if (g.vy > 4) { g.sq = 1; } g.vy = 0; }
      moving = true;
    } else if (g.y > r) { g.y = r; }
  }

}

function update(dt) {

  if (shake > 0) shake = Math.max(0, shake - dt);
  if (scorePulse > 0) scorePulse = Math.max(0, scorePulse - dt * 3);
  shownScore += (score - shownScore) * Math.min(1, dt * 8);
  if (Math.abs(score - shownScore) < 1) shownScore = score;
  var i;
  for (i = parts.length - 1; i >= 0; i--) {
    var p = parts[i]; p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    if (p.kind === 'shard') { p.vy += 520 * dt; p.vx *= 0.98; p.rot += p.vr * dt; }
    else if (p.kind === 'conf') { p.vy = Math.min(p.vy + 60 * dt, 240); p.vx += Math.sin(p.life * 4 + p.rot) * 30 * dt; p.rot += p.vr * dt; }
    else if (p.kind === 'spark') { p.vx *= 0.94; p.vy *= 0.94; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (i = texts.length - 1; i >= 0; i--) { texts[i].t += dt; if (texts[i].t >= texts[i].dur) texts.splice(i, 1); }
  if (banners.length) {
    var b0 = banners[0]; b0.t += dt;
    if (banners.length > 1 && b0.t > 0.7 && b0.t < b0.dur - 0.3) b0.t = b0.dur - 0.3;
    if (b0.t >= b0.dur) banners.shift();
  }
  for (i = beams.length - 1; i >= 0; i--) { beams[i].t += dt; if (beams[i].t >= beams[i].dur) beams.splice(i, 1); }
  for (i = flyers.length - 1; i >= 0; i--) { flyers[i].t += dt; if (flyers[i].t >= flyers[i].dur) { flyers.splice(i, 1); scorePulse = 1; } }

  if (timerOn && playing && !timeUp) {
    timeLeft -= dt;
    if (!hurryDone && timeLeft <= 10 && SESSION > 15) { hurryDone = true; banner('HURRY!', '10 SECONDS LEFT', '#ff7a9a', 1.4); }
    var whole = Math.ceil(timeLeft);
    if (whole <= 5 && whole < lastTick && whole > 0) { lastTick = whole; SFX.tick(); }
    if (timeLeft <= 0) { timeLeft = 0; timeUp = true; timerOn = false; }
  }

  var moving;

        SFX.land();

    case 'idle':

      idleT += dt;
      if (tut.active) tut.t += dt;
      if (timeUp) { finishSession(); break; }
      if (!feverDone && timerOn && (SESSION - timeLeft >= FEVER_AT || score >= TARGET * 0.45)) { triggerFever(); break; }
      if (!tut.active && !hint && idleT > 5) hint = { move: findMove(true), t: 0 };

    default:

  }
}

function swapUpdate(dt) {
  var s = swap, ga = grid[s.a[0]][s.a[1]], gb = grid[s.b[0]][s.b[1]];

  s.t += dt / 0.17;
  var e = easeInOut(Math.min(1, s.t));

  s.ga.x = lerp(from[1], to[1], e); s.ga.y = lerp(from[0], to[0], e);

    function () { rr(ctx, -10, 62, 46, 14, 5); }
  ];
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
  ctx.strokeStyle = '#2a0b62'; ctx.lineWidth = 6;
  for (var i = 0; i < parts2.length; i++) { parts2[i](); ctx.stroke(); }
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#ffffff';
  for (i = 0; i < parts2.length - 1; i++) { parts2[i](); ctx.fill(); }
  ctx.fillStyle = '#ff5ab4'; parts2[parts2.length - 1](); ctx.fill();
  ctx.strokeStyle = 'rgba(42,11,98,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-3, 8); ctx.lineTo(3, 8); ctx.stroke();
  ctx.restore();
}
function drawTutorial() {
  var m = null, t = 0, showText = false;
  if (tut.active && phase === 'idle' && tut.move) { m = tut.move; t = tut.t; showText = true; }
  else if (hint && hint.move && phase === 'idle') { m = hint.move; t = hint.t; }
  if (showText || (tut.active && (phase === 'intro'))) {
    var a = 0.85 + 0.15 * Math.sin(bgT * 4);
    ctx.save(); ctx.globalAlpha = a;
    rr(ctx, 34, 548, 292, 50, 25); ctx.fillStyle = 'rgba(10,0,40,0.72)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.stroke();
    ctx.restore();
    text('Swipe a gem to match 3!', 180, 573, 21, '#ffffff', '#2a0b62', 4);
  } else if (phase !== 'end' && phase !== 'results') {
    // bottom tip / fever meter
    if (feverT > 0) {
      var fw = 260 * (feverT / 10);
      rr(ctx, 50, 548, 260, 22, 11); ctx.fillStyle = 'rgba(10,0,40,0.65)'; ctx.fill();
      rr(ctx, 50, 548, Math.max(22, fw), 22, 11);
      var fg = ctx.createLinearGradient(50, 0, 310, 0); fg.addColorStop(0, '#ff3d6e'); fg.addColorStop(1, '#ffd23f');
      ctx.fillStyle = fg; ctx.fill();
      text('FEVER  x2', 180, 590, 20, '#ffb13a', '#2a0b62', 4);
    } else {
      var tip = madeBlaster ? 'Match a BLASTER to clear its row!' : 'Match 4 to craft a ROW BLASTER!';
      text(tip, 180, 566, 16, 'rgba(255,255,255,0.85)', '#2a0b62', 4);
    }
  }
  if (!m) return;
  var cyc = (t % 1.6) / 1.6;
  var a0 = cellCenter(m.a[0], m.a[1]), b0 = cellCenter(m.b[0], m.b[1]);
  var press = 0, mv = 0;
  if (cyc < 0.2) { press = cyc / 0.2; mv = 0; }
  else if (cyc < 0.6) { press = 1; mv = easeInOut((cyc - 0.2) / 0.4); }
  else if (cyc < 0.75) { press = 1 - (cyc - 0.6) / 0.15; mv = 1; }
  else { press = 0; mv = 1; }
  var alpha = cyc > 0.85 ? 1 - (cyc - 0.85) / 0.15 : cyc < 0.08 ? cyc / 0.08 : 1;
  var hx = lerp(a0[0], b0[0], mv), hy = lerp(a0[1], b0[1], mv);
  ctx.save(); ctx.globalAlpha = alpha;
  if (press > 0.3) {
    ctx.beginPath(); ctx.arc(hx, hy, 10 + 10 * press, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
  }
  // arrow trail
  if (mv > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a0[0], a0[1]); ctx.lineTo(hx, hy); ctx.stroke();
  }
  drawHand(hx + 4, hy + 6, 0.8, press);
  ctx.restore();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  drawHUD();
  drawBoard();
  drawParticles();
  drawFlyers();
  drawTexts();
  drawBanners();
  if (phase !== 'results' && phase !== 'end') drawTutorial();
}

// ---------------------------------------------------------------- main loop
var lastTs = -1;
function frame(ts) {
  if (lastTs < 0) lastTs = ts;
  var dt = (ts - lastTs) / 1000; lastTs = ts;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
// safety net: end card even if animation frames are throttled and the player is idle
setInterval(function () {
  var now = performance.now();
  if (!endShown && now - loadTime > 62000 && now - lastInput > 15000) showEnd();
}, 1000);

resetSession();
requestAnimationFrame(frame);
})();
</script>
