<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Comet Dodge</title>
<style>
*{box-sizing:border-box}
:root{--u:1px}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050716;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:"Trebuchet MS","Segoe UI","Helvetica Neue",Arial,sans-serif}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s;touch-action:none;z-index:10}
.ov.show{opacity:1;visibility:visible;transition:opacity .3s ease}
.btn{position:relative;display:block;border:0;outline:0;cursor:pointer;font-family:inherit;font-weight:900;color:#fff;border-radius:calc(var(--u)*40);touch-action:manipulation;-webkit-appearance:none;appearance:none}
@keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.14,1.5);opacity:0}}
.btn.pulse::after{content:'';position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;border:calc(var(--u)*3) solid var(--ring);animation:ring 1.25s ease-out infinite;pointer-events:none}
@keyframes glowc{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(calc(var(--u)*-8)) rotate(4deg)}}
#over{background:radial-gradient(ellipse at 50% 45%,rgba(70,8,30,.45),rgba(4,4,20,.78) 75%)}
.opanel{display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;width:calc(var(--u)*320)}
.down{font-size:calc(var(--u)*46);font-weight:900;line-height:1;letter-spacing:calc(var(--u)*2);color:#ff5d6e;text-shadow:0 calc(var(--u)*4) 0 #4a0a1e,0 0 calc(var(--u)*26) rgba(255,70,90,.75);transform:scale(.4);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
#over.show .down{transform:scale(1)}
.osub{margin-top:calc(var(--u)*14);font-size:calc(var(--u)*16);color:#cfe3ff;opacity:.95}
.osub b{color:#ffd84d}
#retry{margin-top:calc(var(--u)*28);width:calc(var(--u)*236);padding:calc(var(--u)*16) 0;font-size:calc(var(--u)*25);letter-spacing:calc(var(--u)*1);background:linear-gradient(180deg,#7ff6ff,#1f9fe0 60%,#1b6fc4);box-shadow:0 calc(var(--u)*5) 0 #0b3f7a,0 calc(var(--u)*12) calc(var(--u)*26) rgba(0,0,0,.45),0 0 calc(var(--u)*26) rgba(95,240,255,.45);text-shadow:0 calc(var(--u)*2) 0 #0b3f7a;transition:transform .4s cubic-bezier(.2,1.6,.4,1),opacity .25s;animation:glowc 1.1s ease-in-out infinite;--ring:rgba(127,246,255,.85)}
#retry.hide{opacity:0;transform:scale(.3);pointer-events:none;animation:none}
#retry.hide::after{animation:none;opacity:0}
#retry:active{transform:translateY(calc(var(--u)*3))}
.ohint{margin-top:calc(var(--u)*14);font-size:calc(var(--u)*13);color:#9fb4e0;min-height:calc(var(--u)*16)}
#end{background:radial-gradient(ellipse at 50% 32%,rgba(70,36,140,.78),rgba(8,8,32,.95) 72%)}
.ecard{display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;width:calc(var(--u)*320);transform:translateY(calc(var(--u)*30)) scale(.92);transition:transform .55s cubic-bezier(.2,1.4,.4,1)}
#end.show .ecard{transform:none}
.icon{width:calc(var(--u)*124);height:calc(var(--u)*124);border-radius:calc(var(--u)*32);background:radial-gradient(circle at 70% 25%,#ff9a4a 0,rgba(255,120,60,0) 38%),linear-gradient(160deg,#16205e,#38186a 65%,#6a1f62);box-shadow:inset 0 0 0 calc(var(--u)*4) rgba(255,255,255,.16),0 calc(var(--u)*14) calc(var(--u)*30) rgba(0,0,0,.5),0 0 calc(var(--u)*44) rgba(95,240,255,.35);display:flex;align-items:center;justify-content:center;animation:bob 2.4s ease-in-out infinite;overflow:hidden}
.icon svg{width:84%;height:84%}
.etitle{margin-top:calc(var(--u)*20);font-size:calc(var(--u)*54);font-weight:900;line-height:.92;letter-spacing:calc(var(--u)*2);color:#fff;text-shadow:0 calc(var(--u)*4) 0 #ff7a2f,0 calc(var(--u)*8) 0 #241a6e,0 0 calc(var(--u)*30) rgba(95,240,255,.55)}
.etag{margin-top:calc(var(--u)*20);font-size:calc(var(--u)*18);line-height:1.3;color:#e6eeff}
.escore{margin-top:calc(var(--u)*10);font-size:calc(var(--u)*14);color:#ffd84d;min-height:calc(var(--u)*18)}
#cta{margin-top:calc(var(--u)*26);width:calc(var(--u)*262);padding:calc(var(--u)*19) 0;font-size:calc(var(--u)*33);letter-spacing:calc(var(--u)*2);background:linear-gradient(180deg,#ffe46a,#ffb21f 55%,#ff8a12);box-shadow:0 calc(var(--u)*6) 0 #b3560a,0 calc(var(--u)*14) calc(var(--u)*30) rgba(0,0,0,.45),0 0 calc(var(--u)*34) rgba(255,200,80,.55);text-shadow:0 calc(var(--u)*2) 0 #b3560a;animation:glowc 1.1s ease-in-out infinite;--ring:rgba(255,226,110,.9)}
#cta:active{transform:translateY(calc(var(--u)*3))}
.efree{margin-top:calc(var(--u)*14);font-size:calc(var(--u)*12);color:#b8c4ea;opacity:.8}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="over" class="ov" aria-live="polite">
  <div class="opanel">
    <div class="down">SHIP DOWN</div>
    <div class="osub" id="oSub">Score <b>0</b></div>
    <button class="btn pulse hide" id="retry" type="button">TRY AGAIN</button>
    <div class="ohint" id="oHint"></div>
  </div>
</div>
<div id="end" class="ov">
  <div class="ecard">
    <div class="icon"><svg viewBox="-34 -38 68 76" aria-hidden="true">
      <defs>
        <linearGradient id="gh" x1="0" x2="1"><stop offset="0" stop-color="#b9c9e6"/><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#8fa3c9"/></linearGradient>
        <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ee6d8"/><stop offset="1" stop-color="#0e7f9a"/></linearGradient>
        <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff7a2f"/></linearGradient>
        <radialGradient id="gf"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#7ff6ff"/><stop offset="1" stop-color="#5ff0ff" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse cx="-6" cy="30" rx="5" ry="10" fill="url(#gf)"/><ellipse cx="6" cy="30" rx="5" ry="10" fill="url(#gf)"/>
      <path d="M-10,-2 L-27,14 L-25,22 L-11,17 Z M10,-2 L27,14 L25,22 L11,17 Z" fill="url(#gw)" stroke="#0d1440" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0,-28 C6,-20 10,-12 11,-4 L13,14 L7,21 L-7,21 L-13,14 L-11,-4 C-10,-12 -6,-20 0,-28 Z" fill="url(#gh)" stroke="#0d1440" stroke-width="2" stroke-linejoin="round"/>
      <rect x="-1.5" y="3" width="3" height="15" rx="1.5" fill="#2bd3c9"/>
      <ellipse cx="0" cy="-8" rx="4.8" ry="8.6" fill="url(#gc)" stroke="#0d1440" stroke-width="1.6"/>
      <ellipse cx="-1.6" cy="-11" rx="1.4" ry="3" fill="#fff" opacity=".8"/>
    </svg></div>
    <div class="etitle">COMET<br>DODGE</div>
    <div class="etag">Dodge the storm.<br>Catch every star.</div>
    <div class="escore" id="eScore"></div>
    <button class="btn pulse" id="cta" type="button">PLAY NOW</button>
    <div class="efree">Free to play</div>
  </div>
</div>
<script>
(function () {
'use strict';

// ------------------------------------------------------------------ config
var QS = new URLSearchParams(location.search);
var FAST = QS.get('fast') === '1';              // test flag: shortened timers
var DEBUG = QS.get('debug') === '1';            // test flag: exposes read-only state
var START_AT = clamp(parseFloat(QS.get('at')) || 0, 0, 45); // test flag: start the run later in the timeline
var SESSION = FAST ? 14 : 50;                   // seconds of play before the end card
var INTRO_IDLE = FAST ? 5 : 12;                 // no first touch -> end card
var PLAY_IDLE = FAST ? 6 : 15;                  // no input during play -> end card
var OVER_IDLE = FAST ? 3 : 8;                   // TRY AGAIN not pressed -> end card
var STORE_URL = 'https://example.com/app';
var FONT = '"Trebuchet MS","Segoe UI","Helvetica Neue",Arial,sans-serif';
var SHIP_R = 13, MAXV = 290, MARG = 26, COMBO_TIME = 3.2;
var TAU = Math.PI * 2;

// ------------------------------------------------------------------ utils
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function mixc(a, b, t) { return [Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))]; }
function rrect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r);
  g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h); g.arcTo(x, y + h, x, y + h - r, r);
  g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r); g.closePath();
}
function fmt(n) { n = Math.round(n); var s = String(Math.abs(n)), out = ''; while (s.length > 3) { out = ',' + s.slice(-3) + out; s = s.slice(0, -3); } return (n < 0 ? '-' : '') + s + out; }
function fmtDist(m) { return m < 1000 ? Math.floor(m) + ' m' : (m / 1000).toFixed(2) + ' km'; }
function mk(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// ------------------------------------------------------------------ dom
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
var overEl = document.getElementById('over'), retryBtn = document.getElementById('retry');
var oSub = document.getElementById('oSub'), oHint = document.getElementById('oHint');
var endEl = document.getElementById('end'), ctaBtn = document.getElementById('cta'), eScore = document.getElementById('eScore');

// ------------------------------------------------------------------ layout
var cssW = 360, cssH = 640, dpr = 1, S = 1, W = 360, H = 640, PW = 360, X0 = 0;
var bgGrad, hudGrad, vigGrad, edgeL, edgeR, tintGrad;
var ship = { x: 180, y: 522, vx: 0, tilt: 0, inv: 0, shield: false, shieldA: 0, alive: true, enter: 0, dragDX: 0, emit: 0 };

function resize() {
  cssW = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 360);
  cssH = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 640);
  dpr = clamp(window.devicePixelRatio || 1, 1, 3);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  S = Math.min(cssW / 360, cssH / 640);
  W = cssW / S; H = cssH / S;
  PW = Math.min(W, Math.max(360, H * 0.75)); X0 = (W - PW) / 2;
  document.documentElement.style.setProperty('--u', S.toFixed(4) + 'px');
  ship.y = H - 118; ship.x = clamp(ship.x, MARG, PW - MARG);
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#04061a'); bgGrad.addColorStop(0.45, '#0b0e34'); bgGrad.addColorStop(0.8, '#1d1248'); bgGrad.addColorStop(1, '#341552');
  hudGrad = ctx.createLinearGradient(0, 0, 0, 88);
  hudGrad.addColorStop(0, 'rgba(3,5,20,0.78)'); hudGrad.addColorStop(1, 'rgba(3,5,20,0)');
  vigGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); vigGrad.addColorStop(1, 'rgba(0,0,10,0.55)');
  edgeL = ctx.createLinearGradient(0, 0, 70, 0); edgeL.addColorStop(0, 'rgba(255,40,30,0.55)'); edgeL.addColorStop(1, 'rgba(255,40,30,0)');
  edgeR = ctx.createLinearGradient(PW, 0, PW - 70, 0); edgeR.addColorStop(0, 'rgba(255,40,30,0.55)'); edgeR.addColorStop(1, 'rgba(255,40,30,0)');
  tintGrad = ctx.createLinearGradient(0, 0, 0, H); tintGrad.addColorStop(0, 'rgba(255,60,30,0.28)'); tintGrad.addColorStop(0.6, 'rgba(255,90,40,0.10)'); tintGrad.addColorStop(1, 'rgba(255,40,80,0.22)');
  buildSprites();
  initStars();
}

// ------------------------------------------------------------------ sprites
var SPR = {};
function makeGlow(c, sc) {
  var s = Math.ceil(64 * Math.min(sc, 2)), cvs = mk(s, s), g = cvs.getContext('2d');
  var gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2), core = mixc(c, [255, 255, 255], 0.65);
  gr.addColorStop(0, rgba(core, 1)); gr.addColorStop(0.16, rgba(c, 0.8)); gr.addColorStop(0.42, rgba(c, 0.26)); gr.addColorStop(1, rgba(c, 0));
  g.fillStyle = gr; g.fillRect(0, 0, s, s); return cvs;
}
function makeRock(seed, sc, red) {
  var R = 32, s = Math.ceil(R * 2 * sc), cvs = mk(s, s), g = cvs.getContext('2d');
  g.scale(s / (R * 2), s / (R * 2)); g.translate(R, R);
  var rnd = mulberry32(seed * 977 + 13 + (red ? 5 : 0)), n = 10 + (seed % 3), pts = [], i;
  for (i = 0; i < n; i++) { var a = i / n * TAU + (rnd() - 0.5) * 0.35, rr = R * 0.86 * (0.78 + rnd() * 0.22); pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
  function path() { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (var j = 1; j < n; j++) g.lineTo(pts[j][0], pts[j][1]); g.closePath(); }
  path();
  var gr = g.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.08, 0, 0, R * 0.95);
  if (red) { gr.addColorStop(0, '#c87a64'); gr.addColorStop(0.5, '#7a3a3a'); gr.addColorStop(1, '#2e1218'); }
  else { gr.addColorStop(0, '#b29a8e'); gr.addColorStop(0.5, '#665058'); gr.addColorStop(1, '#261824'); }
  g.fillStyle = gr; g.fill();
  g.save(); path(); g.clip();
  var nc = 4 + (seed % 3);
  for (i = 0; i < nc; i++) {
    var cx = (rnd() - 0.5) * R * 1.1, cy = (rnd() - 0.5) * R * 1.1, cr = R * (0.09 + rnd() * 0.14);
    g.beginPath(); g.arc(cx, cy, cr, 0, TAU); g.fillStyle = 'rgba(18,8,20,0.38)'; g.fill();
    g.beginPath(); g.arc(cx, cy, cr, 0.2, 2.2); g.strokeStyle = 'rgba(255,225,205,0.22)'; g.lineWidth = 1.6; g.stroke();
  }
  for (i = 0; i < 14; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(255,240,230,0.10)' : 'rgba(10,5,15,0.18)'; g.fillRect((rnd() - 0.5) * R * 1.5, (rnd() - 0.5) * R * 1.5, 2, 2); }
  g.restore();
  path(); g.lineJoin = 'round'; g.lineWidth = 2.4; g.strokeStyle = '#1a0d18'; g.stroke();
  return cvs;
}
function makeTail(core, outer, sc) {
  var k = Math.min(sc, 2), cvs = mk(64 * k, 256 * k), g = cvs.getContext('2d');
  g.scale(k, k);
  function layer(hw, col, a0, fade) {
    var gr = g.createLinearGradient(0, 236, 0, 0);
    gr.addColorStop(0, rgba(col, a0)); gr.addColorStop(fade * 0.45, rgba(col, a0 * 0.55)); gr.addColorStop(fade, rgba(col, 0)); gr.addColorStop(1, rgba(col, 0));
    g.fillStyle = gr; g.beginPath();
    g.moveTo(32 - hw, 224);
    g.quadraticCurveTo(32 - hw * 0.8, 110, 32, 236 - 236 * fade);
    g.quadraticCurveTo(32 + hw * 0.8, 110, 32 + hw, 224);
    g.arc(32, 224, hw, 0, Math.PI, false);
    g.fill();
  }
  // wide faint layers first for a soft edge, then a hot narrow core that fades quickly
  layer(31, outer, 0.10, 1); layer(27, outer, 0.14, 0.95); layer(22, outer, 0.2, 0.9);
  layer(16, mixc(outer, core, 0.35), 0.32, 0.75); layer(10, mixc(outer, core, 0.7), 0.45, 0.5); layer(5, core, 0.7, 0.3);
  return cvs;
}
function starPath(g, R, r) {
  g.beginPath();
  for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; if (i) g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.closePath();
}
function makeStar(sc) {
  var L = 40, s = Math.ceil(L * sc), cvs = mk(s, s), g = cvs.getContext('2d');
  g.scale(s / L, s / L); g.translate(L / 2, L / 2 + 1);
  starPath(g, 16, 7.2);
  var gr = g.createLinearGradient(0, -16, 0, 14); gr.addColorStop(0, '#fffbd2'); gr.addColorStop(0.45, '#ffd23f'); gr.addColorStop(1, '#ff9618');
  g.fillStyle = gr; g.fill(); g.lineJoin = 'round'; g.lineWidth = 2.2; g.strokeStyle = '#8a3a00'; g.stroke();
  starPath(g, 9, 4); g.fillStyle = 'rgba(255,255,230,0.45)'; g.fill();
  g.beginPath(); g.ellipse(-4, -7, 2.2, 3.6, -0.5, 0, TAU); g.fillStyle = 'rgba(255,255,255,0.85)'; g.fill();
  return cvs;
}
function shieldPath(g, s) {
  g.beginPath(); g.moveTo(0, -11 * s);
  g.quadraticCurveTo(6 * s, -8 * s, 10 * s, -8 * s); g.quadraticCurveTo(10 * s, 6 * s, 0, 12 * s);
  g.quadraticCurveTo(-10 * s, 6 * s, -10 * s, -8 * s); g.quadraticCurveTo(-6 * s, -8 * s, 0, -11 * s); g.closePath();
}
function makeShieldOrb(sc) {
  var L = 56, s = Math.ceil(L * sc), cvs = mk(s, s), g = cvs.getContext('2d');
  g.scale(s / L, s / L); g.translate(L / 2, L / 2);
  var gr = g.createRadialGradient(0, 0, 4, 0, 0, 24); gr.addColorStop(0, 'rgba(90,240,255,0.05)'); gr.addColorStop(0.75, 'rgba(90,240,255,0.25)'); gr.addColorStop(1, 'rgba(160,250,255,0.75)');
  g.beginPath(); g.arc(0, 0, 24, 0, TAU); g.fillStyle = gr; g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(200,255,255,0.95)'; g.stroke();
  shieldPath(g, 1.15);
  var sg = g.createLinearGradient(0, -12, 0, 14); sg.addColorStop(0, '#bffcff'); sg.addColorStop(0.5, '#33c6f0'); sg.addColorStop(1, '#1a5fc0');
  g.fillStyle = sg; g.fill(); g.lineJoin = 'round'; g.lineWidth = 2; g.strokeStyle = '#0a2a5c'; g.stroke();
  g.beginPath(); g.moveTo(-4.5, 0); g.lineTo(-1, 4); g.lineTo(5, -4); g.lineWidth = 2.6; g.lineCap = 'round'; g.strokeStyle = '#fff'; g.stroke();
  g.beginPath(); g.arc(0, 0, 20, -2.6, -1.7); g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,0.8)'; g.stroke();
  return cvs;
}
function makePlanet(sc) {
  var Lw = 230, Lh = 160, k = Math.min(sc, 2.5), cvs = mk(Lw * k, Lh * k), g = cvs.getContext('2d'), R = 50;
  g.scale(k, k); g.translate(Lw / 2, Lh / 2);
  function ring(back) {
    g.save(); g.rotate(-0.3); g.lineCap = 'round';
    var a0 = back ? Math.PI : 0, a1 = back ? TAU : Math.PI;
    g.beginPath(); g.ellipse(0, 0, 100, 24, 0, a0, a1); g.lineWidth = 9; g.strokeStyle = 'rgba(255,200,230,0.28)'; g.stroke();
    g.beginPath(); g.ellipse(0, 0, 88, 20, 0, a0, a1); g.lineWidth = 3; g.strokeStyle = 'rgba(255,235,250,0.45)'; g.stroke();
    g.beginPath(); g.ellipse(0, 0, 108, 26, 0, a0, a1); g.lineWidth = 1.5; g.strokeStyle = 'rgba(200,170,255,0.35)'; g.stroke();
    g.restore();
  }
  ring(true);
  g.save(); g.beginPath(); g.arc(0, 0, R, 0, TAU); g.clip();

function showBanner(title, sub, col, dur) { banner = { title: title, sub: sub || '', col: col || '#ffd84d', t: 0, d: dur || 1.5 }; sfx.whoosh(0.8); }

// ------------------------------------------------------------------ spawning
var lastSpawnX = -999;
function pickX(m) {
  var x = rand(m, PW - m);
  for (var i = 0; i < 4 && Math.abs(x - lastSpawnX) < 55; i++) x = rand(m, PW - m);
  lastSpawnX = x; return x;
}
function spawnComet(type, x, y, vx, vy, r) {
  var c = {
    type: type, x: x, y: y, vx: vx, vy: vy, dvx: vx, r: r, hr: r * (type === 'meteor' ? 0.8 : 0.78),
    rot: rand(0, TAU), vr: rand(-2.2, 2.2), spr: (Math.random() * 6) | 0, t: 0, near: 1e9, passed: false, dead: false, emit: 0, label: null,
    tail: type === 'zig' ? 'm' : type === 'big' ? 'r' : type === 'meteor' ? 'y' : 'o',

  comets.push(c); return c;
}
function rainX(m, aim) { return Math.random() < aim ? clamp(ship.x + rand(-18, 18), m, PW - m) : pickX(m); }
function spawnZig(x0, amp, w, vy) {
  var c = spawnComet('zig', x0, -40, 0, vy, rand(13, 16));
  c.x0 = x0; c.amp = amp; c.w = w; c.ph = rand(0, TAU); c.x = x0 + Math.sin(c.ph) * amp; return c;
}
function spawnBig(x, vy) { var c = spawnComet('big', x, -50, 0, vy, 26); c.splitY = H * rand(0.3, 0.4); return c; }
function spawnStar(x, y, vy) {
  var s = { x: clamp(x, 20, PW - 20), y: y, vy: vy, r: 13, rot: rand(-0.3, 0.3), t: rand(0, 3), dead: false, label: null };
  if (firstRun && phase === 'gentle' && !labelsShown.star) { s.label = 'CATCH!'; labelsShown.star = true; }
  stars.push(s); return s;
}
function spawnOrb() { var x0 = rand(80, PW - 80); orbs.push({ x: x0, x0: x0, y: -40, vy: 105, t: 0, dead: false }); }
function spawnWall(gx, gw, vy) {
  var r0 = 15, step = 34, off = rand(0, step);
  for (var x = off - step; x < PW + step; x += step) {
    if (Math.abs(x - gx) < gw / 2 + r0 * 0.7) continue;
    if (x < -r0 || x > PW + r0) continue;
    spawnComet('wall', x + rand(-3, 3), -40 + rand(-7, 7), 0, vy, rand(13.5, 16));
  }
  spawnStar(gx, -40, vy);
  sfx.whoosh(0.6);
}
function wallGap(gw, prev) {
  var lo = gw / 2 + 12, hi = PW - gw / 2 - 12, g = rand(lo, hi);
  if (prev !== undefined) for (var i = 0; i < 6 && (Math.abs(g - prev) < 70 || Math.abs(g - prev) > 210); i++) g = rand(lo, hi);
  return g;
}
function laneAt(t) { return PW / 2 + PW * 0.27 * Math.sin(t * 0.8) + 16 * Math.sin(t * 2.3 + 1); }

function setPhase(p) { phase = p; phaseT = 0; T = { a: 0, b: 0, c: 0, d: 0, e: 0, n: 0, m: 0, quiet: 0, pending: null, prevGap: undefined }; }

var PHASES = {
  none: function () {},
  gentle: function (dt) {
    // first wave: slow, single comets with stars on alternating sides - learnable
    T.a -= dt; T.b -= dt;
    if (T.n === 0 && T.a > 1.25) T.a = 1.25;
    if (T.a <= 0) {
      T.a += 1.45;
      var x = T.n === 0 || T.n % 3 === 2 ? clamp(ship.x + rand(-10, 10), 30, PW - 30) : pickX(30);
      spawnComet('rock', x, -40, 0, rand(150, 165), rand(14, 17));
      T.n++;
    }
    if (T.b <= 0) { T.b += 1.3; T.m++; spawnStar((T.m % 2 ? 0.27 : 0.73) * PW + rand(-28, 28), -30, 150); }
  },
  walls: function (dt) {
    T.a -= dt;
    if (T.n === 0 && T.a > 0.8) T.a = 0.8;
    if (T.a <= 0) { T.a += 2.6; var gw = Math.max(98, 130 - T.n * 10), g = wallGap(gw, T.prevGap); T.prevGap = g; spawnWall(g, gw, 175 * speedMul()); T.n++; }
  },
  zig: function (dt) {
    T.a -= dt; T.b -= dt; T.c -= dt;
    if (T.a <= 0) { T.a += Math.max(0.72, 1.05 - phaseT * 0.03); var amp = rand(45, 78); spawnZig(rand(amp + 22, PW - amp - 22), amp, rand(2.2, 3.3), 175 * speedMul()); }
    if (T.b <= 0) { T.b += 1.05; spawnStar(pickX(30), -30, 165 * speedMul()); }
    if (T.c <= 0) { T.c += 2.3; spawnComet('rock', rainX(30, 0.5), -40, 0, 200 * speedMul(), rand(13, 17)); }
  },
  split: function (dt) {
    T.a -= dt; T.b -= dt; T.c -= dt;
    if (T.a <= 0) { T.a += 2.2; spawnBig(rand(70, PW - 70), 140 * speedMul()); }
    if (T.b <= 0) { T.b += 1.15; spawnComet('rock', rainX(30, 0.3), -40, rand(-15, 15), rand(200, 240) * speedMul(), rand(12, 16)); }
    if (T.c <= 0) { T.c += 0.95; spawnStar(pickX(30), -30, 170 * speedMul()); }
  },
  double: function (dt) {
    T.a -= dt; T.c -= dt;

      if (g2 < 62 || g2 > PW - 62) g2 = g1 - d;
      g2 = clamp(g2, 62, PW - 62);

    }

  },
  calm: function (dt) {
    T.a -= dt; T.b -= dt;

function startShower() {
  setPhase('shower'); shower.on = true; shower.t = 0; shower.lost = false;
  showBanner('METEOR SHOWER!', 'Follow the stars to stay safe', '#ff5a3a', 1.9);
  trauma = Math.max(trauma, 0.6); flashW = 0.45; sfx.rumble(); musicLevel(2);
}
function endShower() {
  if (!shower.on) return;
  shower.on = false; setPhase('calm');
  var b = shower.lost ? 100 : 250;
  score += b; showBanner('SURVIVED!', '+' + b + ' shower bonus', '#ffd84d', 1.4);
  sparkleAt(ship.x, ship.y - 20, 24, SPR.glow.y, '#ffe27a'); sfx.fanfare(); musicLevel(1);
}

var EVENTS = [
  [0, function () { setPhase('gentle'); }],
  [7, function () { showBanner('COMET WALL!', 'Slip through the gap', '#ffa04a'); setPhase('walls'); }],
  [14, function () { showBanner('ZIG-ZAG!', 'They swerve - read the path', '#ff6ae0'); setPhase('zig'); }],
  [19, function () { spawnOrb(); showBanner('SHIELD!', 'Grab it - blocks one hit', '#6ff4ff'); }],
  [22.5, function () { showBanner('SPLIT ROCKS!', 'Big ones crack in two', '#ff6a5a'); setPhase('split'); }],
  [28, function () { showBanner('DOUBLE WALL!', 'Weave left and right', '#ffb84a'); setPhase('double'); }],
  [31.6, function () { setPhase('calm'); if (!ship.shield) spawnOrb(); }],
  [32.4, function () { showBanner('WARNING', 'Meteor shower incoming!', '#ff4a4a', 1.5); sfx.alarm(); warnT = 1.6; }],
  [34, function () { startShower(); }],
  [41.5, function () { endShower(); }],
  [43, function () { showBanner('FULL STORM!', 'Hold on tight', '#ff8a4a'); setPhase('storm'); }]

function phaseAt(t) { return t < 7 ? 'gentle' : t < 14 ? 'walls' : t < 22.5 ? 'zig' : t < 28 ? 'split' : t < 31.6 ? 'double' : t < 34 ? 'calm' : t < 41.5 ? 'shower' : t < 43 ? 'calm' : 'storm'; }
function seekTimeline(t0) {
  evIdx = 0;
  while (evIdx < EVENTS.length && EVENTS[evIdx][0] < t0) evIdx++;
  var p = phaseAt(t0);
  if (p === 'shower') { setPhase('shower'); shower.on = true; shower.t = t0 - 34; shower.lost = false; musicLevel(2); }
  else setPhase(p);
}
function director(dt) {
  while (evIdx < EVENTS.length && runT >= EVENTS[evIdx][0]) { EVENTS[evIdx][1](); evIdx++; }
  phaseT += dt;
  PHASES[phase](dt);
}

// ------------------------------------------------------------------ run flow
function startRun(retry) {
  state = 'play'; stateT = 0;
  lives = 3; score = 0; shownScore = 0; dist = 0; combo = 0; comboT = 0;
  ship.alive = true; ship.shield = false; ship.shieldA = 0; ship.inv = retry ? 1.6 : 0; ship.vx = 0; ship.tilt = 0; ship.dragDX = 0;
  ship.enter = retry ? 1 : 0; ship.x = PW / 2;
  comets.length = 0; stars.length = 0; orbs.length = 0; shower.on = false; heartPop = [0, 0, 0];
  if (retry) {
    var remaining = SESSION - playT;
    runT = clamp(34 - (remaining - 9), 4, 30);
    firstRun = false;
    showBanner('GO!', 'Last ship - make it count', '#7ff6ff', 1.3);
  } else {
    runT = START_AT;
  }
  seekTimeline(runT);
  if (MUS.lvl < 1 || phase !== 'shower') musicLevel(phase === 'shower' ? 2 : 1);
  musicVolume(0.75);
  lastInputS = nowS;
}
function hitShip(c) {
  c.dead = true;

    ship.shield = false; ship.inv = 1.0; stats.blocked++;
    explodeAt(c.x, c.y, 0.8, c.glow);
    var G = SPR.glow;
    ringP(ship.x, ship.y, 20, 80, 0.5, '#9ff8ff', 5);
    for (var i = 0; i < 18; i++) { var a = rand(0, TAU), sp = rand(80, 240); debrisP(ship.x + Math.cos(a) * 32, ship.y + Math.sin(a) * 32, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 0.9), rand(3, 5), i % 2 ? '#bff9ff' : '#4fd8f5'); glowP(ship.x, ship.y, Math.cos(a) * sp, Math.sin(a) * sp, 0.5, 16, 2, G.c, 3); }

    trauma = Math.min(1, trauma + 0.4); flashW = 0.25; hitStop = 0.05; sfx.shieldBreak();

  if (shower.on) shower.lost = true;
  heartPop[Math.max(0, lives)] = 0.6;
  explodeAt(c.x, c.y, 1, c.glow);
  trauma = Math.min(1, trauma + 0.75); flashR = 0.55; hitStop = 0.09;
  sfx.hit();

}

  ship.alive = false; gameOvers++; banner = null; warnT = 0;
  shipExplode(ship.x, ship.y);
  trauma = 1; flashW = 0.8; timeScale = 0.3; sfx.boom();
  state = 'dying'; stateT = 0;
  best = Math.max(best, score); bestDist = Math.max(bestDist, dist);

}

  oSub.innerHTML = 'Score <b>' + fmt(score) + '</b> &nbsp;&middot;&nbsp; ' + fmtDist(dist);
  oHint.textContent = gameOvers >= 2 ? 'Out of ships' : '';
  retryBtn.classList.add('hide');

}

  state = 'finish'; stateT = 0;
  var n = 0;
  for (var i = 0; i < comets.length; i++) { var c = comets[i]; if (c.y > -20 && c.y < H + 20) { sparkleAt(c.x, c.y, 8, SPR.glow.y, null); n++; } c.dead = true; }

// ------------------------------------------------------------------ input
var ptrs = {}, order = [], keys = { l: false, r: false };
function toLocal(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / S - X0, y: (e.clientY - r.top) / S }; }
function resetInput() { ptrs = {}; order = []; keys.l = keys.r = false; ship.dragDX = 0; }
function onDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (e.pointerType === 'mouse' || canStartAudio()) audioInit();
  lastInputS = nowS;
  if (state === 'end' || state === 'over' || state === 'dying') return;
  var p = toLocal(e);
  var near = Math.abs(p.x - ship.x) < 36 && Math.abs(p.y - ship.y) < 46;
  ptrs[e.pointerId] = { x: p.x, y: p.y, sx: p.x, lx: p.x, mode: near && state === 'play' ? 'drag' : 'hold' };
  order.push(e.pointerId);
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (state === 'intro') startRun(false);
}
function onMove(e) {
  var q = ptrs[e.pointerId];
  if (!q) return;
  e.preventDefault();
  lastInputS = nowS;
  var p = toLocal(e);
  q.x = p.x; q.y = p.y;
  if (q.mode === 'hold' && Math.abs(p.x - q.sx) > 14) { q.mode = 'drag'; q.lx = p.x; }
  if (q.mode === 'drag') { ship.dragDX += p.x - q.lx; q.lx = p.x; }
}
function onUp(e) {
  audioInit();
  lastInputS = nowS;
  if (!ptrs[e.pointerId]) return;
  delete ptrs[e.pointerId];
  var i = order.indexOf(e.pointerId); if (i >= 0) order.splice(i, 1);

cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('lostpointercapture', onUp);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = true; else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = true; else return;
  e.preventDefault(); audioInit(); lastInputS = nowS;
  if (state === 'intro') startRun(false);

window.addEventListener('keyup', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false; else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
  lastInputS = nowS;
});
window.addEventListener('blur', function () { resetInput(); });
retryBtn.addEventListener('click', function () {
  if (state !== 'over') return;
  audioInit(); sfx.click();
  overEl.classList.remove('show');
  startRun(true);
});
ctaBtn.addEventListener('click', function () {
  audioInit(); sfx.click();
  if (window.mraid) mraid.open('https://example.com/app'); else window.open('https://example.com/app');
});
document.addEventListener('visibilitychange', function () {
  if (!AC) return;
  try { if (document.hidden) AC.suspend(); else if (audioWanted) AC.resume(); } catch (e) { /* ignore */ }
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

// ------------------------------------------------------------------ update
function updateShip(dt, rdt) {
  var id = order.length ? order[order.length - 1] : null, p = id !== null ? ptrs[id] : null, tv = 0;
  if (p && p.mode === 'hold') tv = (p.x < PW / 2 ? -1 : 1) * MAXV;
  else if (!p) { if (keys.l && !keys.r) tv = -MAXV; else if (keys.r && !keys.l) tv = MAXV; }
  if (p && p.mode === 'drag') {
    var nx = clamp(ship.x + ship.dragDX, MARG, PW - MARG), v = (nx - ship.x) / Math.max(rdt, 0.004);
    ship.dragDX = 0; ship.x = nx;
    ship.vx += (clamp(v, -900, 900) - ship.vx) * (1 - Math.exp(-14 * rdt));
  } else {
    ship.dragDX = 0;
    ship.vx += (tv - ship.vx) * (1 - Math.exp(-16 * dt));
    ship.x += ship.vx * dt;
    if (ship.x < MARG) { ship.x = MARG; if (ship.vx < 0) ship.vx *= 0.3; }
    if (ship.x > PW - MARG) { ship.x = PW - MARG; if (ship.vx > 0) ship.vx *= 0.3; }
  }
  ship.tilt += (clamp(ship.vx / MAXV, -1.3, 1.3) * 0.34 - ship.tilt) * (1 - Math.exp(-12 * rdt));
  if (ship.inv > 0) ship.inv -= dt;
  if (ship.enter > 0) ship.enter = Math.max(0, ship.enter - rdt * 1.8);
  ship.shieldA += ((ship.shield ? 1 : 0) - ship.shieldA) * Math.min(1, rdt * 8);
}
function emitEngine(dt) {
  if (!ship.alive) return;
  ship.emit += dt * (46 + Math.abs(ship.vx) * 0.05);
  var G = SPR.glow, sy = ship.y + 24 + ship.enter * ship.enter * 130;
  while (ship.emit >= 1) {
    ship.emit -= 1;
    var side = Math.random() < 0.5 ? -6 : 6;
    glowP(ship.x + side * Math.cos(ship.tilt) + rand(-1.5, 1.5), sy, rand(-14, 14) - ship.vx * 0.25, rand(110, 170) * (0.6 + warp * 0.4), rand(0.25, 0.4), rand(9, 13), 2, Math.random() < 0.75 ? G.c : G.w, 0.8);
  }
}
function updateComets(dt) {
  var play = state === 'play' && ship.alive, G = SPR.glow;
  for (var i = 0; i < comets.length; i++) {
    var c = comets[i];
    if (c.dead) continue;
    c.t += dt;
    if (c.type === 'zig') {
      var ph = c.w * c.t + c.ph;
      c.x = c.x0 + c.amp * Math.sin(ph); c.dvx = c.amp * c.w * Math.cos(ph);
    } else { c.x += c.vx * dt; c.dvx = c.vx; }
    c.y += c.vy * dt; c.rot += c.vr * dt;
    if (c.type === 'big' && c.y >= c.splitY) {
      c.dead = true;
      explodeAt(c.x, c.y, 0.7, 'r'); sfx.crack(); trauma = Math.min(1, trauma + 0.2);
      for (var s = -1; s <= 1; s += 2) { var k = spawnComet('rock', c.x + s * 8, c.y, s * rand(80, 100), c.vy * 1.15, 13); k.tail = 'r'; k.glow = 'r'; }
      continue;
    }

    c.emit += dt * (c.type === 'meteor' ? 30 : c.type === 'big' ? 26 : 16);
    while (c.emit >= 1) {
      c.emit -= 1;
      var gl = G[c.glow];
      glowP(c.x + rand(-c.r, c.r) * 0.5, c.y + rand(-c.r, c.r) * 0.5, -c.dvx * 0.15 + rand(-12, 12), -c.vy * 0.12 + rand(-12, 12), rand(0.25, 0.5), c.r * rand(0.6, 1.0), 1, Math.random() < 0.3 ? G.y : gl, 1);
    }
    if (c.y > H + 70 || c.x < -90 || c.x > PW + 90) { c.dead = true; continue; }
    if (play) {

  ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#141a45'; shapes(); ctx.stroke();
  ctx.fillStyle = '#ffffff'; shapes(); ctx.fill();
  ctx.fillStyle = '#5ff0ff'; ctx.beginPath(); rrect(ctx, -12, 66, 30, 10, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(20,26,69,0.35)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(6, 35); ctx.lineTo(6, 44); ctx.moveTo(15, 37); ctx.lineTo(15, 46); ctx.moveTo(-6, 30); ctx.lineTo(-6, 40); ctx.stroke();
  ctx.beginPath(); rrect(ctx, -4.5, 3, 9, 9, 4); ctx.fillStyle = 'rgba(255,190,210,0.55)'; ctx.fill();
  ctx.restore();
}
function chevrons(x, y, dir, a) {
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (var i = 0; i < 3; i++) {
    var k = ((nowS * 2.2 + i / 3) % 1), cx = x + dir * (i * 16 + k * 10);
    ctx.globalAlpha = a * (1 - Math.abs(k - 0.5) * 1.2) * 0.95;
    ctx.strokeStyle = '#7ff6ff';
    ctx.beginPath(); ctx.moveTo(cx - dir * 6, y - 9); ctx.lineTo(cx + dir * 4, y); ctx.lineTo(cx - dir * 6, y + 9); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawTutorial() {
  var a = tutA;
  if (a < 0.01) return;
  var cyc = 2.6, t = nowS % cyc, lx = PW * 0.25, rx = PW * 0.75, hy = ship.y + 34, hx, side = 0, press = 0, pt = 0, k;
  if (t < 0.35) { k = easeInOut(t / 0.35); hx = lerp(rx, lx, k); }
  else if (t < 1.3) { hx = lx; side = -1; press = 1; pt = t - 0.35; }
  else if (t < 1.65) { k = easeInOut((t - 1.3) / 0.35); hx = lerp(lx, rx, k); }
  else { hx = rx; side = 1; press = 1; pt = t - 1.65; }
  tutGhost += (side * 66 - tutGhost) * (1 - Math.exp(-6 * frameDt));
  // half highlight
  if (side) {
    var gx = side < 0 ? 0 : PW / 2, g = ctx.createLinearGradient(0, H, 0, H * 0.35);
    g.addColorStop(0, 'rgba(95,240,255,0.20)'); g.addColorStop(1, 'rgba(95,240,255,0)');
    ctx.globalAlpha = a * Math.min(1, pt * 6); ctx.fillStyle = g; ctx.fillRect(gx, H * 0.35, PW / 2, H * 0.65);
  }
  ctx.globalAlpha = a * 0.5; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([6, 9]);
  ctx.beginPath(); ctx.moveTo(PW / 2, H * 0.47); ctx.lineTo(PW / 2, H - 10); ctx.stroke(); ctx.setLineDash([]);
  // ghost ship shows the result of holding
  ctx.globalAlpha = a * 0.32;
  ctx.save(); ctx.translate(clamp(ship.x + tutGhost, MARG, PW - MARG), ship.y); drawShipBody(tutGhost / 66 * 0.3, 0); ctx.restore();
  if (side) chevrons(ship.x + side * 40, ship.y, side, a);
  // ripples at fingertip
  if (press) {
    for (var r = 0; r < 2; r++) {
      var rk = ((pt + r * 0.45) % 0.9) / 0.9;
      ctx.globalAlpha = a * (1 - rk) * 0.9; ctx.strokeStyle = '#7ff6ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(hx, hy + 4, 8 + rk * 30, 0, TAU); ctx.stroke();
    }
  }
  ctx.globalAlpha = a;
  drawHand(hx + 3, hy + (press ? 6 : 0), press ? 0.9 : 1);
  // title
  var ty = H * 0.29, bob = Math.sin(nowS * 3) * 2;
  ctx.globalAlpha = a * 0.55; ctx.fillStyle = 'rgba(5,6,26,0.85)'; ctx.beginPath(); rrect(ctx, 22, ty - 40, PW - 44, 116, 20); ctx.fill();
  ctx.globalAlpha = a;
  txt('HOLD LEFT / RIGHT', PW / 2, ty - 10 + bob, 27, '#ffffff', 'center', '#10153f', 7);
  txt('TO DODGE', PW / 2, ty + 22 + bob, 27, '#7ff6ff', 'center', '#10153f', 7);
  // legend
  var ly = ty + 56;
  ctx.drawImage(SPR.star, PW / 2 - 132, ly - 11, 22, 22);
  txt('CATCH STARS', PW / 2 - 106, ly, 13, '#ffe066', 'left', '#10153f', 3);
  var rs = 20; ctx.drawImage(SPR.rocks[1], PW / 2 + 12, ly - rs / 2, rs, rs);
  txt('AVOID COMETS', PW / 2 + 36, ly, 13, '#ff9a7a', 'left', '#10153f', 3);
  ctx.globalAlpha = 1;
}
function drawWarnEdges() {
  var w = 0;
  if (warnT > 0) w = 0.5 + 0.5 * Math.sin(nowS * 18);
  else if (showerFx > 0.05) w = showerFx * (0.35 + 0.25 * Math.sin(nowS * 6));
  if (w <= 0.01) return;
  ctx.globalAlpha = w; ctx.fillStyle = edgeL; ctx.fillRect(0, 0, 70, H); ctx.fillStyle = edgeR; ctx.fillRect(PW - 70, 0, 70, H); ctx.globalAlpha = 1;
}
function render() {
  var k = dpr * S;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBackground();
  var sh = trauma * trauma, sx = (Math.random() * 2 - 1) * 12 * sh, sy = (Math.random() * 2 - 1) * 12 * sh;
  ctx.setTransform(k, 0, 0, k, (X0 + sx) * k, sy * k);
  drawStars();
  drawPartsNormal();
  drawComets();
  drawPartsAdd();
  drawShip();
  drawFloats();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (X0 > 1) { ctx.fillStyle = 'rgba(2,3,12,0.72)'; ctx.fillRect(0, 0, X0, H); ctx.fillRect(X0 + PW, 0, X0 + 1, H); ctx.fillStyle = 'rgba(127,246,255,0.25)'; ctx.fillRect(X0 - 1, 0, 1, H); ctx.fillRect(X0 + PW, 0, 1, H); }
  ctx.fillStyle = vigGrad; ctx.fillRect(0, 0, W, H);
  if (flashR > 0) { ctx.globalAlpha = flashR; ctx.fillStyle = '#ff1a3a'; ctx.fillRect(0, 0, W, H); }
  if (flashW > 0) { ctx.globalAlpha = flashW; ctx.fillStyle = '#fff4e0'; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = 1;
  ctx.setTransform(k, 0, 0, k, X0 * k, 0);
  drawWarnEdges();
  if (hudA > 0.01) { ctx.globalAlpha = hudA; drawHUD(); ctx.globalAlpha = 1; }
  drawBanner();
  drawTutorial();
}

// ------------------------------------------------------------------ loop
var lastTs = 0, frameDt = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  var rdt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!(rdt > 0)) rdt = 0;
  if (rdt > 0.05) rdt = 0.05;
  nowS += rdt; frameDt = rdt;
  update(rdt);
  render();
}

if (DEBUG) {
  window.__cometDodge = {
    snapshot: function () {
      return { state: state, phase: phase, runT: runT, playT: playT, lives: lives, score: score, combo: combo, dist: dist, shipX: ship.x, shipY: ship.y, PW: PW, H: H,
        shield: ship.shield, comets: comets.length, stars: stars.length, orbs: orbs.length, gameOvers: gameOvers, stats: JSON.parse(JSON.stringify(stats)),
        audio: AC ? AC.state : 'none', reason: endEl.getAttribute('data-reason') || '',
        list: comets.map(function (c) { return { x: c.x, y: c.y, vx: c.dvx, vy: c.vy, r: c.hr }; }), starList: stars.map(function (q) { return { x: q.x, y: q.y, vy: q.vy }; }),
        orbList: orbs.map(function (o) { return { x: o.x, y: o.y }; }) };
    }
  };
}

resize();
requestAnimationFrame(frame);
})();
</script>
