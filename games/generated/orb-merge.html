<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140c3a">
<link rel="icon" href="data:,">
<title>Orb Merge</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#140c3a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#bombBtn{position:fixed;left:0;top:0;width:64px;height:64px;transform-origin:0 0;border:0;border-radius:50%;padding:0;cursor:pointer;display:none;z-index:5;background:radial-gradient(circle at 38% 32%,#6b6f86,#24263a 60%,#0d0e18);box-shadow:0 0 0 3px #ffd23f,0 6px 0 #8a5a00,0 10px 22px rgba(0,0,0,.45);touch-action:manipulation}
#bombBtn.show{display:block;animation:bIn .5s cubic-bezier(.3,1.6,.5,1) both}
#bombBtn.ready{animation:bIn .5s cubic-bezier(.3,1.6,.5,1) both,bPulse 1s ease-in-out .5s infinite}
#bombBtn.armed{box-shadow:0 0 0 4px #ff4d4d,0 0 22px #ff4d4d,0 6px 0 #8a1a1a}
#bombBtn.empty{filter:grayscale(1) brightness(.7)}
@keyframes bIn{from{transform:var(--bt) scale(0)}to{transform:var(--bt) scale(1)}}
@keyframes bPulse{50%{box-shadow:0 0 0 5px #ffd23f,0 0 24px #ffd23f,0 6px 0 #8a5a00}}
#bombBtn svg{position:absolute;left:8px;top:6px;width:48px;height:48px;pointer-events:none}
#bombBtn b{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;border-radius:11px;background:#ff4d6d;border:2px solid #fff;font-size:13px;font-weight:900;line-height:19px;color:#fff;pointer-events:none}
#bombBtn i{position:absolute;left:50%;top:100%;margin-top:6px;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:900;letter-spacing:1px;color:#ffd23f;white-space:nowrap;text-shadow:0 2px 0 #000;pointer-events:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10}
.ov.show{display:flex;animation:fade .35s both}
@keyframes fade{from{opacity:0}}
@keyframes popIn{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
#retry{background:rgba(12,6,36,.78)}
#retry h2{margin:0;font-size:clamp(34px,10vw,46px);font-weight:900;color:#ff6b8a;text-shadow:0 4px 0 #6a0f2a,0 10px 24px rgba(0,0,0,.5);animation:popIn .5s both}
#retry p{margin:8px 0 24px;font-size:16px;font-weight:700;opacity:.9}
.halo{position:relative;display:inline-block;border-radius:999px;animation:popIn .6s .15s both}
.halo::before{content:"";position:absolute;inset:-9px;border-radius:999px;border:4px solid rgba(255,255,255,.75);animation:ring 1.4s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.17);opacity:0}}
.big{position:relative;overflow:hidden;border:0;border-radius:999px;padding:18px 46px;font:inherit;font-size:24px;font-weight:900;letter-spacing:1px;color:#2a0a40;background:linear-gradient(180deg,#ffe36b,#ffaa1f);box-shadow:0 7px 0 #b06a00,0 14px 26px rgba(0,0,0,.4);cursor:pointer;touch-action:manipulation}
.big span{display:inline-block;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.big::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 2.2s ease-in-out infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.big:active{transform:translateY(4px);box-shadow:0 3px 0 #b06a00}
#end{background:radial-gradient(ellipse at 50% 32%,#3d2a9c 0%,#1b1060 55%,#0a0626 100%);overflow:hidden}
#end .rays{position:absolute;left:50%;top:30%;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:repeating-conic-gradient(rgba(255,255,255,.06) 0 9deg,transparent 9deg 18deg);animation:spin 28s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#end .orbs{position:relative;width:220px;height:140px;animation:popIn .6s both}
#end .orbs span{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#end h1{position:relative;margin:6px 0 0;font-size:clamp(46px,14vw,62px);line-height:.92;font-weight:900;color:#fff;text-shadow:0 4px 0 #ff5c8d,0 8px 0 #7a1e5a,0 14px 26px rgba(0,0,0,.5);animation:popIn .6s .1s both}
#end .tag{position:relative;margin:16px 24px 4px;font-size:17px;font-weight:800;animation:popIn .6s .2s both}
#end .sc{position:relative;margin:2px 0 26px;font-size:15px;opacity:.85;animation:popIn .6s .25s both}
#end .big{font-size:28px;padding:20px 56px}
</style>
</head>
<body>
<canvas id="c" aria-label="Orb Merge game area"></canvas>
<button id="bombBtn" aria-label="Bomb power-up: tap to load a bomb, then drop it"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="22" cy="28" r="15" fill="#1d1f2e" stroke="#000" stroke-width="2"/><circle cx="17" cy="23" r="4" fill="#5a5e78"/><rect x="26" y="9" width="8" height="8" rx="2" fill="#9aa0b4" transform="rotate(35 30 13)"/><path d="M33 9 q4 -6 9 -4" stroke="#c98652" stroke-width="2.5" fill="none"/><path d="M42 2 l2 3 l3 1 l-3 1 l-2 3 l-1 -3 l-3 -1 l3 -1z" fill="#ffd23f"/></svg><b id="bombN">1</b><i>BOMB</i></button>

<div id="retry" class="ov" role="dialog" aria-label="Box full">
  <h2>BOX FULL!</h2>
  <p>Merge faster to keep the orbs below the line.</p>
  <div class="halo"><button class="big" id="retryBtn" aria-label="Try again"><span>TRY AGAIN</span></button></div>
</div>

<div id="end" class="ov" role="dialog" aria-label="Orb Merge - play now">
  <div class="rays"></div>
  <div class="orbs" aria-hidden="true">
    <span style="left:6px;top:58px;width:64px;height:64px;font-size:22px;background:radial-gradient(circle at 35% 30%,#fff 0,#fff3b0 18%,#ffc928 70%,#a87300 100%);animation-delay:-.4s">8</span>
    <span style="left:62px;top:4px;width:100px;height:100px;font-size:32px;background:radial-gradient(circle at 35% 30%,#fff 0,#c4fff4 18%,#1fd6b8 70%,#0b7a68 100%)">128</span>
    <span style="left:150px;top:52px;width:70px;height:70px;font-size:24px;background:radial-gradient(circle at 35% 30%,#fff 0,#ffc2d6 18%,#ff4f8b 70%,#9c1446 100%);animation-delay:-1.1s">32</span>
  </div>
  <h1>ORB<br>MERGE</h1>
  <p class="tag">Drop, match &amp; merge to the max!</p>
  <p class="sc">Score: <b id="endScore">0</b> &middot; Best orb: <b id="endBest">0</b></p>
  <div class="halo"><button class="big" id="cta" aria-label="Play now"><span>PLAY NOW</span></button></div>
</div>

<script>
'use strict';
(function () {
const QS = new URLSearchParams(location.search);
const TS = QS.has('fast') ? 0.3 : 1;     // ?fast shortens the session for testing
const SESSION_MS = 50000 * TS;
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

// ================= Audio =================
const AU = (function () {
  let ctx = null, sfx, mus, noiseBuf, nextT = 0, stepI = 0;
  const STEP = 60 / 96 / 2;
  const MEL = [72, 76, 79, 83, 81, 79, 76, 74, 72, 76, 79, 84, 83, 79, 76, 79, 69, 72, 76, 79, 77, 76, 72, 71, 67, 71, 74, 79, 77, 74, 71, 74];
  const PAD = [[48, 55, 64], [45, 52, 60], [41, 48, 57], [43, 50, 59]];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function unlock() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (navigator.userActivation && !navigator.userActivation.isActive) return;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
        const master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
        sfx = ctx.createGain(); sfx.gain.value = 0.5; sfx.connect(master);
        mus = ctx.createGain(); mus.gain.value = 0.0001; mus.connect(master);
        mus.gain.setTargetAtTime(0.06, ctx.currentTime + 0.1, 1);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate | 0, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        nextT = ctx.currentTime + 0.15;
        setInterval(schedule, 60);
      }
      if (ctx.state === 'suspended') ctx.resume().catch(function () {});
    } catch (e) {}
  }
  function schedule() {
    if (!ctx || ctx.state !== 'running') return;
    while (nextT < ctx.currentTime + 0.25) {
      const i = stepI % 32;
      note(mtof(MEL[i]), nextT, STEP * 1.2, 'triangle', 0.35);
      if (i % 8 === 0) PAD[(i / 8) | 0].forEach(function (m) { note(mtof(m), nextT, STEP * 8, 'sine', 0.22); });
      nextT += STEP; stepI++;
    }
  }
  function note(f, t, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (dur > 1 ? 0.3 : 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(mus); o.start(t); o.stop(t + dur + 0.05);
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, type, f0, f1, delay) {
    if (!ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime + (delay || 0);
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = type || 'lowpass'; fl.frequency.setValueAtTime(f0 || 1000, t);
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(sfx); s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.05);
  }
  document.addEventListener('visibilitychange', function () { if (ctx) (document.hidden ? ctx.suspend() : ctx.resume()).catch(function () {}); });
  return {
    unlock: unlock,
    drop() { tone(520, 260, 0.12, 'sine', 0.25); },
    thud(k) { tone(160, 70, 0.08, 'sine', 0.2 * k); },
    merge(lvl, combo) { const f = 330 * Math.pow(2, (lvl * 2 + Math.min(combo, 6)) / 12); tone(f, f * 2, 0.12, 'sine', 0.35); tone(f * 1.5, f * 3, 0.16, 'triangle', 0.15, 0.04); noise(0.08, 0.15, 'bandpass', 3000); },
    combo(n) { for (let i = 0; i < Math.min(n, 5); i++) tone(660 * Math.pow(2, (i * 4) / 12), 0, 0.1, 'square', 0.08, i * 0.06); },
    fuse() { noise(0.25, 0.2, 'highpass', 4000); },
    boom() { noise(0.9, 0.9, 'lowpass', 2500, 60); tone(130, 30, 0.7, 'sine', 0.7); },
    unlockFx() { [0, 4, 7, 12, 16, 19].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0, 0.16, 'square', 0.11, i * 0.07)); },
    warn() { tone(880, 0, 0.08, 'square', 0.1); },
    win() { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0, 0.24, 'triangle', 0.22, i * 0.08)); },
    fail() { [7, 3, 0, -5].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 0, 0.3, 'triangle', 0.2, i * 0.16)); },
    click() { tone(900, 1300, 0.06, 'square', 0.1); }
  };
})();
['pointerdown', 'pointerup', 'touchend', 'click'].forEach(function (ev) { window.addEventListener(ev, AU.unlock, true); });

// ================= Canvas / scaling =================
const cvs = $('c'), g = cvs.getContext('2d');
let VW = 360, VH = 640, DPR = 1, S = 1, OX = 0, OY = 0;
const bombBtn = $('bombBtn');
function resize() {
  VW = Math.max(1, window.innerWidth || 360); VH = Math.max(1, window.innerHeight || 640);
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cvs.width = Math.round(VW * DPR); cvs.height = Math.round(VH * DPR);
  S = Math.min(VW / 360, VH / 640);
  OX = (VW / S - 360) / 2; OY = (VH / S - 640) / 2;
  // bomb button lives in design coords (288, 70) - scaled with the scene
  const bt = 'translate(' + ((288 + OX) * S) + 'px,' + ((64 + OY) * S) + 'px) scale(' + S + ')';
  bombBtn.style.setProperty('--bt', bt);
  bombBtn.style.transform = bt;
}
window.addEventListener('resize', resize);
resize();
function toWorld(cx, cy) { return { x: cx / S - OX, y: cy / S - OY }; }

// ================= Orb definitions =================
const VALUES = [2, 4, 8, 16, 32, 64, 128, 256, 512];
const COLS = [
  ['#c7f2ff', '#4fc3f7', '#1b6f9e'], ['#d9ffc9', '#6ad85a', '#2a7a24'], ['#fff3b0', '#ffc928', '#a87300'], ['#ffd9b3', '#ff8a2b', '#a84a00'],
  ['#ffc2d6', '#ff4f8b', '#9c1446'], ['#e3d4ff', '#9b6bff', '#4b23a8'], ['#c4fff4', '#1fd6b8', '#0b7a68'], ['#ffc9c9', '#ff3b3b', '#8a0f0f'], ['#ffffff', '#ffd23f', '#b07a00']
];
const radiusOf = (lvl) => 14 + lvl * 5.4;
const BOX = { l: 22, r: 338, t: 160, b: 612 };
const DANGER_Y = 198, DROP_Y = 124;
const GOAL_LVL = 6; // 128

// ================= State =================
let orbs = [], parts = [], floats = [], rings = [];
let score = 0, shownScore = 0, best = 0, combo = 0, comboT = 0;
let cur = 0, nxt = 1, aimX = 180, aiming = false, cooldown = 0, curPop = 1;
let state = 'play', retryUsed = false, ended = false, dangerT = 0, warnT = 0;
let bombs = 0, bombUnlocked = false, bombArmed = false, firstBig = false, poolBig = false, fastDrops = false;
let shake = 0, flashA = 0, banner = null, time = 0, lastInput = 0, drops = 0, hintStage = 0, mergeHintT = 0;
const startTs = performance.now();
let acc = 0, oid = 1;
const H_STEP = 1 / 240, GRAV = 1500;

function makeOrb(lvl, x, y, bomb) {
  const r = bomb ? 19 : radiusOf(lvl);
  const o = { id: oid++, lvl: lvl, x: x, y: y, px: x, py: y, r: r, tr: r, age: 0, sq: 0, bomb: !!bomb, fuse: -1, touched: false, rot: rand(-0.3, 0.3), dead: false, blink: 0 };
  orbs.push(o); return o;
}
function seed() {
  orbs = [];
  // no two equal orbs touch at the start; the first drop (a 2) can merge with the 2
  const row = [2, 0, 3, 1, 2];
  let x = BOX.l + 6;
  row.forEach(function (lvl) { const r = radiusOf(lvl); x += r; makeOrb(lvl, Math.min(x, BOX.r - r), BOX.b - r); x += r + 10; });
}
const STRESS = QS.has('stress'); // ?stress: big orbs, merging off, so the box overflows (testing aid for the fail state)
function randLvl() {
  const r = Math.random();
  if (STRESS) return 2 + ((Math.random() * 4) | 0);
  if (poolBig) return r < 0.32 ? 0 : r < 0.6 ? 1 : r < 0.85 ? 2 : 3;
  return r < 0.42 ? 0 : r < 0.75 ? 1 : 2;
}
seed();
cur = 0; nxt = 1;

// ================= FX =================
function burst(x, y, n, colors, spd, o) {
  o = o || {};
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = spd * rand(0.3, 1);
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 0), t: 0, life: (o.life || 0.7) * rand(0.6, 1.1), size: (o.size || 4) * rand(0.6, 1.4), c: pick(colors), g: o.g !== undefined ? o.g : 500, shape: o.shape || 'circ', rot: rand(0, 6), vr: rand(-10, 10) });
  }
}
function floatText(x, y, text, color, size) { floats.push({ x: x, y: y, text: text, color: color || '#fff', size: size || 20, t: 0, life: 1 }); }
function showBanner(text, sub, color, dur) { banner = { text: text, sub: sub || '', color: color || '#ffe36b', t: 0, life: dur || 1.6 }; }

// ================= Input =================
cvs.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  lastInput = performance.now();
  if (state !== 'play') return;
  aiming = true;
  aimX = toWorld(e.clientX, e.clientY).x;
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
});
cvs.addEventListener('pointermove', function (e) {
  if (!aiming) return;
  e.preventDefault();
  aimX = toWorld(e.clientX, e.clientY).x; lastInput = performance.now();
});
cvs.addEventListener('pointerup', function (e) {
  if (!aiming) return;
  aiming = false;
  aimX = toWorld(e.clientX, e.clientY).x;
  dropNow();
});
cvs.addEventListener('pointercancel', function () { aiming = false; });
cvs.addEventListener('contextmenu', function (e) { e.preventDefault(); });
bombBtn.addEventListener('click', function () {
  lastInput = performance.now();
  if (state !== 'play' || bombs <= 0) return;
  AU.click();
  bombArmed = !bombArmed;
  curPop = 0;
  updateBombBtn();
  if (bombArmed && hintStage < 3) hintStage = 3;
});
function updateBombBtn() {
  $('bombN').textContent = String(bombs);
  bombBtn.classList.toggle('armed', bombArmed);
  bombBtn.classList.toggle('empty', bombs <= 0);
  bombBtn.classList.toggle('ready', bombs > 0 && !bombArmed);
  bombBtn.setAttribute('aria-label', bombs > 0 ? (bombArmed ? 'Bomb loaded: drop it into the box (tap again to cancel)' : 'Bomb power-up, ' + bombs + ' left: tap to load a bomb') : 'Bomb power-up, none left');
}
function dropNow() {
  if (state !== 'play' || cooldown > 0) return;
  const r = bombArmed ? 19 : radiusOf(cur);
  const x = clamp(aimX, BOX.l + r + 1, BOX.r - r - 1);
  if (bombArmed) {
    const b = makeOrb(0, x, DROP_Y, true);
    b.age = 0; bombArmed = false; bombs--; updateBombBtn();
    AU.fuse();
  } else {
    makeOrb(cur, x, DROP_Y);
    cur = nxt; nxt = randLvl();
  }
  AU.drop();
  drops++;
  cooldown = fastDrops ? 0.34 : 0.48; curPop = 0;
  if (hintStage === 0) { hintStage = 1; mergeHintT = 2.6; }
}

// ================= Physics =================
function physStep(h) {
  const n = orbs.length;
  for (let i = 0; i < n; i++) {
    const o = orbs[i];
    const vx = (o.x - o.px) * 0.9985, vy = (o.y - o.py) * 0.9995;
    o.px = o.x; o.py = o.y;
    o.x += vx; o.y += vy + GRAV * h * h;
    if (o.r < o.tr) o.r = Math.min(o.tr, o.r + h * 260);
  }
  for (let it = 0; it < 3; it++) {
    for (let i = 0; i < n; i++) {
      const a = orbs[i];
      for (let j = i + 1; j < n; j++) {
        const b = orbs[j];
        const dx = b.x - a.x, dy = b.y - a.y, R = a.r + b.r;
        if (dx > R || dx < -R || dy > R || dy < -R) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 >= R * R || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), ov = (R - d), nx = dx / d, ny = dy / d;
        const ma = a.r * a.r, mb = b.r * b.r, k = ov / (ma + mb);
        a.x -= nx * k * mb; a.y -= ny * k * mb; b.x += nx * k * ma; b.y += ny * k * ma;
        if (a.bomb) a.touched = true; if (b.bomb) b.touched = true;
        // impact squash
        if (it === 0 && ov > 1.2) { a.sq = Math.max(a.sq, Math.min(0.12, ov * 0.02)); b.sq = Math.max(b.sq, Math.min(0.12, ov * 0.02)); }
      }
    }
    for (let i = 0; i < n; i++) {
      const o = orbs[i];
      if (o.x - o.r < BOX.l) { o.x = BOX.l + o.r; }
      if (o.x + o.r > BOX.r) { o.x = BOX.r - o.r; }
      if (o.y + o.r > BOX.b) {
        const impact = (o.y - o.py);

    const bx = 288 + 32, by = 64 + 32;
    const k = Math.sin(time * 6) * 6;
    drawHand(bx - 26 + k * 0.3, by + 20 + k, 0);
    pill('Tap the BOMB, then drop it!', 262, '#ffd23f');
  } else if (idle > 6000) {
    pill('Drop orbs onto matching numbers!', 262, '#7ef9ff');
  }
}
function drawParticles() {
  for (const p of parts) {
    const k = 1 - p.t / p.life;
    g.globalAlpha = Math.min(1, k * 1.6); g.fillStyle = p.c;
    if (p.shape === 'star') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); star(0, 0, p.size, p.size * 0.45); g.fill(); g.restore(); }
    else if (p.shape === 'smoke') { g.globalAlpha = k * 0.5; g.beginPath(); g.arc(p.x, p.y, p.size * (1.6 - k * 0.6), 0, 7); g.fill(); }
    else if (p.shape === 'spark') { g.strokeStyle = p.c; g.lineWidth = p.size; g.lineCap = 'round'; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); g.stroke(); }
    else { g.beginPath(); g.arc(p.x, p.y, p.size * (0.4 + 0.6 * k), 0, 7); g.fill(); }
  }
  g.globalAlpha = 1;
  for (const rg of rings) {
    const k = rg.t / rg.life;
    g.globalAlpha = 1 - k; g.strokeStyle = rg.c; g.lineWidth = 5 * (1 - k) + 1;
    g.beginPath(); g.arc(rg.x, rg.y, rg.r0 + (rg.r1 - rg.r0) * easeOutCubic(k), 0, 7); g.stroke();
  }
  g.globalAlpha = 1;
}
function drawFloats() {
  for (const f of floats) {
    const k = f.t / f.life, sc = k < 0.18 ? easeOutBack(k / 0.18) : 1;
    g.save(); g.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    g.translate(f.x, f.y - 40 * easeOutCubic(k)); g.scale(sc, sc);
    text(f.text, 0, 0, f.size, f.color, 'center', 'rgba(20,6,50,.9)');
    g.restore();
  }
}
function drawBanner() {
  if (!banner) return;
  const t = banner.t, L = banner.life;
  const inK = clamp(t / 0.32, 0, 1), outK = clamp((L - t) / 0.3, 0, 1);
  const sc = easeOutBack(inK) * (0.6 + 0.4 * outK);
  g.save(); g.globalAlpha = outK; g.translate(180, 380); g.scale(sc, sc);
  g.fillStyle = 'rgba(10,4,30,.6)'; rr(-150, -42, 300, banner.sub ? 88 : 66, 22); g.fill();
  g.font = '900 36px ' + FONT;
  const bw = g.measureText(banner.text).width;
  text(banner.text, 0, -8, bw > 270 ? 36 * 270 / bw : 36, banner.color, 'center', '#2a0a50');
  if (banner.sub) text(banner.sub, 0, 28, 15, '#fff', 'center', false, 700);
  g.restore();
}
function render() {
  g.setTransform(DPR * S, 0, 0, DPR * S, DPR * S * OX, DPR * S * OY);
  drawBackground();
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  g.save(); g.translate(sx, sy);
  drawBox();
  for (const o of orbs) drawOrb(o.x, o.y, o.r, o.lvl, o.sq, 1, o.bomb, o.blink);
  drawBoxFront();
  drawDropper();
  drawParticles();
  drawFloats();
  g.restore();
  drawHUD();
  drawHints();
  drawBanner();
  if (flashA > 0) { g.fillStyle = 'rgba(255,245,220,' + flashA + ')'; g.fillRect(-OX - 2, -OY - 2, 364 + OX * 2, 644 + OY * 2); }
}

// ================= Loop =================
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  try { update(dt); render(); } catch (err) { if (!frame.w) { frame.w = true; setTimeout(function () { throw err; }); } }
}
document.body.setAttribute('data-state', 'play');
requestAnimationFrame(frame);
})();
</script>
