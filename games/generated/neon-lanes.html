<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14062e">
<link rel="icon" href="data:,">
<title>Neon Lanes</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#14062e;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#hud{pointer-events:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10}
.ov.show{display:flex;animation:fade .35s both}
@keyframes fade{from{opacity:0}}
@keyframes popIn{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
#revive{background:radial-gradient(ellipse at 50% 45%,rgba(60,10,70,.6),rgba(8,2,20,.88))}
#revive h2{margin:0;font-size:clamp(36px,11vw,50px);font-weight:900;letter-spacing:2px;color:#ff4fd8;text-shadow:0 0 18px #ff4fd8,0 0 40px rgba(255,79,216,.6);animation:popIn .5s both}
#revive p{margin:8px 0 22px;font-size:16px;font-weight:700;opacity:.9}
.ring{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;animation:popIn .5s .1s both}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
#ringBar{stroke:#36f1ff;stroke-linecap:round;filter:drop-shadow(0 0 6px #36f1ff)}
#reviveBtn{position:relative;width:150px;height:150px;border-radius:50%;border:0;font:inherit;font-size:24px;font-weight:900;letter-spacing:1px;color:#120326;background:radial-gradient(circle at 40% 35%,#b9fbff,#36f1ff 55%,#14a9c9);box-shadow:0 0 30px rgba(54,241,255,.7),inset 0 -6px 0 rgba(0,0,0,.2);cursor:pointer;touch-action:manipulation}
#reviveBtn small{display:block;font-size:13px;font-weight:800;opacity:.8;margin-top:2px}
#reviveBtn:active{transform:translateY(3px)}
#noBtn{margin-top:22px;background:none;border:0;color:rgba(255,255,255,.7);font:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer;padding:10px 18px}
#end{background:radial-gradient(ellipse at 50% 30%,#4a1a8a 0%,#1d0745 55%,#0b0220 100%);overflow:hidden}
#end .grid{position:absolute;left:-50%;right:-50%;bottom:-10%;height:55%;background:linear-gradient(transparent 0 92%,rgba(255,79,216,.8) 92%) 0 0/100% 40px,linear-gradient(90deg,transparent 0 96%,rgba(54,241,255,.6) 96%) 0 0/50px 100%;transform:perspective(300px) rotateX(60deg);transform-origin:50% 0;animation:gridMove 1s linear infinite;opacity:.55;pointer-events:none}
@keyframes gridMove{to{background-position:0 40px,0 0}}
#end .sun{position:absolute;left:50%;top:14%;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:linear-gradient(#ffe36b,#ff4fd8);box-shadow:0 0 60px rgba(255,79,216,.6);-webkit-mask:linear-gradient(#000 0 55%,transparent 55% 60%,#000 60% 68%,transparent 68% 72%,#000 72% 80%,transparent 80% 84%,#000 84%);mask:linear-gradient(#000 0 55%,transparent 55% 60%,#000 60% 68%,transparent 68% 72%,#000 72% 80%,transparent 80% 84%,#000 84%);opacity:.9;pointer-events:none}
#end h1{position:relative;margin:120px 0 0;font-size:clamp(46px,14vw,64px);line-height:.92;font-weight:900;font-style:italic;letter-spacing:2px;color:#fff;text-shadow:0 0 10px #36f1ff,0 0 26px #36f1ff,4px 4px 0 #ff4fd8;animation:popIn .6s .1s both}
#end .tag{position:relative;margin:18px 24px 4px;font-size:17px;font-weight:800;animation:popIn .6s .2s both}
#end .sc{position:relative;margin:2px 0 26px;font-size:15px;opacity:.85;animation:popIn .6s .25s both}
.halo{position:relative;display:inline-block;border-radius:999px;animation:popIn .6s .3s both}
.halo::before{content:"";position:absolute;inset:-9px;border-radius:999px;border:3px solid rgba(54,241,255,.9);box-shadow:0 0 14px rgba(54,241,255,.8);animation:pr 1.4s ease-out infinite;pointer-events:none}
@keyframes pr{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
#cta{position:relative;overflow:hidden;border:0;border-radius:999px;padding:20px 56px;font:inherit;font-size:28px;font-weight:900;letter-spacing:2px;color:#1a0433;background:linear-gradient(180deg,#9cfbff,#36f1ff 50%,#12b6d6);box-shadow:0 7px 0 #0a7d96,0 0 30px rgba(54,241,255,.6);cursor:pointer;touch-action:manipulation}
#cta span{display:inline-block;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
#cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 2.2s ease-in-out infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
#cta:active{transform:translateY(4px);box-shadow:0 3px 0 #0a7d96}
</style>
</head>
<body>
<canvas id="gl" aria-label="Neon Lanes game area"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>

<div id="revive" class="ov" role="dialog" aria-label="Crashed - revive?">
  <h2>CRASHED!</h2>
  <p>Keep your run going?</p>
  <div class="ring">
    <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" stroke="rgba(255,255,255,.15)"/><circle id="ringBar" cx="100" cy="100" r="92" stroke-dasharray="578" stroke-dashoffset="0"/></svg>
    <button id="reviveBtn" aria-label="Revive and continue">REVIVE<small>1 free</small></button>
  </div>
  <button id="noBtn" aria-label="No thanks, end run">No thanks</button>
</div>

<div id="end" class="ov" role="dialog" aria-label="Neon Lanes - play now">
  <div class="sun"></div><div class="grid"></div>
  <h1>NEON<br>LANES</h1>
  <p class="tag">Dash, dodge &amp; grab every coin!</p>
  <p class="sc">Coins collected: <b id="endScore">0</b></p>
  <div class="halo"><button id="cta" aria-label="Play now"><span>PLAY NOW</span></button></div>
</div>

<script>
'use strict';
(function () {
const QS = new URLSearchParams(location.search);
const TS = QS.has('fast') ? 0.3 : 1;            // ?fast compresses the timeline for testing
const SESSION_MS = 50000 * TS;
const GOD = QS.has('god');                      // ?god: invulnerable player (testing aid)
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

// ================= Audio =================
const AU = (function () {
  let ctx = null, sfx, mus, noiseBuf, nextT = 0, stepI = 0;
  const STEP = 60 / 124 / 4; // 16th notes
  const ARP = [57, 64, 69, 72, 57, 64, 69, 72, 53, 60, 65, 69, 53, 60, 65, 69, 55, 62, 67, 71, 55, 62, 67, 71, 52, 59, 64, 67, 52, 59, 64, 68];
  const BAS = [33, 33, 29, 29, 31, 31, 28, 28];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function unlock() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (navigator.userActivation && !navigator.userActivation.isActive) return;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
        const master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
        sfx = ctx.createGain(); sfx.gain.value = 0.5; sfx.connect(master);
        mus = ctx.createGain(); mus.gain.value = 0.0001; mus.connect(master);
        mus.gain.setTargetAtTime(0.055, ctx.currentTime + 0.1, 0.8);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate | 0, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        nextT = ctx.currentTime + 0.15;
        setInterval(schedule, 50);
      }
      if (ctx.state === 'suspended') ctx.resume().catch(function () {});
    } catch (e) {}
  }
  function schedule() {
    if (!ctx || ctx.state !== 'running') return;
    while (nextT < ctx.currentTime + 0.2) {
      const i = stepI % 64;
      note(mtof(ARP[i % 32] + 12), nextT, STEP * 0.9, 'sawtooth', 0.12, 2200);
      if (i % 8 === 0) note(mtof(BAS[(i / 8) | 0]), nextT, STEP * 7, 'square', 0.35, 600);
      if (i % 4 === 0) kick(nextT);
      if (i % 4 === 2) hat(nextT);
      nextT += STEP; stepI++;
    }
  }
  function note(f, t, dur, type, vol, cut) {
    const o = ctx.createOscillator(), g = ctx.createGain(), fl = ctx.createBiquadFilter();
    o.type = type; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = cut;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(fl); fl.connect(g); g.connect(mus); o.start(t); o.stop(t + dur + 0.05);
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(mus); o.start(t); o.stop(t + 0.2);
  }
  function hat(t) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    s.connect(f); f.connect(g); g.connect(mus); s.start(t, Math.random() * 0.5); s.stop(t + 0.05);
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, type, f0, f1, delay) {
    if (!ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime + (delay || 0);
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = type || 'lowpass'; fl.frequency.setValueAtTime(f0 || 1000, t);
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(sfx); s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.05);
  }
  document.addEventListener('visibilitychange', function () { if (ctx) (document.hidden ? ctx.suspend() : ctx.resume()).catch(function () {}); });
  let coinI = 0, coinT = 0;
  return {
    unlock: unlock,
    swoosh() { noise(0.16, 0.25, 'bandpass', 900, 3000); },
    jump() { tone(300, 700, 0.18, 'square', 0.12); noise(0.12, 0.12, 'highpass', 2000); },
    land() { tone(140, 60, 0.1, 'sine', 0.25); },
    coin() {
      const now = performance.now(); coinI = now - coinT < 400 ? Math.min(coinI + 1, 12) : 0; coinT = now;
      const f = 988 * Math.pow(2, coinI / 12);
      tone(f, 0, 0.06, 'square', 0.08); tone(f * 1.5, 0, 0.12, 'square', 0.08, 0.05);
    },
    crash() { noise(0.8, 0.9, 'lowpass', 3000, 80); tone(200, 30, 0.6, 'sawtooth', 0.4); tone(90, 25, 0.8, 'sine', 0.6); },
    power() { [0, 4, 7, 12, 16].forEach((s, i) => tone(440 * Math.pow(2, s / 12), 0, 0.14, 'sawtooth', 0.1, i * 0.05)); },
    rush() { tone(200, 1600, 0.7, 'sawtooth', 0.15); noise(0.8, 0.3, 'bandpass', 500, 5000); },
    win() { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0, 0.22, 'square', 0.12, i * 0.08)); },
    click() { tone(900, 1300, 0.06, 'square', 0.1); },
    boom() { noise(0.5, 0.5, 'lowpass', 2000, 100); tone(120, 40, 0.4, 'sine', 0.4); }
  };
})();
['pointerdown', 'pointerup', 'touchend', 'click'].forEach(function (ev) { window.addEventListener(ev, AU.unlock, true); });

// ================= Math =================
function perspective(o, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  o.fill(0); o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf; o[11] = -1; o[14] = 2 * far * near * nf; return o;
}
function lookAt(o, ex, ey, ez, cx, cy, cz) {
  let zx = ex - cx, zy = ey - cy, zz = ez - cz; let l = 1 / Math.hypot(zx, zy, zz); zx *= l; zy *= l; zz *= l;
  let xx = zz, xy = 0, xz = -zx; l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l; // up = (0,1,0)
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0; o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0; o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
  o[12] = -(xx * ex + xy * ey + xz * ez); o[13] = -(yx * ex + yy * ey + yz * ez); o[14] = -(zx * ex + zy * ey + zz * ez); o[15] = 1;
  return o;
}
function mul(o, a, b) {
  for (let i = 0; i < 4; i++) {
    const b0 = b[i * 4], b1 = b[i * 4 + 1], b2 = b[i * 4 + 2], b3 = b[i * 4 + 3];
    o[i * 4] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
    o[i * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
    o[i * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    o[i * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return o;
}
// model = T * Ry * Rx * Rz * S
function model(o, x, y, z, rx, ry, rz, sx, sy, sz) {
  const cxr = Math.cos(rx), sxr = Math.sin(rx), cyr = Math.cos(ry), syr = Math.sin(ry), czr = Math.cos(rz), szr = Math.sin(rz);
  o[0] = (cyr * czr + syr * sxr * szr) * sx; o[1] = (cxr * szr) * sx; o[2] = (-syr * czr + cyr * sxr * szr) * sx; o[3] = 0;
  o[4] = (-cyr * szr + syr * sxr * czr) * sy; o[5] = (cxr * czr) * sy; o[6] = (syr * szr + cyr * sxr * czr) * sy; o[7] = 0;
  o[8] = (syr * cxr) * sz; o[9] = (-sxr) * sz; o[10] = (cyr * cxr) * sz; o[11] = 0;
  o[12] = x; o[13] = y; o[14] = z; o[15] = 1;
  return o;
}

// ================= WebGL setup =================
const cvs = $('gl'), hud = $('hud'), h2 = hud.getContext('2d');
let gl = null, glOK = false;
let VW = 360, VH = 640, DPR = 1, GDPR = 1, RS = 1; // RS = adaptive 3D render scale
const P = {}; // programs
const B = {}; // buffers
function resize() {
  VW = Math.max(1, window.innerWidth || 360); VH = Math.max(1, window.innerHeight || 640);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  GDPR = Math.max(0.5, DPR * RS);
  cvs.width = Math.round(VW * GDPR); cvs.height = Math.round(VH * GDPR);
  hud.width = Math.round(VW * DPR); hud.height = Math.round(VH * DPR);
}
window.addEventListener('resize', resize);
resize();

const VS_LIT = 'attribute vec3 aPos;attribute vec3 aNor;uniform mat4 uVP;uniform mat4 uM;varying vec3 vN;varying vec3 vW;' +
  'void main(){vec4 w=uM*vec4(aPos,1.0);vW=w.xyz;vN=mat3(uM)*aNor;gl_Position=uVP*w;}';
const PREC = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';
const FS_LIT = PREC + 'uniform vec3 uColor;uniform float uEmis;uniform float uAlpha;uniform vec3 uCam;uniform vec3 uFogC;uniform vec2 uFog;varying vec3 vN;varying vec3 vW;' +
  'void main(){vec3 n=normalize(vN);vec3 L=normalize(vec3(-0.35,0.85,0.45));float d=max(dot(n,L),0.0);' +
  'vec3 V=normalize(uCam-vW);float rim=pow(1.0-max(dot(n,V),0.0),2.5);' +
  'vec3 c=uColor*(0.32+0.68*d)+uColor*rim*0.7+vec3(0.25,0.1,0.4)*rim*0.25;c=mix(c,uColor*1.5+0.15,uEmis);' +
  'float dist=length(vW-uCam);float f=clamp((dist-uFog.x)/(uFog.y-uFog.x),0.0,1.0);c=mix(c,uFogC,f);' +
  'gl_FragColor=vec4(c,uAlpha);}';
const VS_FLOOR = 'attribute vec3 aPos;uniform mat4 uVP;varying vec3 vW;void main(){vW=aPos;gl_Position=uVP*vec4(aPos,1.0);}';
const FS_FLOOR = PREC + 'uniform vec3 uCam;uniform vec3 uFogC;uniform vec2 uFog;uniform float uScroll;uniform float uBoost;varying vec3 vW;' +
  'float ld(float c,float p){return abs(fract(c/p+0.5)-0.5)*p;}' +
  'void main(){float dist=length(vW-uCam);float aa=0.02+dist*0.006;float ax=abs(vW.x);float road=1.0-smoothstep(3.3,3.35,ax);' +
  'vec3 col=mix(vec3(0.025,0.01,0.06),vec3(0.07,0.025,0.15),road);' +
  'float z=vW.z+uScroll;float cz=1.0-smoothstep(0.05,0.05+aa,ld(z,4.0));' +
  'float dash=step(0.45,fract(z/3.0));float cl=(1.0-smoothstep(0.035,0.035+aa,abs(ax-1.1)))*road*dash;' +
  'float ex=abs(ax-3.3);float ce=1.0-smoothstep(0.07,0.07+aa*1.5,ex);float glow=exp(-ex*2.5)*0.45;' +
  'float cgx=(1.0-smoothstep(0.05,0.05+aa,ld(vW.x,4.0)))*(1.0-road);' +
  'vec3 mag=vec3(1.0,0.18,0.78);vec3 cy=vec3(0.2,0.92,1.0);' +
  'col+=mag*cz*(0.35+0.4*road)*(1.0+uBoost);col+=cy*(cl*0.55+ce*1.1+glow*0.5);col+=mag*cgx*0.4;' +
  'float f=clamp((dist-uFog.x)/(uFog.y-uFog.x),0.0,1.0);col=mix(col,uFogC,f);gl_FragColor=vec4(col,1.0);}';
const VS_SKY = 'attribute vec2 aPos;varying float vY;void main(){vY=aPos.y;gl_Position=vec4(aPos,0.999,1.0);}';
const FS_SKY = PREC + 'uniform float uHor;uniform vec3 uTop;uniform vec3 uMid;uniform vec3 uFogC;varying float vY;' +
  'void main(){float t=clamp((vY-uHor)/(1.0-uHor),0.0,1.0);vec3 c=mix(uFogC,uMid,smoothstep(0.0,0.35,t));c=mix(c,uTop,smoothstep(0.3,1.0,t));gl_FragColor=vec4(c,1.0);}';
const VS_BB = 'attribute vec2 aPos;uniform mat4 uVP;uniform vec3 uC;uniform vec3 uR;uniform vec3 uU;uniform float uS;varying vec2 vUV;varying vec3 vW;' +
  'void main(){vUV=aPos;vec3 w=uC+(uR*aPos.x+uU*aPos.y)*uS;vW=w;gl_Position=uVP*vec4(w,1.0);}';
const FS_GLOW = PREC + 'uniform vec3 uColor;uniform float uI;uniform vec3 uCam;uniform vec2 uFog;varying vec2 vUV;varying vec3 vW;' +
  'void main(){float d=length(vUV);float a=pow(max(0.0,1.0-d),2.2)*uI;float dist=length(vW-uCam);float f=clamp((dist-uFog.x)/(uFog.y-uFog.x),0.0,1.0);a*=1.0-f;gl_FragColor=vec4(uColor*a,a);}';
const FS_SUN = PREC + 'uniform float uTime;varying vec2 vUV;' +
  'void main(){float r=length(vUV);vec3 top=vec3(1.0,0.92,0.42);vec3 bot=vec3(1.0,0.2,0.62);' +

    txt(String(Math.round(shownCoins)), 46, 32, 21, '#ffe36b', 'left');
    // distance
    h2.fillStyle = 'rgba(20,4,40,.6)'; rr(W / 2 - 52, 12, 104, 38, 19); h2.fill();
    txt(Math.floor(dist) + ' m', W / 2, 32, 18, '#fff', 'center');
    // speed / multiplier
    h2.fillStyle = 'rgba(20,4,40,.6)'; rr(W - 106, 12, 96, 38, 19); h2.fill();
    if (rush > 0) txt('x2 RUSH', W - 58, 32, 15, '#ff9af2', 'center', '#ff4fd8');
    else txt('SPD ' + Math.round(speed * 3.6) , W - 58, 32, 14, '#36f1ff', 'center');
    // progress to finish
    const prog = clamp(sT() / 44500, 0, 1);
    h2.fillStyle = 'rgba(255,255,255,.15)'; rr(14, 58, W - 28, 6, 3); h2.fill();
    const pg = h2.createLinearGradient(14, 0, W - 14, 0); pg.addColorStop(0, '#36f1ff'); pg.addColorStop(1, '#ff4fd8');
    h2.fillStyle = pg; rr(14, 58, (W - 28) * prog, 6, 3); h2.fill();
    // finish flag
    h2.fillStyle = '#fff'; h2.fillRect(W - 16, 52, 2, 16);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { h2.fillStyle = (i + j) % 2 ? '#fff' : '#1a0433'; h2.fillRect(W - 14 + i * 4, 52 + j * 4, 4, 4); }
    // magnet timer
    if (magnet > 0) {
      h2.fillStyle = 'rgba(20,4,40,.65)'; rr(10, 72, 120, 30, 15); h2.fill();
      h2.strokeStyle = '#ff5c5c'; h2.lineWidth = 5; h2.lineCap = 'butt';
      h2.beginPath(); h2.arc(26, 87, 7, Math.PI, 0); h2.stroke();
      h2.fillStyle = '#ddd'; h2.fillRect(17, 86, 5, 4); h2.fillRect(30, 86, 5, 4);
      h2.fillStyle = 'rgba(255,255,255,.2)'; rr(42, 83, 78, 8, 4); h2.fill();
      h2.fillStyle = '#ff5c5c'; rr(42, 83, 78 * clamp(magnet / 8, 0, 1), 8, 4); h2.fill();
    }
  }
  // floating texts
  for (const f of floats) {
    const k = f.t / f.life;
    h2.globalAlpha = k > 0.6 ? (1 - k) / 0.4 : 1;
    txt(f.text, f.x / S, f.y / S - 30 * easeOutCubic(k), f.size, f.color, 'center', f.color);
  }
  h2.globalAlpha = 1;
  // tutorial hints
  if (state === 'play') {
    const idle = performance.now() - lastInput;
    let mode = 0;
    if (tut.obj && !tut.acted && timeScale < 0.6) mode = tut.obj.type === 'low' ? 2 : 1;
    else if (elapsed < 3.2 && tut.obj && tut.obj.tut === 1 && !tut.acted && lastInput === 0) mode = 1;
    else if (idle > 4500 && elapsed > 6 && !banner) mode = 1;
    if (mode) {
      const cyc = (elapsed % 1.1) / 1.1;
      const msg = mode === 1 ? 'Swipe to switch lanes!' : 'Swipe UP to jump!';
      h2.font = '800 18px ' + FONT;
      const tw = h2.measureText(msg).width + 36;
      h2.fillStyle = 'rgba(20,4,40,.75)'; rr(W / 2 - tw / 2, H * 0.36 - 21, tw, 42, 21); h2.fill();
      h2.strokeStyle = mode === 1 ? '#36f1ff' : '#ffe36b'; h2.lineWidth = 2; h2.stroke();
      txt(msg, W / 2, H * 0.36, 18, '#fff', 'center', null, 800);
      const e = easeOutCubic(Math.min(1, cyc / 0.7));
      if (mode === 1) {
        const dir = Math.floor(elapsed / 1.1) % 2 ? 1 : -1;
        const hx = W / 2 - dir * 60 + dir * 120 * e, hy = H * 0.66;
        h2.strokeStyle = 'rgba(54,241,255,.7)'; h2.lineWidth = 5; h2.lineCap = 'round';
        h2.beginPath(); h2.moveTo(W / 2 - dir * 60, hy - 6); h2.lineTo(hx, hy - 6); h2.stroke();
        drawHand(hx, hy, cyc < 0.15 ? cyc / 0.15 : 0);
        // side arrows
        h2.fillStyle = 'rgba(54,241,255,' + (0.4 + 0.4 * Math.sin(elapsed * 8)) + ')';
        h2.beginPath(); h2.moveTo(30, H * 0.55); h2.lineTo(52, H * 0.55 - 16); h2.lineTo(52, H * 0.55 + 16); h2.fill();
        h2.beginPath(); h2.moveTo(W - 30, H * 0.55); h2.lineTo(W - 52, H * 0.55 - 16); h2.lineTo(W - 52, H * 0.55 + 16); h2.fill();
      } else {
        const hy = H * 0.74 - 110 * e;
        h2.strokeStyle = 'rgba(255,227,107,.7)'; h2.lineWidth = 5; h2.lineCap = 'round';
        h2.beginPath(); h2.moveTo(W / 2 + 4, H * 0.74 - 6); h2.lineTo(W / 2 + 4, hy - 6); h2.stroke();
        drawHand(W / 2 + 4, hy, cyc < 0.15 ? cyc / 0.15 : 0);
      }
    }
  }
  // banner
  if (banner) {
    const t = banner.t, L = banner.life;
    const inK = clamp(t / 0.3, 0, 1), outK = clamp((L - t) / 0.3, 0, 1);
    const sc = easeOutBack(inK) * (0.7 + 0.3 * outK);
    h2.save(); h2.globalAlpha = outK; h2.translate(W / 2, H * 0.24); h2.scale(sc, sc);
    txt(banner.text, 0, 0, 40, banner.color, 'center', banner.color);
    if (banner.sub) txt(banner.sub, 0, 36, 17, '#fff', 'center', null, 800);
    h2.restore();
  }
  h2.restore();
  // flashes / vignette
  if (flashR > 0) {
    const vg = h2.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.2, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
    vg.addColorStop(0, 'rgba(255,40,80,0)'); vg.addColorStop(1, 'rgba(255,40,80,' + flashR + ')');
    h2.fillStyle = vg; h2.fillRect(0, 0, VW, VH);
  }
  if (flashW > 0) { h2.fillStyle = 'rgba(255,255,255,' + flashW * 0.6 + ')'; h2.fillRect(0, 0, VW, VH); }
  if (rush > 0 && state === 'play') {
    const vg = h2.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.3, VW / 2, VH / 2, Math.max(VW, VH) * 0.7);
    vg.addColorStop(0, 'rgba(255,79,216,0)'); vg.addColorStop(1, 'rgba(255,79,216,' + (0.25 + 0.1 * Math.sin(elapsed * 10)) + ')');
    h2.fillStyle = vg; h2.fillRect(0, 0, VW, VH);
  }
  if (!glOK) { txt('Loading...', VW / 2, VH / 2, 22, '#fff', 'center'); }
}

// ================= Loop =================
let lastTs = 0, perfN = 0, perfT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  // adaptive render scale: drop 3D resolution if frames are slow
  perfN++; perfT += dt;
  if (perfN >= 40) {
    const avg = perfT / perfN; perfN = 0; perfT = 0;
    if (avg > 0.026 && RS > 0.4) { RS = Math.max(0.4, RS * 0.8); resize(); }
  }
  try {
    if (state !== 'end') { let left = dt; while (left > 1e-4) { const s = Math.min(left, 1 / 50); update(s); left -= s; } }
    render(); drawHUD();
  }
  catch (err) { if (!frame.w) { frame.w = true; setTimeout(function () { throw err; }); } }
}
document.body.setAttribute('data-state', 'play');
requestAnimationFrame(frame);
})();
</script>
