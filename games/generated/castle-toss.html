<!doctype html>
<html lang="en">
<head>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a1650;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;text-align:center;color:#fff}
.ov.show{display:flex;animation:fadeIn .35s ease-out both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#upg{background:radial-gradient(ellipse at 50% 40%,rgba(40,16,80,.72),rgba(10,4,24,.9))}
#upg h2{margin:0 0 6px;font-size:clamp(24px,7.5vw,34px);font-weight:900;letter-spacing:.5px;text-shadow:0 3px 0 #6a2bb8,0 6px 14px rgba(0,0,0,.5);animation:popIn .5s both}
#upg p{margin:0 0 18px;font-size:15px;opacity:.85}
.choices{display:flex;flex-direction:column;gap:14px;width:min(86vw,320px)}
.choice{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-radius:20px;color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.35),0 12px 24px rgba(0,0,0,.35);animation:popIn .5s both;touch-action:manipulation}
.choice:nth-child(2){animation-delay:.12s}
.choice:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.choice .ic{flex:0 0 64px;height:64px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.choice b{display:block;font-size:21px;font-weight:900;letter-spacing:.3px}
.choice span{display:block;font-size:14px;opacity:.92;margin-top:2px}
.c1{background:linear-gradient(160deg,#ff9a3d,#e8452c)}
.c2{background:linear-gradient(160deg,#4fd1ff,#3b5bdb)}
.timerbar{margin-top:16px;width:min(70vw,240px);height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.timerbar i{display:block;height:100%;width:100%;background:#ffd23f;transform-origin:left}
#retry{background:rgba(20,6,40,.72)}
#retry h2{margin:0;font-size:clamp(30px,9vw,40px);font-weight:900;text-shadow:0 4px 0 #a3243a,0 8px 18px rgba(0,0,0,.5);animation:popIn .5s both}
#retry p{margin:8px 0 22px;font-size:16px;opacity:.9}
.bigbtn{position:relative;overflow:hidden;border:0;border-radius:999px;padding:18px 44px;font:inherit;font-size:24px;font-weight:900;letter-spacing:1px;color:#3a1d00;background:linear-gradient(180deg,#ffe36b,#ffb11f);box-shadow:0 7px 0 #b86b00,0 14px 26px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation}
.bigbtn span{display:inline-block;animation:pulse 1.1s ease-in-out infinite}
.bigbtn:active{transform:translateY(4px);box-shadow:0 3px 0 #b86b00}
.halo{position:relative;display:inline-block;border-radius:999px}
.halo::before{content:"";position:absolute;inset:-8px;border-radius:999px;border:4px solid rgba(255,227,107,.8);animation:ring 1.4s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.bigbtn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 2.2s ease-in-out infinite}
#end{background:radial-gradient(ellipse at 50% 30%,#5b2aa8 0%,#2a1060 55%,#120626 100%)}
#end .rays{position:absolute;left:50%;top:32%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 10deg,transparent 10deg 20deg);animation:spin 30s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#end .logo{position:relative;animation:popIn .6s both, floaty 3s ease-in-out .6s infinite}
#end h1{position:relative;margin:4px 0 0;font-size:clamp(40px,13vw,58px);line-height:.95;font-weight:900;letter-spacing:1px;color:#ffe86b;text-shadow:0 4px 0 #d8661c,0 8px 0 #7a2a10,0 14px 24px rgba(0,0,0,.55);animation:popIn .6s .1s both}

<body>
<canvas id="c" aria-label="Castle Toss game area"></canvas>

  <div class="choices">

    <rect x="58" y="30" width="14" height="16" fill="url(#lgS)" stroke="#3b4048" stroke-width="3"/>

<script>
'use strict';
(function () {
// ================= Config =================
const QS = new URLSearchParams(location.search);
const TS = QS.has('fast') ? 0.3 : 1;          // ?fast shortens the session cap for testing
const SESSION_MS = 50000 * TS;                // end card appears by itself at the latest after this
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

// ================= Audio (Web Audio synth) =================
const AU = (function () {
  let ctx = null, master = null, sfx = null, mus = null, noiseBuf = null, musTimer = 0, nextT = 0, stepI = 0;
  const BPM = 116, STEP = 60 / BPM / 2;
  // melody (MIDI note numbers, 0 = rest), 32 eighth notes
  const MEL = [72,0,76,79, 0,76,74,72, 74,0,77,81, 0,79,77,76, 72,0,76,79, 84,0,81,79, 77,76,74,0, 72,0,0,0];
  const BAS = [48,0,48,0, 55,0,55,0, 50,0,50,0, 53,0,55,0, 48,0,48,0, 57,0,57,0, 53,0,55,0, 48,0,43,0];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function unlock() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (navigator.userActivation && !navigator.userActivation.isActive) return; // wait for a real activation
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0.9;
        const comp = ctx.createDynamicsCompressor();
        master.connect(comp); comp.connect(ctx.destination);
        sfx = ctx.createGain(); sfx.gain.value = 0.55; sfx.connect(master);
        mus = ctx.createGain(); mus.gain.value = 0.0001; mus.connect(master);
        mus.gain.setTargetAtTime(0.07, ctx.currentTime + 0.1, 0.8);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate | 0, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        nextT = ctx.currentTime + 0.15;
        musTimer = setInterval(schedule, 60);
      }
      if (ctx.state === 'suspended') ctx.resume().catch(function () {});
    } catch (e) { /* audio is optional */ }
  }
  function schedule() {
    if (!ctx || ctx.state !== 'running') return;
    while (nextT < ctx.currentTime + 0.25) {
      const i = stepI % 32;
      if (MEL[i]) note(mtof(MEL[i]), nextT, STEP * 1.6, 'triangle', 0.5, mus);
      if (BAS[i]) note(mtof(BAS[i]), nextT, STEP * 1.8, 'sine', 0.8, mus);
      if (i % 4 === 2) hat(nextT, mus);
      nextT += STEP; stepI++;
    }
  }
  function note(f, t, dur, type, vol, bus) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
  }
  function hat(t, bus) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random() * 0.5); s.stop(t + 0.06);
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, type, f0, f1, delay) {
    if (!ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime + (delay || 0);
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.setValueAtTime(f0 || 1000, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol || 0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfx); s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.05);
  }
  document.addEventListener('visibilitychange', function () {
    if (!ctx) return;
    if (document.hidden) ctx.suspend().catch(function () {}); else ctx.resume().catch(function () {});
  });
  return {
    unlock: unlock,
    stretch() { tone(160 + Math.random() * 60, 260, 0.08, 'sawtooth', 0.05); },
    launch() { noise(0.35, 0.5, 'bandpass', 400, 2400); tone(180, 60, 0.25, 'sine', 0.5); },
    thud(v) { const k = clamp(v, 0.2, 1); tone(140, 45, 0.18, 'sine', 0.55 * k); noise(0.12, 0.3 * k, 'lowpass', 900, 200); },
    crack(mat) {
      if (mat === 'ice') { tone(1800, 2600, 0.12, 'sine', 0.18); tone(2400, 1400, 0.18, 'triangle', 0.12, 0.03); noise(0.15, 0.25, 'highpass', 3000); }
      else if (mat === 'stone') { noise(0.25, 0.45, 'lowpass', 1400, 300); tone(90, 50, 0.2, 'square', 0.15); }
      else { noise(0.16, 0.45, 'bandpass', 1600, 700); tone(320, 120, 0.1, 'square', 0.12); }
    },
    poof() { tone(500, 1300, 0.16, 'sine', 0.3); tone(900, 300, 0.22, 'triangle', 0.15, 0.08); noise(0.2, 0.2, 'highpass', 2000); },
    boom() { noise(0.9, 0.9, 'lowpass', 1800, 60); tone(110, 30, 0.7, 'sine', 0.8); tone(70, 25, 0.9, 'sawtooth', 0.25); },
    win() { [0, 4, 7, 12, 16].forEach((s, i) => tone(523.25 * Math.pow(2, s / 12), 0, 0.22, 'square', 0.14, i * 0.09)); },
    fail() { [7, 4, 0, -5].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 0, 0.3, 'triangle', 0.2, i * 0.15)); },
    click() { tone(880, 1320, 0.07, 'square', 0.12); },
    split() { tone(700, 1400, 0.12, 'square', 0.12); noise(0.1, 0.2, 'highpass', 3000); },
    coin(i) { tone(988 * Math.pow(2, (i || 0) / 12), 0, 0.09, 'square', 0.1); tone(1319 * Math.pow(2, (i || 0) / 12), 0, 0.18, 'square', 0.1, 0.07); }
  };
})();
['pointerdown', 'pointerup', 'touchend', 'click'].forEach(function (ev) { window.addEventListener(ev, AU.unlock, true); });

// ================= Canvas / scaling =================
const cvs = document.getElementById('c');
const g = cvs.getContext('2d');
let VW = 360, VH = 640, DPR = 1, S = 1, OX = 0, OY = 0;
function resize() {
  VW = Math.max(1, window.innerWidth || 360); VH = Math.max(1, window.innerHeight || 640);
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cvs.width = Math.round(VW * DPR); cvs.height = Math.round(VH * DPR);
  S = Math.min(VW / 360, VH / 640);
  OX = (VW / S - 360) / 2; OY = (VH / S - 640) / 2;
}
window.addEventListener('resize', resize);
resize();
function toWorld(cx, cy) { return { x: cx / S - OX, y: cy / S - OY }; }

// ================= Physics (impulse-based rigid bodies) =================
const GRAV = 1100, SLOP = 0.4, BIAS = 0.2, ITER = 10, SUB = 2, PDT = 1 / 120;
const MAT = {
  wood:  { density: 1.0, friction: 0.65, hp: 600,  score: 100, col: '#d0924f', dark: '#7d4a22', light: '#efbd84' },
  stone: { density: 2.2, friction: 0.75, hp: 1250, score: 150, col: '#a2abb5', dark: '#58616c', light: '#d3d9e0' },
  ice:   { density: 0.8, friction: 0.4,  hp: 340,  score: 80,  col: '#a8e6ff', dark: '#4fa8d6', light: '#ecfaff' },
  tnt:   { density: 1.0, friction: 0.6,  hp: 200,  score: 300, col: '#dd4430', dark: '#7c1a10', light: '#ff8466' },
  ground:{ density: 1.0, friction: 0.8,  hp: 1e9,  score: 0 }
};
let bodies = [], arbs = new Map(), stamp = 0, bid = 1, settling = false;
const tmpC = [];
function addBody(b) {
  b.id = bid++; b.vx = 0; b.vy = 0; b.av = 0; b.a = b.a || 0; b.sleepT = 0; b.asleep = false; b.eim = 0; b.eiI = 0; b.dead = false; b.flash = 0;
  bodies.push(b); return b;
}
function makeBox(x, y, w, h, mat, isStatic) {
  const M = MAT[mat];
  const m = isStatic ? Infinity : w * h * M.density * 0.01;
  const I = isStatic ? Infinity : m * (w * w + h * h) / 12;
  return addBody({ kind: isStatic ? 'ground' : 'block', shape: 'box', x: x, y: y, hw: w / 2, hh: h / 2, bw: w, bh: h,
    m: m, im: isStatic ? 0 : 1 / m, I: I, iI: isStatic ? 0 : 1 / I, fr: M.friction, mat: mat, hp: M.hp, hp0: M.hp,
    br: Math.hypot(w, h) / 2, seed: Math.random() * 1000 });
}
function makeCircle(x, y, r, kind, density, fr, hp) {
  const m = Math.PI * r * r * density * 0.01, I = 0.5 * m * r * r;
  return addBody({ kind: kind, shape: 'circle', x: x, y: y, r: r, m: m, im: 1 / m, I: I, iI: 1 / I, fr: fr, br: r, hp: hp, hp0: hp, seed: Math.random() * 1000 });
}
function wake(b) { if (b.asleep) { b.asleep = false; b.sleepT = 0; } }
function moving(b) { return b.vx * b.vx + b.vy * b.vy > 25 || b.av * b.av > 0.01; }

function collideBB(A, B, out) {
  const ca = Math.cos(A.a), sa = Math.sin(A.a), cb = Math.cos(B.a), sb = Math.sin(B.a);
  const dpx = B.x - A.x, dpy = B.y - A.y;
  const dAx = ca * dpx + sa * dpy, dAy = -sa * dpx + ca * dpy;
  const dBx = cb * dpx + sb * dpy, dBy = -sb * dpx + cb * dpy;
  const c11 = ca * cb + sa * sb, c12 = -ca * sb + sa * cb, c21 = -sa * cb + ca * sb, c22 = sa * sb + ca * cb;
  const a11 = Math.abs(c11), a12 = Math.abs(c12), a21 = Math.abs(c21), a22 = Math.abs(c22);
  const faX = Math.abs(dAx) - A.hw - (a11 * B.hw + a12 * B.hh);
  const faY = Math.abs(dAy) - A.hh - (a21 * B.hw + a22 * B.hh);
  if (faX > 0 || faY > 0) return 0;
  const fbX = Math.abs(dBx) - (a11 * A.hw + a21 * A.hh) - B.hw;
  const fbY = Math.abs(dBy) - (a12 * A.hw + a22 * A.hh) - B.hh;
  if (fbX > 0 || fbY > 0) return 0;
  let axis = 0, sep = faX, nx = dAx > 0 ? ca : -ca, ny = dAx > 0 ? sa : -sa;
  const RT = 0.95, AT = 0.01;
  if (faY > RT * sep + AT * A.hh) { axis = 1; sep = faY; nx = dAy > 0 ? -sa : sa; ny = dAy > 0 ? ca : -ca; }
  if (fbX > RT * sep + AT * B.hw) { axis = 2; sep = fbX; nx = dBx > 0 ? cb : -cb; ny = dBx > 0 ? sb : -sb; }
  if (fbY > RT * sep + AT * B.hh) { axis = 3; sep = fbY; nx = dBy > 0 ? -sb : sb; ny = dBy > 0 ? cb : -cb; }
  let fnx, fny, front, snx, sny, side, negSide, posSide, inc;
  if (axis === 0) { fnx = nx; fny = ny; front = A.x * fnx + A.y * fny + A.hw; snx = -sa; sny = ca; side = A.x * snx + A.y * sny; negSide = -side + A.hh; posSide = side + A.hh; inc = incEdge(B, cb, sb, fnx, fny); }
  else if (axis === 1) { fnx = nx; fny = ny; front = A.x * fnx + A.y * fny + A.hh; snx = ca; sny = sa; side = A.x * snx + A.y * sny; negSide = -side + A.hw; posSide = side + A.hw; inc = incEdge(B, cb, sb, fnx, fny); }
  else if (axis === 2) { fnx = -nx; fny = -ny; front = B.x * fnx + B.y * fny + B.hw; snx = -sb; sny = cb; side = B.x * snx + B.y * sny; negSide = -side + B.hh; posSide = side + B.hh; inc = incEdge(A, ca, sa, fnx, fny); }
  else { fnx = -nx; fny = -ny; front = B.x * fnx + B.y * fny + B.hh; snx = cb; sny = sb; side = B.x * snx + B.y * sny; negSide = -side + B.hw; posSide = side + B.hw; inc = incEdge(A, ca, sa, fnx, fny); }
  let pts = clipSeg(inc, -snx, -sny, negSide); if (pts.length < 2) return 0;
  pts = clipSeg(pts, snx, sny, posSide); if (pts.length < 2) return 0;
  let n = 0;
  for (let i = 0; i < 2; i++) {
    const p = pts[i];
    const s = fnx * p[0] + fny * p[1] - front;
    if (s <= 0) { out.push({ x: p[0] - s * fnx, y: p[1] - s * fny, nx: nx, ny: ny, sep: s, Pn: 0, Pt: 0 }); n++; }
  }
  return n;

function update(dt) {
  time += dt;
  // session cap
  if (!ended && performance.now() - startTs > SESSION_MS && state !== 'end') {
    if (state === 'play' && !finale) { showBanner("TIME'S UP!", '', '#ffe86b', 1.2); state = 'over'; setTimeout(showEnd, 1100); }
    else if (state !== 'over') showEnd();
  }
  // physics
  if (state !== 'end') {
    for (let s = 0; s < SUB; s++) physStep(PDT);
    processDeaths();
  }
  for (const b of bodies) { if (b.flash > 0) b.flash -= dt; if (b.kind === 'enemy') { b.blink -= dt; if (b.blink < -0.12) b.blink = rand(1.5, 4); } }
  // out of bounds
  for (const b of bodies) {
    if (b.im === 0 || b.dead) continue;
    if (b.x < -160 - OX || b.x > 540 + OX || b.y > 1000) { b.dead = true; b.handled = b.kind !== 'enemy'; }
    if (b.kind === 'enemy' && b.x < HILL_X - 6 && b.y > HILL_Y + 30) b.dead = true;
  }
  processDeaths();
  if (killChainT > 0) { killChainT -= dt; if (killChainT <= 0) killChain = 0; }

  // projectiles
  for (const p of proj) {
    p.t += dt;
    p.trail.push(p.x, p.y); if (p.trail.length > 24) p.trail.splice(0, 2);
    if (p.canSplit && !p.touched && p.vy > 0 && p.t > 0.25) splitShot(p); // auto-split at apex
    if (p.fire && p.touched && !p.dead) { p.dead = true; p.handled = true; explode(p.x, p.y, 88, 640); }
    if (p.fire && !p.touched && Math.random() < 0.8) burst(p.x, p.y, 1, ['#ffcf3f', '#ff8a1f', '#ff4d1f'], 40, { shape: 'circ', size: 5, g: -60, life: 0.35 });
    if (p.t > 6 || (p.t > 1 && p.vx * p.vx + p.vy * p.vy < 400)) { p.fade = (p.fade || 0) + dt; if (p.fade > 0.6) { p.dead = true; p.handled = true; } }
  }
  proj = proj.filter(function (p) { return !p.dead; });
  removeDead();

  if (state === 'play') {
    shotT += dt;
    if (!canShoot) {
      const settled = proj.length === 0 || proj.every(function (p) { return p.vx * p.vx + p.vy * p.vy < 900 && p.t > 0.8; });
      if (shots > 0 && (shotT > 2.4 || (settled && shotT > 1.1))) { canShoot = true; loadT = 0; }
    }
    if (canShoot && loadT < 1) loadT = Math.min(1, loadT + dt * 3);
    // level clear
    if (enemiesLeft() === 0 && clearT < 0) clearT = 0;
    if (clearT >= 0) {
      clearT += dt;
      if (clearT > 0.7) { clearT = -1; levelClear(); }
    } else if (shots <= 0 && !canShoot) {
      const anyAwake = bodies.some(function (b) { return b.im && !b.asleep && b.kind !== 'proj'; });
      outcomeT += dt;
      if ((outcomeT > 1.5 && !anyAwake && proj.length === 0) || outcomeT > 4.5) fail();
    }

    idleT += dt;
    if (canShoot && !drag && idleT > (firstShotDone ? 5 : 2.5)) hintOn = true;
  }
  if (state === 'upgrade') {
    upgTimer += dt;
    $('upgBar').style.transform = 'scaleX(' + Math.max(0, 1 - upgTimer / 7) + ')';
    if (upgTimer > 7) chooseUpgrade(Math.random() < 0.5 ? 0 : 1);
  }
  if (hintOn) hintT += dt;

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.shape !== 'smoke' && p.shape !== 'ring' && p.y > GROUND_Y + 30) { p.y = GROUND_Y + 30; p.vy *= -0.3; p.vx *= 0.7; }
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; if (f.t > f.life) floats.splice(i, 1); }
  if (banner) { banner.t += dt; if (banner.t > banner.life) banner = null; }
  shake *= Math.pow(0.0015, dt); if (shake < 0.2) shake = 0;
  flashA = Math.max(0, flashA - dt * 1.8);
  shownScore += (score - shownScore) * Math.min(1, dt * 10);
  if (Math.abs(score - shownScore) < 1) shownScore = score;
}

    else { for (let i = 1; i < 3; i++) { g.beginPath(); g.moveTo(-w / 2 + w * i / 3, -h / 2 + 3); g.lineTo(-w / 2 + w * i / 3 + Math.sin(b.seed + i) * 1.5, h / 2 - 3); g.stroke(); } }
  } else if (b.mat === 'stone') {
    g.fillStyle = 'rgba(60,66,74,.35)';
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(Math.sin(b.seed * (i + 1)) * w * 0.3, Math.cos(b.seed * (i + 2)) * h * 0.3, 1.8, 0, 7); g.fill(); }
  } else if (b.mat === 'ice') {
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-w / 2 + 4, h / 2 - 6); g.lineTo(-w / 2 + Math.min(w, h) * 0.5, -h / 2 + 4); g.stroke();
  } else if (b.mat === 'tnt') {
    g.fillStyle = '#ffe9a8'; rr(-w / 2 + 3, -5, w - 6, 10, 2); g.fill();
    text('TNT', 0, 0.5, 9, '#7c1a10', 'center', false);
    g.strokeStyle = '#7c1a10'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, -h / 2); g.quadraticCurveTo(4, -h / 2 - 6, 8, -h / 2 - 5); g.stroke();
    if (Math.sin(time * 20) > 0) { g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(8, -h / 2 - 5, 2.5, 0, 7); g.fill(); }
  }
  // cracks
  const dmg = 1 - b.hp / b.hp0;
  if (dmg > 0.25) {
    g.strokeStyle = 'rgba(40,20,10,.65)'; g.lineWidth = 1.3;
    const nC = dmg > 0.6 ? 3 : 1;
    for (let i = 0; i < nC; i++) {
      const sx = Math.sin(b.seed + i * 3) * w * 0.3, sy = Math.cos(b.seed + i * 5) * h * 0.3;
      g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.sin(b.seed * 2 + i) * w * 0.25, sy + Math.cos(b.seed * 3 + i) * h * 0.25);
      g.lineTo(sx + Math.sin(b.seed * 4 + i) * w * 0.35, sy + Math.cos(b.seed * 5 + i) * h * 0.4); g.stroke();
    }
  }
  if (b.flash > 0) { g.fillStyle = 'rgba(255,255,255,' + (b.flash * 5) + ')'; rr(-w / 2, -h / 2, w, h, 3); g.fill(); }
  g.restore();
}
function drawEnemy(b) {
  const r = b.r;
  g.save(); g.translate(b.x, b.y);
  // shadow-ish squash breathing
  const br = 1 + Math.sin(time * 4 + b.seed) * 0.04;
  g.scale(1 / br, br);
  const body = b.boss ? ['#ff8ea0', '#c2304e', '#6e1426'] : ['#b79bff', '#6f45d8', '#32186e'];
  // horns
  g.fillStyle = b.boss ? '#ffe0a8' : '#f4e6c8'; g.strokeStyle = body[2]; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(-r * 0.6, -r * 0.6); g.lineTo(-r * 0.85, -r * 1.25); g.lineTo(-r * 0.25, -r * 0.85); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(r * 0.6, -r * 0.6); g.lineTo(r * 0.85, -r * 1.25); g.lineTo(r * 0.25, -r * 0.85); g.closePath(); g.fill(); g.stroke();
  const eg = g.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  eg.addColorStop(0, body[0]); eg.addColorStop(0.7, body[1]); eg.addColorStop(1, body[2]);
  g.fillStyle = eg; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
  g.lineWidth = 2; g.strokeStyle = body[2]; g.stroke();
  // eye
  let lx = 0, ly = 0;
  const tgt = proj[0] || { x: SLING.x, y: SLING.y };
  const ang = Math.atan2(tgt.y - b.y, tgt.x - b.x);
  lx = Math.cos(ang) * r * 0.14; ly = Math.sin(ang) * r * 0.14;
  const er = r * 0.42;
  g.fillStyle = '#fff'; g.beginPath(); g.arc(0, -r * 0.12, er, 0, 7); g.fill();
  if (b.blink > 0) { g.fillStyle = '#1b0f2e'; g.beginPath(); g.arc(lx, -r * 0.12 + ly, er * 0.5, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(lx - er * 0.18, -r * 0.12 + ly - er * 0.2, er * 0.16, 0, 7); g.fill(); }
  else { g.strokeStyle = '#1b0f2e'; g.lineWidth = 2; g.beginPath(); g.moveTo(-er, -r * 0.12); g.lineTo(er, -r * 0.12); g.stroke(); }
  if (b.boss) { g.strokeStyle = '#3a0a14'; g.lineWidth = 3; g.beginPath(); g.moveTo(-er * 1.1, -r * 0.62); g.lineTo(er * 1.1, -r * 0.42); g.stroke(); }
  // mouth
  g.strokeStyle = body[2]; g.lineWidth = 2; g.beginPath(); g.arc(0, r * 0.45, r * 0.22, Math.PI * 0.15, Math.PI * 0.85); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(-r * 0.12, r * 0.55); g.lineTo(-r * 0.05, r * 0.68); g.lineTo(r * 0.02, r * 0.56); g.fill();
  if (b.boss) {
    g.fillStyle = '#ffd23f'; g.strokeStyle = '#a86a00'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-r * 0.55, -r * 0.82); g.lineTo(-r * 0.6, -r * 1.35); g.lineTo(-r * 0.28, -r * 1.08); g.lineTo(0, -r * 1.45); g.lineTo(r * 0.28, -r * 1.08); g.lineTo(r * 0.6, -r * 1.35); g.lineTo(r * 0.55, -r * 0.82); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#ff4d6d'; g.beginPath(); g.arc(0, -r * 1.0, r * 0.09, 0, 7); g.fill();
  }
  if (b.flash > 0) { g.fillStyle = 'rgba(255,255,255,' + (b.flash * 5) + ')'; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); }
  g.restore();
  // health bar for boss
  if (b.boss) {
    const f = clamp(b.hp / b.hp0, 0, 1);
    g.fillStyle = 'rgba(0,0,0,.5)'; rr(b.x - 22, b.y - r - 22, 44, 7, 3.5); g.fill();
    g.fillStyle = f > 0.5 ? '#7dff6b' : '#ff6b6b'; rr(b.x - 21, b.y - r - 21, 42 * f, 5, 2.5); g.fill();
  }
}
function drawParticles() {
  for (const p of parts) {
    const k = 1 - p.t / p.life;
    g.globalAlpha = Math.min(1, k * 1.5);
    g.fillStyle = p.color;
    if (p.shape === 'sq') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7); g.restore(); }
    else if (p.shape === 'tri') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.beginPath(); g.moveTo(0, -p.size); g.lineTo(p.size * 0.7, p.size * 0.6); g.lineTo(-p.size * 0.7, p.size * 0.6); g.fill(); g.restore(); }
    else if (p.shape === 'circ') { g.beginPath(); g.arc(p.x, p.y, p.size * (0.4 + k * 0.6), 0, 7); g.fill(); }
    else if (p.shape === 'smoke') { g.globalAlpha = k * 0.55; g.beginPath(); g.arc(p.x, p.y, p.size * (1.6 - k * 0.8), 0, 7); g.fill(); }
    else if (p.shape === 'spark') { g.strokeStyle = p.color; g.lineWidth = p.size; g.lineCap = 'round'; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); g.stroke(); }
    else if (p.shape === 'ring') { g.globalAlpha = k; g.strokeStyle = '#fff'; g.lineWidth = 6 * k; g.beginPath(); g.arc(p.x, p.y, p.size * easeOutCubic(1 - k), 0, 7); g.stroke(); }
    else if (p.shape === 'star') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); star(0, 0, p.size, p.size * 0.45); g.fill(); g.restore(); }
  }
  g.globalAlpha = 1;
}
function star(x, y, R, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  g.closePath();
}
function drawHand(x, y, s, press) {
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(-0.3);
  g.fillStyle = 'rgba(0,0,0,.22)'; rr(-6, 26, 36, 32, 12); g.fill();
  g.lineJoin = 'round'; g.strokeStyle = '#2a1648'; g.lineWidth = 5;
  const parts5 = [[-6, 0, 12, 34, 6], [-9, 22, 34, 30, 11], [5, 17, 9, 15, 4.5], [13, 19, 9, 15, 4.5]];
  for (const q of parts5) { rr(q[0], q[1], q[2], q[3], q[4]); g.stroke(); }
  g.beginPath(); g.ellipse(-11, 34, 6, 10, -0.6, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#fff';
  for (const q of parts5) { rr(q[0], q[1], q[2], q[3], q[4]); g.fill(); }
  g.beginPath(); g.ellipse(-11, 34, 6, 10, -0.6, 0, Math.PI * 2); g.fill();
  g.restore();
  if (press) { g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 10 + press * 14, 0, 7); g.globalAlpha = 1 - press; g.stroke(); g.globalAlpha = 1; }
}
function drawHint() {
  if (!hintOn || state !== 'play' || !canShoot) return;
  const cyc = (hintT % 2.2) / 2.2;
  const pullK = cyc < 0.15 ? 0 : cyc < 0.65 ? easeOutCubic((cyc - 0.15) / 0.5) : cyc < 0.8 ? 1 : 0;
  const hx = SLING.x - 64 * pullK, hy = SLING.y + 52 * pullK;
  // arrow showing launch direction
  g.save(); g.globalAlpha = 0.85 * pullK;
  g.strokeStyle = '#fff'; g.lineWidth = 4; g.setLineDash([8, 7]); g.lineDashOffset = -time * 40;
  g.beginPath(); g.moveTo(SLING.x + 10, SLING.y - 8); g.quadraticCurveTo(SLING.x + 90, SLING.y - 150, SLING.x + 170, SLING.y - 70); g.stroke();
  g.setLineDash([]);
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(SLING.x + 180, SLING.y - 60); g.lineTo(SLING.x + 158, SLING.y - 66); g.lineTo(SLING.x + 174, SLING.y - 82); g.fill();
  g.restore();
  drawHand(hx + 4, hy + 4, 1, cyc < 0.15 ? cyc / 0.15 : 0);
  // instruction pill
  const msg = 'Drag back & release to fire!';
  g.font = '800 17px ' + FONT;
  const tw = g.measureText(msg).width + 32;
  const py = 150;
  g.fillStyle = 'rgba(25,8,50,.72)'; rr(180 - tw / 2, py - 20, tw, 40, 20); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.stroke();
  text(msg, 180, py + 1, 17, '#fff', 'center', false, 800);
}
function drawHUD() {
  const top = -OY + 12;
  // score
  g.fillStyle = 'rgba(25,8,50,.6)'; rr(10, top, 128, 38, 19); g.fill();
  g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(29, top + 19, 11, 0, 7); g.fill();
  g.strokeStyle = '#a86a00'; g.lineWidth = 2; g.stroke();
  g.fillStyle = '#fff6c2'; star(29, top + 19, 6.5, 2.8); g.fill();
  text(String(Math.round(shownScore)), 46, top + 20, 20, '#fff', 'left', 'rgba(25,8,50,.9)');
  // level
  g.fillStyle = 'rgba(25,8,50,.6)'; rr(148, top, 82, 38, 19); g.fill();
  text('LEVEL ' + (level + 1) + '/3', 189, top + 20, 14, '#ffe86b', 'center', false, 900);
  // shots
  g.fillStyle = 'rgba(25,8,50,.6)'; rr(240, top, 110, 38, 19); g.fill();
  const n = Math.max(0, shots - (canShoot && state === 'play' ? 1 : 0));
  const show = Math.min(6, n);
  for (let i = 0; i < show; i++) drawBoulder(258 + i * 16, top + 19, 6.5, 0, up.fire);
  if (n === 0) text('LAST', 295, top + 20, 13, '#ffb3b3', 'center', false);
  // session progress bar
  const f = clamp((performance.now() - startTs) / SESSION_MS, 0, 1);
  g.fillStyle = 'rgba(255,255,255,.18)'; rr(10, top + 44, 340, 4, 2); g.fill();
  g.fillStyle = f > 0.8 ? '#ff7b7b' : '#ffe86b'; rr(10, top + 44, 340 * (1 - f), 4, 2); g.fill();
  // upgrades owned
  let ux = 14;
  for (const k of ['split', 'heavy', 'fire', 'extra']) if (up[k]) {
    g.fillStyle = 'rgba(25,8,50,.6)'; rr(ux, top + 54, 74, 20, 10); g.fill();
    text(k === 'split' ? 'SPLIT' : k === 'heavy' ? 'HEAVY' : k === 'fire' ? 'FIRE' : '+2 SHOTS', ux + 37, top + 64.5, 10, k === 'fire' ? '#ffb15c' : '#7ef9ff', 'center', false);
    ux += 80;
  }
}
function drawBanner() {
  if (!banner) return;
  const t = banner.t, L = banner.life;
  const inK = clamp(t / 0.35, 0, 1), outK = clamp((L - t) / 0.3, 0, 1);
  const sc = easeOutBack(inK) * (0.6 + 0.4 * outK);
  g.save(); g.globalAlpha = outK; g.translate(180, 228); g.scale(sc, sc);
  g.fillStyle = 'rgba(25,8,50,.55)'; rr(-160, -44, 320, banner.sub ? 92 : 70, 22); g.fill();
  g.font = '900 36px ' + FONT;
  const bw = g.measureText(banner.text).width;
  text(banner.text, 0, -8, bw > 290 ? 36 * 290 / bw : 36, banner.color, 'center', '#3a1060');
  if (banner.sub) text(banner.sub, 0, 30, 16, '#fff', 'center', false, 700);
  g.restore();
}
function drawFloats() {
  for (const f of floats) {
    const k = f.t / f.life;
    const sc = k < 0.2 ? easeOutBack(k / 0.2) : 1;
    g.save(); g.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    g.translate(f.x, f.y - 46 * easeOutCubic(k)); g.scale(sc, sc);
    text(f.text, 0, 0, f.size, f.color, 'center', 'rgba(40,10,60,.9)');
    g.restore();
  }
}
function drawTrajectory() {
  if (!drag) return;
  const v = launchVel();
  if (v.pull < 16) return;
  let x = v.px, y = v.py, vx = v.x, vy = v.y;
  const st = 1 / 30;
  for (let i = 0; i < 26; i++) {
    for (let k = 0; k < 2; k++) { vy += GRAV * st / 2; x += vx * st / 2; y += vy * st / 2; }
    if (y > GROUND_Y || (x > HILL_X && y > HILL_Y)) break;
    const a = 1 - i / 28;
    g.fillStyle = 'rgba(255,255,255,' + (0.9 * a) + ')';
    g.beginPath(); g.arc(x, y, 4.2 - i * 0.1, 0, 7); g.fill();
  }
}
function render() {
  g.setTransform(DPR * S, 0, 0, DPR * S, DPR * S * OX, DPR * S * OY);
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  g.save(); g.translate(sx, sy);
  drawBackground();
  drawCatapult(false);
  // loaded boulder & bands
  const r = projRadius();
  const showLoaded = state === 'play' && canShoot && shots > 0;
  if (showLoaded) {
    const p = pulledPos();
    const ly = p.y - (1 - easeOutBack(loadT)) * 50;
    drawBand(p.x, ly, true);
    drawBoulder(p.x, ly, r, 0, up.fire);
  }
  for (const b of bodies) if (b.kind === 'block') drawBlock(b);
  for (const b of bodies) if (b.kind === 'enemy') drawEnemy(b);
  for (const p of proj) {
    g.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < p.trail.length; i += 2) { const a = i / p.trail.length; g.globalAlpha = a * 0.5; g.beginPath(); g.arc(p.trail[i], p.trail[i + 1], p.r * 0.5 * a + 1, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    drawBoulder(p.x, p.y, p.r, p.a, p.fire, p.fade ? 1 - p.fade / 0.6 : 1);
    if (p.canSplit && !p.touched) {
      const k = 0.5 + 0.5 * Math.sin(time * 16);
      g.strokeStyle = 'rgba(126,249,255,' + (0.5 + 0.5 * k) + ')'; g.lineWidth = 3; g.beginPath(); g.arc(p.x, p.y, p.r + 6 + k * 4, 0, 7); g.stroke();
      text('TAP!', p.x, p.y - p.r - 18, 15, '#7ef9ff', 'center');
    }
  }
  if (showLoaded) { const p = pulledPos(); drawBand(p.x, p.y - (1 - easeOutBack(loadT)) * 50, false); }
  drawCatapult(true);
  drawParticles();
  drawTrajectory();
  drawFloats();
  g.restore();
  drawHUD();
  drawHint();
  drawBanner();
  if (flashA > 0) { g.fillStyle = 'rgba(255,240,210,' + flashA + ')'; g.fillRect(-OX - 2, -OY - 2, 364 + OX * 2, 644 + OY * 2); }
}

// ================= Main loop =================
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  try { update(dt); render(); } catch (err) { if (!frame.warned) { frame.warned = true; setTimeout(function () { throw err; }); } }
}
level = clamp((parseInt(QS.get('lvl'), 10) || 1) - 1, 0, 2); // ?lvl=N jumps to a level (testing aid)
buildLevel(level);
showBanner('LEVEL ' + (level + 1), 'Knock out the Gloomlings!', '#ffe86b', 1.8);
document.body.setAttribute('data-state', 'play');
requestAnimationFrame(frame);
})();
</script>
