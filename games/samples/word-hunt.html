      const s = window.__WORD_HUNT?.state;
      return { score: s?.coins || 0, progress: (s?.total || 0) / 9 };
    }
    if (config.game === 'scrambly_merge_rush') {
      const s = window.__MERGE_RUSH?.state;
      return { score: Math.round((s?.coins || 0) * .3), progress: (s?.order || 0) / 3 };
    }
    const s = window.__DROP?.state;
    return { score: s?.rewardCents || 0, progress: (s?.rewardCents || 0) / 850 };
  }
  function flush() {
    while (!closed && socket?.readyState === 1 && queue.length) {
      try { socket.send(JSON.stringify([queue[0]])); queue.shift(); } catch { break; }
    }
  }
  function send(action, extra = {}) {
    if (!integrated || closed) return;
    const payload = { action, run_id: run, seq: ++seq, ...state(), ...extra };
    // Bound offline memory. Keep session boundaries so reconnect can re-arm correctly.
    if (queue.length >= maxQueue) {
      const disposable = queue.findIndex(x => !['game_start', 'restart', 'game_end'].includes(x.data.game.action));
      if (disposable >= 0) queue.splice(disposable, 1); else return;
    }
    queue.push({ type: 'GAMEPLAY', ad_id: config.ad, data: { game: payload } });
    flush();
  }
  function connect() {
    if (!integrated || closed) return;
    try { socket = new WebSocket(config.ws.replace(/\/$/, '') + '/minigames/update/' + encodeURIComponent(config.id)); }
    catch { reconnect(); return; }
    socket.onopen = () => { attempts = 0; flush(); };
    socket.onmessage = event => {
      try {
        const frame = JSON.parse(event.data);
        if (frame.kind === 'companion' && !closed) {
          // Pass through to the unchanged shared companion component.
          lastCompanion = frame;
          if (!companionPaused) chat?.applyCompanionFrame(lastCompanion);
        }
      } catch { /* A bad narrator frame cannot interrupt the local game. */ }
    };
    socket.onerror = () => {};
    socket.onclose = reconnect;
  }
  function reconnect() {
    if (!closed) retry = setTimeout(connect, Math.min(30000, 1000 * 2 ** Math.min(attempts++, 5)));
  }
  function startCompanion() {
    if (closed || chat || !viewable || document.hidden || typeof CharacterChatHandler !== 'function') return;
    try {
      chat = new CharacterChatHandler(config.id, config.api, { skipChatWs: true });
      chat.root.classList.remove('hidden');
      chat.start();
      if (lastCompanion) chat.applyCompanionFrame(lastCompanion);
    } catch { chat = null; }
  }
  function syncCompanion() {
    if (!viewable || document.hidden) {
      // Cancel typing and its expiry timers; replay the latest message on return.
      companionPaused = true;
      if (chat) {
        chat._pendingFrame = null;
        chat.hideNpcMessage(true);
        chat.root.classList.add('hidden');
      }
    } else {
      const wasPaused = companionPaused;
      companionPaused = false;
      if (!chat) startCompanion();
      else if (wasPaused && !closed) {
        chat.root.classList.remove('hidden');
        if (lastCompanion) chat.applyCompanionFrame(lastCompanion);
      }
    }
  }
  function end(outcome) {
    if (finished) return;
    finished = true;
    send('game_end', { outcome });
    fadeMusic();
  }
  function fadeMusic() {
    clearInterval(fade);
    if (!music) return;
    fade = setInterval(() => {
      music.volume = Math.max(0, music.volume - .015);
      if (music.volume <= .001) { clearInterval(fade); music.pause(); }
    }, 40);
  }
  function startMusic() {
    if (closed || finished || document.hidden) return;
    const live = window.__DROP?.live ?? window.__MERGE_RUSH?.live ?? window.__WORD_HUNT?.state.ready;
    if (!live) return;
    if (!music) { music = new Audio(config.music); music.loop = true; }
    clearInterval(fade); music.volume = .12;
    music.play().catch(() => {});
  }
  function close() {
    if (closed) return;
    end('closed');
    closed = true;
    clearTimeout(retry); clearInterval(fade);
    socket?.close(); chat?.cleanup();
    if (music) { music.pause(); music.removeAttribute('src'); music.load(); }
  }
  window.__SCRAMBLY_SIMULA_EVENT = data => {
    if (closed) return;
    const name = data.event || data.action;
    if (data.type === 'FUNNEL_EVENT' && data.stage === 'viewable' && !started) {
      started = true; send('game_start');
    }
    if (data.type === 'PLAYABLE_EVENT') {
      if (name === 'replay') { run++; finished = false; send('restart'); startMusic(); }
      else if (['outcome', 'complete', 'game_completed'].includes(name)) end(outcomeOf(data.outcome));
      else {
        const verbs = { drop: 'drop', word_found: 'word_found', invalid_trace: 'trace', hint_used: 'hint', hint: 'hint', undo: 'undo', order_complete: 'serve', move: 'move', swap: 'move' };
        // Reward Drop merges are physics callbacks. Only the player's drop is counted.
        const action = verbs[name] || (name === 'merge' && config.game === 'scrambly_merge_rush' ? 'merge' : null);
        if (action) send(action, { detail: String(data.data?.word || data.word || name).slice(0, 80) });
      }
    }
    if (data.type === 'CLEANUP_COMPLETE') close();
  };
  window.__SCRAMBLY_SIMULA_VISIBILITY = visible => {
    viewable = visible;
    syncCompanion();
    if (!visible) music?.pause();
    else if (music) startMusic();
  };
  addEventListener('pointerdown', startMusic, true);
  addEventListener('keydown', startMusic, true);
  addEventListener('message', e => {
    if (e.source !== parent) return;
    if (e.data?.type === 'CLOSE_GAME') close();
    if (e.data?.type === 'GAME_VIEWABLE') {
      viewable = !!e.data.viewable;
      syncCompanion();
      if (!viewable) music?.pause();
      else setTimeout(() => { if (music) startMusic(); }, 0);
    }
  });
  document.addEventListener('visibilitychange', () => {
    syncCompanion();
    if (document.hidden) music?.pause(); else if (music) startMusic();
  });
  addEventListener('pagehide', close);
  addEventListener('DOMContentLoaded', () => {
    startCompanion();
    connect();
  });
})();

:root{--ink:#0c0818;--panel:#161221;--orange:#ff6915;--orange-deep:#eb5907;--gold:#faad31;--white:#f5f5f5;--muted:#b9adc8;--purple:#a36af5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Montserrat,Arial,sans-serif;color:var(--white)}
body{background:#080611}button{-webkit-tap-highlight-color:transparent;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #c6a1ff;outline-offset:4px}
.app{height:100svh;max-width:460px;margin:auto;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--ink);isolation:isolate}
.hero{height:28%;min-height:230px;max-height:250px;position:relative;flex:none;overflow:hidden;background:radial-gradient(ellipse at 84% 80%,#763821 0%,#341d2d 40%,var(--ink) 76%)}
.hero:before{content:'';position:absolute;width:195px;height:195px;right:-10px;bottom:-24px;border:1px solid #ff94462a;border-radius:50%;box-shadow:0 0 0 19px #ff883409,0 0 0 42px #ff883406}
.hero:after{content:'';position:absolute;inset:auto 0 0;height:35px;background:linear-gradient(transparent,var(--ink));pointer-events:none;z-index:1}
.hud{position:absolute;z-index:4;inset:16px 21px auto;display:flex;align-items:center;justify-content:space-between}
.icon-btn{width:38px;height:38px;border:1px solid #584361;background:#21192e;color:#ede2f7;border-radius:50%;font-size:20px}
.wallet{min-width:111px;min-height:43px;background:#fff4e4;border:2px solid #ffddb3;border-radius:24px;padding:5px 13px 6px 6px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #a652202a;color:#321b17}
.wallet strong{font-size:23px;line-height:1;font-weight:850;display:block;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.coin{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50%;background:linear-gradient(135deg,#ffe6a2 0%,#ffb447 35%,#ff7718 85%);border:2px solid #ffcc77;box-shadow:0 3px 0 #ac480e,inset 0 0 0 2px #e7831e;color:#873c12;font:850 21px/1 Montserrat,Arial;text-shadow:0 1px #ffd77a}
.hero-title{position:absolute;left:24px;top:87px;z-index:3;width:46%;pointer-events:none}
.hero-title .brand-logo{width:109px;height:auto;display:block;margin-bottom:12px}
.hero h1{font-size:43px;line-height:.96;font-weight:850;letter-spacing:-2.1px;margin:0;color:#fff8ef;text-shadow:0 3px 15px #0003}
.hero h1 span{display:block;color:#ff8a38}
.hero>.hero-fox{position:absolute;width:48%;height:calc(100% - 56px);right:7px;bottom:0;object-fit:contain;object-position:center bottom;z-index:2;filter:drop-shadow(0 8px 13px #0005);transform-origin:50% 88%;pointer-events:none}
.hero-spark{position:absolute;color:#ffb455;z-index:2;font-size:18px;right:10px;bottom:82px;opacity:.8}.hero-spark.second{right:43%;bottom:42px;font-size:13px}
.play-area{z-index:3;flex:1;min-height:0;background:linear-gradient(#1a1426,var(--panel));border-radius:27px 27px 0 0;margin-top:-13px;padding:21px 25px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 -1px 0 #6b48764d}
.progress{display:flex;gap:7px;margin:0 0 17px;height:7px;flex:none}.progress i{width:7px;height:7px;border-radius:10px;background:#51425c;transition:width .25s,background .25s}.progress i.active{width:24px;background:var(--orange)}.progress i.done{background:#b876f5}
.words{width:100%;max-width:354px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 19px;flex:none}
.word{min-width:0;padding:10px 6px 8px;border:1px solid #473151;border-bottom:3px solid #362442;border-radius:15px;background:#271d35;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;letter-spacing:.8px;font-weight:800;transition:background .2s,color .2s}
.word-price{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:66px;padding:5px 8px 5px 10px;border-radius:5px;background:#ffc567;color:#643713;font-size:12px;line-height:1;letter-spacing:0;clip-path:polygon(7px 0,100% 0,100% 100%,7px 100%,0 50%)}
.word-price i{width:4px;height:4px;border-radius:50%;background:#fff4e2;box-shadow:inset 0 0 0 1px #bf7f28;flex:none}
.word.complete{background:#342348;border-color:#654584;color:#d7bee9}.word.complete .word-name{text-decoration:line-through;text-decoration-thickness:2px}.word.complete .word-price{background:#b6a0d7;color:#392248}.word.complete .word-price i{width:10px;height:auto;background:none;box-shadow:none}.word.complete .word-price i:before{content:'✓';font-size:11px;font-style:normal}
.board-shell{width:100%;max-width:354px;flex:none;background:#30213f;border:1px solid #5a3e6e;border-radius:24px;padding:12px;box-shadow:inset 0 2px 6px #120c2099,0 6px 0 #0e0917,0 9px 25px #0002;position:relative;user-select:none;touch-action:none}
.board-wrap{width:100%;aspect-ratio:1;position:relative}.board{height:100%;display:grid;grid-template-columns:repeat(var(--size,4),1fr);grid-template-rows:repeat(var(--size,4),minmax(0,1fr));gap:8px;touch-action:none}
.tile{position:relative;border:0;background:none;padding:0;min-width:0;min-height:0;display:grid;place-items:center;touch-action:none;font:850 var(--letter-size,28px)/1 Montserrat,Arial;color:#281831}
.tile:before{content:'';position:absolute;inset:0;border:1px solid #fff9f1;border-radius:12px;background:linear-gradient(#fffaf4,#f3e7e0);box-shadow:0 4px 0 #a590ab,0 5px 6px #12072033;transition:background .13s,box-shadow .13s}
.tile>span{position:relative;z-index:3;pointer-events:none;text-shadow:0 1px 2px #fff5}.tile.selected:before{background:#ffb45e;border-color:#ffd09a;box-shadow:0 2px 0 #b35f23}.tile.selected>span{color:#492018}.tile.found:before{background:linear-gradient(#e2cbff,#c19be9);border-color:#edddff;box-shadow:0 3px 0 #8a62b4}.tile.hint:before{outline:3px solid var(--orange);outline-offset:-3px}
.trace{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible;filter:drop-shadow(0 2px 2px #a3421230)}.trace polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}.trace-shadow{stroke:var(--orange);stroke-width:13}.trace-light{stroke:#ffdda7;stroke-width:5}.trace circle{fill:#ffe1b0;stroke:var(--orange-deep);stroke-width:3}.trace.confirmed .trace-shadow{stroke:#8251b9}.trace.confirmed .trace-light{stroke:#f0d6ff}.trace.confirmed circle{stroke:#8251b9;fill:#f0d6ff}
